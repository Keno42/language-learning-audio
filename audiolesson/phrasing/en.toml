# Instructor phrasing when the learner's known language is English.
# {placeholders} are filled by audiolesson/exercises.py. Lists = random variety.

lesson_open = "Lesson {n}."
lesson_intro = "Speak your answers out loud during the silences. Don't worry about mistakes."
lesson_goal = "Today's goal: {goal}"
lesson_close = "That's the end of lesson {n}. Well done."
final_block = "To finish, let's go back over today's new material."
final_block_some = "To finish, let's go back over some of today's new material."  # the closing leaves some of today's new items out (each said as often as a lesson allows; lesson 35)

intro_new = "Something new. {meaning}"
listen = "Listen."
listen_again = "Listen again."
repeat = "Repeat."
once_more = "Once more."
build_up = "Let's build it up from the end. Repeat each part."
slowly = "Slowly."
natural = "And at natural speed."
split_slowly = "Slowly, in parts. Repeat each part."
slow_word_intro = "A word in this one is hard to say. First the sentence."
slow_word_intro_word = "This word is hard to say."
# a sentence the learner reported hard (#337, #423): tried again from its meaning, then the model, then slowly and at natural speed
slow_hear_intro = "Let's try to say this sentence in {language} again: {meaning}"
note_pieces = "Now the pieces, slowly, one at a time."

# issue #59: the meaning comes first, so completing «Ég skil…» is a retrieval of "I don't
# understand", not a guess at which authored phrase the course has in mind
cloze = "Complete the sentence to say: {meaning}"
hinted = "Say: {meaning} It starts with:"
scene_say = "{scene} Say: {meaning}"  # the scene check's line, then what to say (owner, 2026-10-16)
meaning = [
  "How do you say: {meaning}",
  "Say: {meaning}",
  "In {language}, say: {meaning}",
]
# issue #68: the novelty claim only when the generated sentence was never presented before
meaning_in_context = [
  "Say: {meaning}, as in: {context}",
  "How do you say {meaning}, as in: {context}",
]
recombine_new = "Now something you haven't heard yet. Say: {meaning}"
recombine = [
  "Put it together yourself. Say: {meaning}",
  "Your turn. Say: {meaning}",
]
# #287: a link is promised only when the exercise just before practised the same pattern / item
recombine_again = "Use the pattern again. Say: {meaning}"
recombine_vocab = "In a sentence. Say: {meaning}"
recombine_vocab_again = "Use it in a sentence. Say: {meaning}"
# the lead of a cue that carries news (#197) or a link (#287), kept before a sentence's scene, which takes the place of the rest
recombine_new_lead = "Now something you haven't heard yet."
recombine_again_lead = "Use the pattern again."
recombine_vocab_again_lead = "Use it in a sentence."
also = "You could also say:"

construction_intro = "Here is a useful pattern. {meaning}"
intro_whole = "A new expression. {meaning}"
construction_of_known = "It is a pattern: you can say it with other words."
construction_of_known_later = "It is a pattern: other words can go in its place. You will meet them later."  # no other known filler yet: no swap is promised now (lesson 34, «hnetum»)
construction_slot = "You can put other words in the same place."
construction_slot_later = "Other words can go in the same place. You will meet them later."  # no other known filler yet: the swap is promised for later (the claims check)
slot_word = "something"

transform_intro = "Listen to how the sentence changes."
transform_becomes = "becomes"
transform_try = "Now you try."
transform_same = "Same change:"  # a transform's instruction after its two narrations in full, while the transform asked last had it (G12; lesson 31: 9 times)

dialogue_partner_said = "{meaning}"
aside = "A quick aside."
aside_end = "Back to the lesson."
listening_back = "Back to speaking."  # after a pick-out or a catch, when a drill follows: the listening is over (lesson 34: the switch felt abrupt)
conversation_back = "That's the end of the conversation."  # after a conversation, when a drill follows (#415: lessons 37 and 39)
milestone_intro = "Here's a pattern worth noticing."
milestone_end = "Let's continue."
# the partner's line is the cue (Item.prompt_by): frames each such cue, unless the one before was a cue too
reply = "Reply."
reply_example = "For example: {meaning}"  # after «Reply.» and the partner's line: what to answer, as one possible answer (lesson 29)
# a part heard in a sentence instead of being introduced on its own (LearnerState.embedded)
embed_known = "You know this:"
embed_part = "This word is in it:"
embed_part_also = "And this one:"
# a noun in a form its frame asks (#270): the basic word, said once, after the part
form_of_base = "In this sentence the word changes. The basic word is:"
form_known_as = "You know it as:"
embed_sentence = "In another sentence. Listen, then repeat."
embed_meaning = "{meaning}"
# a construction's negative or question form modelled before it is asked (#211)
form_model_known = "You know this one:"
form_model_question = "As a question:"
form_model_negative = "As a negative:"
form_model_again = "Now the same form with another word."  # the cue follows: no «Your turn.» ahead of its task (lesson 36, #409)
instance_sentence = "A sentence from a pattern you know. Listen, then repeat."
instance_form_known = "You know this one:"
instance_form_question = "As a question: listen, then repeat."
instance_form_negative = "As a negative: listen, then repeat."
# a near form of something the learner has met (Item.variant_of)
variant_known = "You know this one:"
variant_form = "Here is another form of it: {meaning}"
# a dialogue with an expression or two the learner hasn't learned, played as listening (H8)
listening_intro = "A conversation to listen to. It has a few new expressions in it. You don't need to remember them: just hear how it goes."
# the same, when some of the learner's lines in it are ones they know and will be asked for (#240)
listening_intro_some_asked = "A conversation to listen to. It has a few new expressions in it: just hear those. You don't need to remember them. When a line you know comes, say it."
# a scene played again, every line of the learner's one they can say (#263): nothing new, nothing only heard
listening_intro_known = "The conversation again. You know your lines: say them when it's your turn."
# the same, with the learner's short set replies played in the model voice (#416): what is asked and what is played
listening_intro_known_voiced = "The conversation again. Answer when you're told what to say. Short replies like yes, no and thanks are played for you."
# any other exchange played again with short set replies played for the learner (#416)
dialogue_voiced_note = "Answer when you're told what to say. Short replies like yes, no and thanks are played for you."
listening_line = "Here you would say:"
dialogue_start = "Now a short conversation."
dialogue_replay = "Now the whole conversation, without pauses."
# an authored exchange: one scene, with a partner line between the two answers
connect_intro = "Let's put a couple of things together."
# two unrelated situations back to back (issues #69, #78): framed as review, never as a
# connection or a continuation
mixed_review_intro = "Quick review: two separate situations."
connect_next = "Now another situation."

# the words follow the speaker's gender (Item.target_m): say which one is asked for
speak_as_f = "As a woman: {prompt}"
speak_as_m = "As a man: {prompt}"
speak_as_f_alone = "As a woman."
speak_as_m_alone = "As a man."
man_says = "A man says:"

# a listening exercise of the second half (#248): the question after a sentence heard, and the unknown word to catch
# the same, when the scene was named: whose line it is
# a pick-out (#303): the need comes first, after the scene, and the line is heard for it
# #409: the action first, then what to listen for, still before the line (#303): «You want to know …» opened like a speaking task (lesson 36)
pick_out_need_price = "Listen for the price, then say it."
pick_out_need_time = "Listen for the time, then say it."
pick_out_need_count = "Listen for how many, then say it."
pick_out_need_place = "Listen for where it is, then say it."
pick_out_need_duration = "Listen for how long it takes, then say it."
pick_out_need_ask = "Listen, then answer: {ask}"
pick_out_answer = "The answer:"
pick_out_again = "Listen again."
speaker_he = "he"
speaker_she = "she"
catch_unknown_context = "You heard: {context} Ask what the missing word means."
catch_unknown_pointer = "Ask what {pointer} means."
# #279: the partner answers the question; the narrator only reports it, then the line is heard again with its meaning known
catch_unknown_told = "{who} tells you:"
catch_unknown_means = "means: {meaning}"
catch_unknown_again = "Now listen again."

[language_names]
fr = "French"
es = "Spanish"
de = "German"
it = "Italian"
pt = "Portuguese"
ja = "Japanese"
zh = "Chinese"
ko = "Korean"
en = "English"
nl = "Dutch"
is = "Icelandic"

