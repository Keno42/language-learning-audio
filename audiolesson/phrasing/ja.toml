form_known_as = "もう知っている形は："
embed_sentence = "別の文で聞きます。聞いて、繰り返してください。"
embed_meaning = "「{meaning}」"
# 疑問・否定の形を、出題の前に一度見せる (#211)
form_model_known = "知っている文です："
form_model_question = "疑問文にすると："
form_model_negative = "否定文にすると："
form_model_again = "別の単語で、同じ形です。"
