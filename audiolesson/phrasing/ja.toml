instance_form_question = "疑問文にします。聞いて、繰り返してください。"
instance_form_negative = "否定文にします。聞いて、繰り返してください。"
# a near form of something the learner has met (Item.variant_of)
variant_known = "知っている形です："
variant_form = "別の形です。「{meaning}」。"
# a dialogue with an expression or two the learner hasn't learned, played as listening (H8)
listening_intro = "聞くための会話です。新しい表現が少し出てきますが、覚えなくて大丈夫です。流れを聞いてください。"
# the same, when some of the learner's lines in it are ones they know and will be asked for (#240)
listening_intro_some_asked = "聞くための会話です。新しい表現が少し出てきますが、それは聞くだけで、覚えなくて大丈夫です。知っている表現の番が来たら、言ってください。"
# a scene played again, every line of the learner's one they can say (#263)
listening_intro_known = "もう一度、同じ会話です。あなたの番の表現は知っているものです。番が来たら言ってください。"
# the same, with the learner's short set replies played in the model voice (#416)
