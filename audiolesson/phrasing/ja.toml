# 言いにくいと報告された項目 (lesson 44): まず意味から言ってもらい、それから区切って練習する
slow_word_recall = "「{meaning}」は何と言うか覚えていますか？"
slow_word_break_down = "発音を区切って練習しましょう。それぞれ繰り返してください。"
slow_hear_intro = "この文を、もう一度{language}で言ってみましょう。「{meaning}」"
hear_support_sentence = "聞き取りにくかった文です。聞いてください。"
hear_support_word = "聞き取りにくかった単語です。聞いてください。"
hear_support_find = "次の文の中からこの単語を聞き取って、言ってください。"
hear_support_again = "もう一度、文全体を聞いてください。"
note_pieces = "では、部分ごとにゆっくり、一つずつ聞きましょう。"

# issue #59: 何を言いたいのかを先に示す（「Ég skil…」だけでは「わかりません」か判別できない）
cloze = "「{meaning}」と言うように、文を完成させてください。"
hinted = "「{meaning}」と言ってください。最初は…"
scene_say = "{scene}「{meaning}」と言ってください。"  # the scene check's line, then what to say (owner, 2026-10-16)
meaning = [
  "「{meaning}」は、何と言いますか？",
  "「{meaning}」と言ってください。",
  "{language}で「{meaning}」と言ってください。",
]
# issue #68: 「まだ聞いたことのない文」は、本当に初めての文のときだけ
meaning_in_context = [
  "「{meaning}」と言ってください。たとえば「{context}」というときの形です。",
  "「{context}」というときの「{meaning}」は、何と言いますか？",
]
recombine_new = "まだ聞いたことのない文です。「{meaning}」と言ってください。"
recombine = [
  "自分で組み立ててください。「{meaning}」。",
  "あなたの番です。「{meaning}」と言ってください。",
]
# #287: 前の練習が同じパターン・項目のときだけ、つながりを言う
recombine_again = "同じパターンでもう一度。「{meaning}」と言ってください。"
recombine_vocab = "文で言ってください。「{meaning}」。"
recombine_vocab_again = "文の中で使ってください。「{meaning}」。"
# the lead of a cue that carries news (#197) or a link (#287), kept before a sentence's scene, which takes the place of the rest
recombine_new_lead = "まだ聞いたことのない文です。"
recombine_again_lead = "同じパターンでもう一度。"
recombine_vocab_again_lead = "文の中で使ってください。"
also = "こうも言えます。"

