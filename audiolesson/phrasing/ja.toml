# 学習者の既知言語が日本語のときのインストラクターの言い回し。

lesson_open = "レッスン{n}。"
lesson_intro = "無音の間に、声に出して答えてください。間違えても大丈夫です。"
lesson_close = "レッスン{n}はこれで終わりです。お疲れさまでした。"
final_block = "最後に、今日の新しい表現をもう一度確認しましょう。"

intro_new = "新しい表現です。「{meaning}」。"
listen = "聞いてください。"
listen_again = "もう一度聞いてください。"
repeat = "繰り返してください。"
once_more = "もう一度。"
build_up = "後ろから組み立てましょう。それぞれ繰り返してください。"
slowly = "ゆっくり。"
natural = "自然な速さで。"

# issue #59: 何を言いたいのかを先に示す（「Ég skil…」だけでは「わかりません」か判別できない）
cloze = "「{meaning}」と言うように、文を完成させてください。"
hinted = "「{meaning}」と言ってください。最初は…"
meaning = [
  "「{meaning}」は、何と言いますか？",
  "「{meaning}」と言ってください。",
  "{language}で「{meaning}」と言ってください。",
]
# issue #68: 「まだ聞いたことのない文」は、本当に初めての文のときだけ
recombine_new = "まだ聞いたことのない文です。「{meaning}」と言ってください。"
recombine = [
  "自分で組み立ててください。「{meaning}」。",
  "同じパターンでもう一度。「{meaning}」と言ってください。",
]
recombine_vocab = "文の中で使ってください。「{meaning}」。"
also = "こうも言えます。"

construction_intro = "便利なパターンです。「{meaning}」。"
construction_slot = "同じ場所に、ほかの言葉を入れることができます。"
slot_word = "なにか"

transform_intro = "文がどう変わるか、聞いてください。"
transform_becomes = "こうなります。"
transform_try = "では、やってみましょう。"

dialogue_partner_said = "「{meaning}」"
aside = "ちょっとした話です。"
aside_end = "では、レッスンに戻りましょう。"
milestone_intro = "気づいてほしいパターンがあります。"
milestone_end = "では、続けましょう。"
dialogue_replay = "では、会話全体を通して聞きましょう。"
connect_intro = "いくつかつなげてみましょう。"
# issue #69: 無関係な2つの場面をつなぐだけの練習なので、「そして」のような連続を示す言い方はしない
connect_next = "次は、別の場面です。"

