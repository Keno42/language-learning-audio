# #438: a scene heard again once the lesson has said that short replies are played
listening_intro_again = "もう一度、同じ会話です。"
dialogue_voiced_note = "言うことの指示が出たら、答えてください。「はい」「いいえ」「ありがとう」などの短い返事は、音声で流れます。"
