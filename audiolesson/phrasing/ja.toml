# 学習者の既知言語が日本語のときのインストラクターの言い回し。

lesson_open = "レッスン{n}。"
lesson_intro = "無音の間に、声に出して答えてください。間違えても大丈夫です。"
lesson_close = "レッスン{n}はこれで終わりです。お疲れさまでした。"
final_block = "最後に、今日の新しい表現をもう一度確認しましょう。"

intro_new = "新しい表現です。「{meaning}」。"
listen = "聞いてください。"
listen_again = "もう一度聞いてください。"
repeat = "繰り返してください。"
once_more = "もう一度。"
build_up = "後ろから組み立てましょう。それぞれ繰り返してください。"
slowly = "ゆっくり。"
natural = "自然な速さで。"

# issue #59: 何を言いたいのかを先に示す（「Ég skil…」だけでは「わかりません」か判別できない）
cloze = "「{meaning}」と言うように、文を完成させてください。"
hinted = "「{meaning}」と言ってください。最初は…"
meaning = [
  "「{meaning}」は、何と言いますか？",
  "「{meaning}」と言ってください。",
  "{language}で「{meaning}」と言ってください。",
]
# issue #68: 「まだ聞いたことのない文」は、本当に初めての文のときだけ
meaning_in_context = [
  "「{meaning}」と言ってください。たとえば「{context}」というときの形です。",
  "「{context}」というときの「{meaning}」は、何と言いますか？",
]
recombine_new = "まだ聞いたことのない文です。「{meaning}」と言ってください。"
recombine = [
  "自分で組み立ててください。「{meaning}」。",
  "同じパターンでもう一度。「{meaning}」と言ってください。",
]
recombine_vocab = "文の中で使ってください。「{meaning}」。"
also = "こうも言えます。"

construction_intro = "便利なパターンです。「{meaning}」。"
construction_slot = "同じ場所に、ほかの言葉を入れることができます。"
slot_word = "なにか"

transform_intro = "文がどう変わるか、聞いてください。"
transform_becomes = "こうなります。"
transform_try = "では、やってみましょう。"

dialogue_partner_said = "「{meaning}」"
aside = "ちょっとした話です。"
aside_end = "では、レッスンに戻りましょう。"
milestone_intro = "気づいてほしいパターンがあります。"
milestone_end = "では、続けましょう。"
# the partner's line is the cue (Item.prompt_by): frames each such cue, unless the one before was a cue too
reply = "答えてください。"
# a part heard in a sentence instead of being introduced on its own (LearnerState.embedded)
embed_known = "知っているフレーズです："
embed_part = "この中の単語です："
embed_sentence = "別の文で聞きます。聞いて、繰り返してください。"
embed_meaning = "「{meaning}」"
# 疑問・否定の形を、出題の前に一度見せる (#211)
form_model_known = "知っている文です："
form_model_question = "疑問文にすると："
form_model_negative = "否定文にすると："
form_model_again = "別の単語で、同じ形です。今度はあなたの番です。"
instance_sentence = "知っている型の文です。聞いて、繰り返してください。"
# a near form of something the learner has met (Item.variant_of)
variant_known = "知っている形です："
variant_form = "別の形です。「{meaning}」。"
# a dialogue with an expression or two the learner hasn't learned, played as listening (H8)
listening_intro = "聞くための会話です。新しい表現が少し出てきますが、覚えなくて大丈夫です。流れを聞いてください。"
# the same, when some of the learner's lines in it are ones they know and will be asked for (#240)
listening_intro_some_asked = "聞くための会話です。新しい表現が少し出てきますが、それは聞くだけで、覚えなくて大丈夫です。知っている表現の番が来たら、言ってください。"
listening_line = "ここでは、こう言います。"
dialogue_start = "ここからは短い会話です。"
dialogue_replay = "では、会話全体を通して聞きましょう。"
# 作成済みのやりとり：一つの場面で、二つの答えの間に相手のせりふが入る
connect_intro = "いくつかつなげてみましょう。"
# 無関係な二つの場面を続けるだけの練習（issue #69, #78）：つながりや続きではなく、復習として示す
mixed_review_intro = "ここで復習です。別々の場面を二つ続けます。"
connect_next = "次は、別の場面です。"

# the words follow the speaker's gender (Item.target_m): say which one is asked for
speak_as_f = "女性として：{prompt}"
speak_as_m = "男性として：{prompt}"
speak_as_f_alone = "女性として答えてください。"
speak_as_m_alone = "男性として答えてください。"
man_says = "男性はこう言います。"

# a listening exercise of the second half (#248): the question after a sentence heard, and the unknown word to catch
pick_out_price = "いくらと言っていましたか？"
pick_out_time = "いつと言っていましたか？"
pick_out_count = "いくつと言っていましたか？"
pick_out_place = "どこだと言っていましたか？"
pick_out_price_scene = "いくらと言っていましたか？"
pick_out_time_scene = "いつと言っていましたか？"
pick_out_count_scene = "いくつと言っていましたか？"
pick_out_place_scene = "どこだと言っていましたか？"
speaker_he = "男性"
speaker_she = "女性"
catch_unknown = "知らない単語が一つありました。その単語を言って、意味を聞いてください。"

