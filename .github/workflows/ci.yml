name: ci
# One run per commit: a push to main (after a merge), and a pull request opened, pushed to or reopened. Both events fired on a PR
# branch's push before, so every PR commit ran the suite twice. A newer push to a PR cancels the run it replaces (one group per PR); each
# push to main has a group of its own (its run id), so no main run is cancelled or replaced while it waits (review of #540: one shared main
# group let a third merge replace a second one still pending).
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y -qq espeak-ng ffmpeg
      - run: python -m unittest -v
      - name: smoke lesson with espeak
        run: |
          python -m audiolesson.cli generate -c curricula/fr-en-a1.toml -l /tmp/l.json -m 3 --profile profiles/espeak.toml --date 2026-01-01
          python -m audiolesson.cli generate -c curricula/fr-ja-a1.toml -l /tmp/j.json -m 3 --provider espeak --date 2026-01-01
          python -m audiolesson.cli validate curricula/is-en
          python -m audiolesson.cli generate -c curricula/is-en -l /tmp/i.json -m 3 --provider espeak --date 2026-01-01
          python -m audiolesson.cli generate -c curricula/is-en --known ja -l /tmp/ij.json -m 3 --provider espeak --date 2026-01-01
