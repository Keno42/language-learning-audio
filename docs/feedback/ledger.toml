# The feedback ledger: each lesson's remarks by cause, and the built changes waiting for three feedbacks without a remark
# of the same kind (LEARNING-DESIGN §8). `python tools/ledger.py` computes each change's status, the families new and
# recurring in each lesson, the settled run and the behaviour PRs each lesson is the first built with (§9
# "Governance"); `--table` prints the §8 table with its third column computed.
#
# After a round of feedback: add the lesson (its form, load, built and remarks, each remark sorted as §1 says), a row for
# each change built since the last round, and `first_heard` on the rows this lesson was the first to play. A family is a
# cause, not a symptom: a remark whose cause is listed takes its family, and only a new cause gets a new one (§1, §11
# "Local fixes for a global problem").
#
# Seeded from LEARNING-DESIGN §5.22–§5.24 and docs/history/evidence.md §5.20–§5.21 (lessons 24–26, 33, 34) and the §8
# table after lesson 34. Lessons 27–32 have no §5 subsection: their form is "unknown", and their remarks are the ones the
# merged PRs quote as feedback (#351, #352, #353, #359, #360), so the list may be short. A family first remarked before
# lesson 24 counts as new at its first remark here. A lesson holds the remarks of its round, another learner's included.
#
# lesson: n; form = true (a feedback form), false (none) or "unknown" (no record); load ("light", "right", "heavy") when
#   form = true; built (from lesson 35): this repository's behaviour PRs the lesson is the first built with, from git (main
#   between the previous lesson's revision and its own, both named in §5), not counting a data PR (a scene, its lines or
#   verdicts, a native correction) or one that leaves the lessons as they were (a tool, a report, a #281 step); remarks:
#   who ("main": the learner, the owner; "other": another learner in the channel), text, family, class ("twenty",
#   "precision", "mechanism": §1, §9 "Good enough overall"), answered_by (the PRs that answered it).
# change: title (the §8 row), issue and pr (lists), family, first_heard (a lesson; absent while not heard), heard (what
#   the row says about where it was heard).

[families.voice-gap]
cause = "Nothing decided what happens at a change of voice, so speech segments touched (lesson 24: 66 times)."
structural_pr = "#304"

[families.slow-model]
cause = "A slow model stretched the whole line instead of saying it word by word at natural speed (lesson 24)."
structural_pr = "#307"

[families.hard-word]
cause = "What the learner finds hard to say got no slow, split model: the sound rule read single words with ll, tt, fj or ý only (H13)."
structural_pr = "#342"

[families.pick-out-turns]
cause = "The turns between tasks are not marked as an exercise's own turns are: what to listen for, when to answer, whose voice answers, the way back from a pick-out or a conversation, a block that holds another task. Each remark got its own fix."

[families.one-version]
cause = "A line the learner needs in several versions has one: a phrase not linked to its pattern, a frame authored as a fixed phrase, the same catch words every lesson (G17)."

[families.review-wording]
cause = "A written review question is not worded for the card: a lesson cue copied in, or the form its answer expects lost by the bot's wording refresh or never stored."
structural_pr = "#314"

[families.review-repeats]
cause = "The written review brings back what was just answered before anything new: due cards first, a first 言えた back the next day."

[families.note-by-ear]
cause = "A grammar note written for the eye: endings run together, a lone full stop narrated (#198)."

[families.scene-first]
cause = "The lesson is heard as items, not a scene: the day's new material outside the played exchange, the exchange's goal unsaid, the closing out of its order (H4; the «Anki game» of lesson 13)."

[families.form-why]
cause = "A form or an idiom comes without why it is so, or without which form is wanted."

[families.framing-general]
cause = "A framing line said for the general case, without looking at what follows: «In another sentence» before the same sentence, «other words» before none (§5.24)."
structural_pr = "#397"  # every promising line checked against what follows; lesson 35's closing announcement was on its list of lines that promise nothing

[families.hard-item]
cause = "An item the learner finds hard gets the same practice as any other, in the same sentence (#326)."

[families.repeat-in-lesson]
cause = "One lesson plays the same exchange from two places: an authored dialogue and the played level (#384)."

[families.scene-plausibility]
cause = "A sentence has no scene the learner can picture or believe, generated or authored: each was found by chance, one at a time. The scene check reads generated sentences, not the order of an authored exchange or whether a cue's answer answers it (G6, H7)."
structural_pr = "#352"

[families.load-answer]
cause = "The feedback form does not say what a load answer changes, so a single answer looks as if it changed nothing and the pace's signal stops (H9)."

[families.other-answer]
cause = "A right answer other than the model is never acknowledged: other answers exist only for fixed phrases, and no review asks what else a native would answer to the cue."

[families.scene-spacing]
cause = "Two units of one scene come back to back, each narrating its scene line: the spacing of #273 covers authored situations and a scene check's line, not a theme's scene line."

[families.reading-deck]
cause = "The reading deck has had no outside review: cards ask for words no lesson taught, and katakana hints add vowels."

[families.known-repeat]
cause = "Known material comes back by a rule that never asks what the learner still gains from it: a set reply asked in every exchange played again, a whole dialogue every four lessons (H11, #416)."

[families.meaning-gloss]
cause = "An authored sentence's English meaning leaves its sense open (whom «hringja heim» calls): no check reads the meanings as a learner would (#209)."

[families.listening-just-heard]
cause = "A listening question is drawn without looking at what the lesson has just played: it asks for information a conversation gave a minute before (#339, with #273)."

[families.support-request]
cause = "Asking for help and asking for practice are one answer («sooner»): no way to ask how a word is said or why a form is so without changing its schedule or its load (site_update_notifier#179)."

[families.personal-details]
cause = "Lines about oneself use the course's fixed name and age, not the learner's own: a self-introduction practised is not the one the learner will say (#428)."

[families.easy-substitution]
cause = "New items that combine into a few sentences each run their own ladder: one sentence practises two of them, and the few sentences come back many times (G11, #439)."

[families.guide-repeat]
cause = "An instruction is said in full every time its case comes, not once a lesson: nothing remembers that the lesson has said it (#438)."

[families.audio-defect]
cause = "A synthesized clip can end early without an error: the cache keeps it, and every lesson that says the line plays it cut off (#462)."

[families.prompt-recognition]
cause = "A level is ready when the learner can say every reply; nothing checks that the partner's line before it can be understood, so a question worded unlike its known reply plays untranslated (#327, #265)."

[families.instruction-language]
cause = "Every instruction is in the known language: the Icelandic the learner will hear as instructions is never practised (#429)."

[families.review-audio]
cause = "The written review's 🔊 reply carried no text of its own, and Discord's preview of the review message shows the card on screen now (site_update_notifier#175)."

