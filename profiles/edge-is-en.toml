# Icelandic target, English instructor, free neural voices via edge-tts.
provider = "edge"
fallback = "azure"

pause_multiplier = 1.0
mp3 = true
[speakers]
instructor = { voice = "en-US-AriaNeural" }
native_a = { voice = "is-IS-GudrunNeural" }
native_b = { voice = "is-IS-GunnarNeural" }
# #563: the instructions in Icelandic («Endurtaktu.») in a voice no scene uses: OpenAI's realtime model (OPENAI_API_KEY and the
# websockets package); without them, Gunnar says them, as native_b
command = { provider = "openai-realtime", voice = "cedar" }
