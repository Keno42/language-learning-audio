[[dialogues]]
id = "cafe_seat"
setting = "カフェにいます。女性が座っているテーブルに、空いている椅子が一つあります。"
topics = ["cafe", "social"]
requires = ["je_suis_en_vacances", "oui"]

  [[dialogues.turns]]
  cue = "この席が空いているか聞いてください。"
  expect = "cette_place_est_libre"
  partner = "Oui, bien sûr. Vous êtes d'où ?"
  partner_meaning = "はい、どうぞ。どちらから来ましたか？"

  [[dialogues.turns]]
  cue = "日本から来たと伝えてください。"
  expect = "je_viens_du_japon"
  partner = "Ah, le Japon ! Vous êtes en vacances ?"
  partner_meaning = "ああ、日本！休暇ですか？"

  [[dialogues.turns]]
  cue = "はい、休暇中だと答えてください。"
  expect_text = "Oui, je suis en vacances."
  expect_meaning = "はい、休暇中です。"
  partner = "Bienvenue à Paris !"
  partner_meaning = "パリへようこそ！"

  [[dialogues.turns]]
  cue = "お礼を言ってください。"
  expect = "merci"

[[dialogues]]
id = "cafe_order"
setting = "ウェイターがテーブルに来ました。"
topics = ["cafe"]
requires = ["bonjour", "je_voudrais", "un_cafe", "sil_vous_plait", "non", "merci", "au_revoir"]

  [[dialogues.turns]]
  opener = "Bonjour. Vous désirez ?"
  opener_meaning = "こんにちは。ご注文は？"
  cue = "あいさつして、コーヒーを注文してください。"
  expect_text = "Bonjour. Je voudrais un café, s'il vous plaît."
  expect_meaning = "こんにちは。コーヒーをください。"
  partner = "Avec du lait ?"
  partner_meaning = "ミルクは入れますか？"

  [[dialogues.turns]]
  cue = "「いいえ、結構です」と言ってください。"
  expect_text = "Non, merci."
  expect_meaning = "いいえ、結構です。"
  partner = "Très bien."
  partner_meaning = "かしこまりました。"

  [[dialogues.turns]]
  cue = "しばらくして。お会計を頼んでください。"
  expect = "l_addition"
  partner = "Voilà. Quatre euros."
  partner_meaning = "どうぞ。4ユーロです。"

  [[dialogues.turns]]
  cue = "お礼を言って、別れのあいさつをしてください。"
  expect_text = "Merci. Au revoir."
  expect_meaning = "ありがとう。さようなら。"

[[dialogues]]
id = "street_directions"
setting = "道に迷いました。男性が通りかかります。"
topics = ["directions", "clarifying"]
requires = ["excusez_moi", "ou_est", "le_metro"]

  [[dialogues.turns]]
  cue = "声をかけて、地下鉄はどこか聞いてください。"
  expect_text = "Excusez-moi, où est le métro ?"
  expect_meaning = "すみません、地下鉄はどこですか？"
  partner = "Le métro ? C'est tout droit, puis à gauche."
  partner_meaning = "地下鉄？まっすぐ行って、それから左です。"

  [[dialogues.turns]]
  cue = "聞き取れませんでした。もっとゆっくり話すよう頼んでください。"
  expect = "plus_lentement"
  partner = "Tout droit… puis à gauche."
  partner_meaning = "まっすぐ…それから左。"

  [[dialogues.turns]]
  cue = "遠いか聞いてください。"
  expect = "c_est_loin"
  partner = "Non, cinq minutes."
  partner_meaning = "いいえ、5分です。"

  [[dialogues.turns]]
  cue = "お礼を言ってください。"
  expect = "merci"

[[dialogues]]
id = "hotel_reception"
setting = "夜、ホテルの受付です。受付の人が顔を上げます。"
topics = ["hotel", "arrangements", "clarifying"]
requires = ["je_pars", "demain", "merci", "au_revoir"]

  [[dialogues.turns]]
  opener = "Bonsoir."
  opener_meaning = "こんばんは。"
  cue = "英語を話せるか聞いてください。"
  expect = "parlez_vous_anglais"
  partner = "Un peu. Vous partez quand ?"
  partner_meaning = "少し。いつ出発しますか？"

  [[dialogues.turns]]
  cue = "明日出発すると言ってください。"
  expect_text = "Je pars demain."
  expect_meaning = "明日出発します。"
  partner = "D'accord. Le taxi est à huit heures, ça va ?"
  partner_meaning = "わかりました。タクシーは8時ですが、いいですか？"

  [[dialogues.turns]]
  cue = "わからないと言ってください。"
  expect = "je_ne_comprends_pas"
  partner = "Le taxi… demain… huit heures."
  partner_meaning = "タクシー…明日…8時。"

  [[dialogues.turns]]
  cue = "わかりましたと言って、お礼を言ってください。"
  expect_text = "D'accord. Merci."
  expect_meaning = "わかりました。ありがとう。"
  partner = "Bonne soirée !"
  partner_meaning = "良い夜を！"
