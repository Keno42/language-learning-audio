# Icelandic for English speakers — survival A1 (café, street, meeting people, weather).
# Starter set. Nouns in construction slots are given in the case the construction needs:
#   acc_*  after "Ég ætla að fá …"      nom_*  after "Hvar er …?"
# Extend it in the same style; run `audiolesson validate` after editing.
# Not yet reviewed by a native speaker — see docs/HANDOFF.md.

[curriculum]
name = "Icelandic A1 — kaffihús, gata, fólk, veður"
target_lang = "is"
known_lang = "en"
level = "A1"

