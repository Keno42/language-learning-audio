# ---------------------------------------------------------------- grammar

[[items]]
id = "negation_ekki"
kind = "transform"
target = "… ekki"
meaning = "making a sentence negative"
difficulty = 3
topics = ["grammar"]
instruction = "Make it negative:"
prereqs = ["eg_skil_ekki", "er_thad_langt"]
examples = [
  { source = "Ég skil.", source_meaning = "I understand.", result = "Ég skil ekki.", result_meaning = "I don't understand." },
  { source = "Ég tala íslensku.", source_meaning = "I speak Icelandic.", result = "Ég tala ekki íslensku.", result_meaning = "I don't speak Icelandic." },
  { source = "Það er langt.", source_meaning = "It's far.", result = "Það er ekki langt.", result_meaning = "It's not far." },
  { source = "Ég er í fríi.", source_meaning = "I'm on holiday.", result = "Ég er ekki í fríi.", result_meaning = "I'm not on holiday." },
  { source = "Ég fer á morgun.", source_meaning = "I'm leaving tomorrow.", result = "Ég fer ekki á morgun.", result_meaning = "I'm not leaving tomorrow." },
]

