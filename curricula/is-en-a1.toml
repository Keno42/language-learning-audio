# ---------------------------------------------------------------- dialogues

[[dialogues]]
id = "kaffihus"
setting = "You're at a café counter in Reykjavík. The barista looks up."
topics = ["cafe", "clarifying"]
requires = ["godan_daginn", "eg_aetla_ad_fa", "kaffi", "nei", "takk"]

  [[dialogues.turns]]
  opener = "Góðan daginn. Hvað má bjóða þér?"
  opener_meaning = "Good day. What can I get you?"
  cue = "Greet her and say you'll have a coffee."
  expect_text = "Góðan daginn. Ég ætla að fá kaffi."
  expect_meaning = "Good day. I'll have a coffee."
  partner = "Með mjólk?"
  partner_meaning = "With milk?"

  [[dialogues.turns]]
  cue = "Say: no, thanks."
  expect_text = "Nei, takk."
  expect_meaning = "No, thanks."
  partner = "Það kostar sex hundruð krónur."
  partner_meaning = "That's six hundred krónur."

  [[dialogues.turns]]
  cue = "You didn't catch that. Ask her to speak more slowly."
  expect = "gaetirdu_talad_haegar"
  partner = "Sex hundruð krónur."
  partner_meaning = "Six hundred krónur."

  [[dialogues.turns]]
  cue = "Thank her."
  expect = "takk"
  partner = "Gjörðu svo vel."
  partner_meaning = "Here you are."

[[dialogues]]
id = "sundlaug"
setting = "You want to go swimming. You stop a man in the street."
topics = ["directions"]
requires = ["afsakid", "hvar_er", "sundlaugin", "takk", "bless"]

  [[dialogues.turns]]
  cue = "Get his attention and ask where the swimming pool is."
  expect_text = "Afsakið, hvar er sundlaugin?"
  expect_meaning = "Excuse me, where is the swimming pool?"
  partner = "Sundlaugin? Beint áfram og svo til hægri."
  partner_meaning = "The pool? Straight ahead and then to the right."

  [[dialogues.turns]]
  cue = "Ask if it's far."
  expect = "er_thad_langt"
  partner = "Nei, fimm mínútur."
  partner_meaning = "No, five minutes."

  [[dialogues.turns]]
  cue = "Thank him and say bye."
  expect_text = "Takk. Bless."
  expect_meaning = "Thanks. Bye."

[[dialogues]]
id = "kynning"
setting = "At a friend's kitchen table you're introduced to Anna."
topics = ["social"]
requires = ["eg_er_fra_japan", "en_thu", "ja", "eg_er_i_frii", "takk"]

  [[dialogues.turns]]
  opener = "Hæ! Hvað heitir þú?"
  opener_meaning = "Hi! What's your name?"
  cue = "Say your name is Yuki."
  expect = "eg_heiti"
  partner = "Gaman að kynnast þér. Hvaðan ert þú?"
  partner_meaning = "Nice to meet you. Where are you from?"

  [[dialogues.turns]]
  cue = "Say you're from Japan, then ask: and you?"
  expect_text = "Ég er frá Japan. En þú?"
  expect_meaning = "I'm from Japan. And you?"
  partner = "Ég er frá Akureyri. Ertu í fríi?"
  partner_meaning = "I'm from Akureyri. Are you on holiday?"

  [[dialogues.turns]]
  cue = "Say yes, you're on holiday."
  expect_text = "Já, ég er í fríi."
  expect_meaning = "Yes, I'm on holiday."
  partner = "Velkomin til Íslands!"
  partner_meaning = "Welcome to Iceland!"

  [[dialogues.turns]]
  cue = "Thank her."
  expect = "takk"

[[dialogues]]
id = "vedur"
setting = "You meet your neighbour outside. It's blowing a gale."
topics = ["weather", "arrangements"]
requires = ["ja", "thad_er_weather", "kalt", "allt_i_lagi", "sjaumst_a_morgun"]

  [[dialogues.turns]]
  opener = "Það er rok í dag!"
  opener_meaning = "It's windy today!"
  cue = "Agree: yes, it's cold."
  expect_text = "Já, það er kalt."
  expect_meaning = "Yes, it's cold."
  partner = "Sjáumst á morgun?"
  partner_meaning = "See you tomorrow?"

  [[dialogues.turns]]
  cue = "Say OK, see you tomorrow."
  expect_text = "Allt í lagi. Sjáumst á morgun!"
  expect_meaning = "OK. See you tomorrow!"
