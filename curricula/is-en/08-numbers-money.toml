  { source = "Hvað kostar te?", source_meaning = "How much is a tea?", source_meaning_ja = "紅茶はいくらですか？", result = "Það kostar þúsund krónur.", result_meaning = "It costs a thousand krónur.", result_meaning_ja = "1000クローナです。" },
  { source = "Hvað kostar þetta?", source_meaning = "How much is this?", source_meaning_ja = "これはいくらですか？", result = "Það kostar þúsund krónur.", result_meaning = "It costs a thousand krónur.", result_meaning_ja = "1000クローナです。" },
  { source = "Hvað kostar bjór?", source_meaning = "How much is a beer?", source_meaning_ja = "ビールはいくらですか？", result = "Það kostar þúsund krónur.", result_meaning = "It costs a thousand krónur.", result_meaning_ja = "1000クローナです。" },
]

[[dialogues]]
id = "markadur"
setting = "At the flea market. You've found a wool sweater."
setting_ja = "フリーマーケットで、ウールのセーターを見つけました。"
topics = ["money", "shopping"]
requires = ["hvad_kostar_thetta", "thad_er_of_dyrt", "tekurdu_kort", "eg_er_ekki_med_reidufe", "hvar_er_naesti_hradbanki", "takk"]

  [[dialogues.turns]]
  cue = "Ask how much this is."
  cue_ja = "これはいくらか聞いてください。"
  expect = "hvad_kostar_thetta"
  partner = "Tuttugu þúsund krónur."
  partner_meaning = "Twenty thousand krónur."
  partner_meaning_ja = "2万クローナです。"

  [[dialogues.turns]]
  cue = "Say that's too expensive."
  cue_ja = "高すぎると言ってください。"
  expect = "thad_er_of_dyrt"
  partner = "Fyrir þig: fimmtán þúsund."
  partner_meaning = "For you: fifteen thousand."
  partner_meaning_ja = "あなたには、1万5千で。"

  [[dialogues.turns]]
  cue = "Ask if he takes cards."
  cue_ja = "カードが使えるか聞いてください。"
  expect = "tekurdu_kort"
  partner = "Nei, bara reiðufé."
  partner_meaning = "No, cash only."
  partner_meaning_ja = "いいえ、現金だけです。"

  [[dialogues.turns]]
  cue = "Say you don't have cash, and ask where the nearest ATM is."
  cue_ja = "現金がないと言って、一番近いATMはどこか聞いてください。"
  expect_text = "Ég er ekki með reiðufé. Hvar er næsti hraðbanki?"
  expect_meaning = "I don't have cash. Where is the nearest ATM?"
  expect_meaning_ja = "現金を持っていません。一番近いATMはどこですか？"
  partner = "Hinum megin við götuna. Ég er með peysu fyrir þig."
  partner_meaning = "Across the street. I have a sweater for you."
  partner_meaning_ja = "通りの向かいです。セーターを持っていますよ。"

  [[dialogues.turns]]
  cue = "Thank him."
  cue_ja = "お礼を言ってください。"
  expect = "takk"
