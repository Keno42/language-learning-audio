[[dialogues]]
id = "markadur"
setting = "At the flea market. You've found a wool sweater."
setting_ja = "フリーマーケットで、ウールのセーターを見つけました。"
topics = ["money", "shopping"]
requires = ["hvad_kostar_thetta", "thad_er_of_dyrt", "tekurdu_kort", "eg_er_ekki_med_reidufe", "hvar_er_naesti_hradbanki", "takk"]

  [[dialogues.turns]]
  cue = "Ask how much this is."
  cue_ja = "これはいくらか聞いてください。"
  expect = "hvad_kostar_thetta"
  partner = "Tuttugu þúsund krónur."
  partner_meaning = "Twenty thousand krónur."
  partner_meaning_ja = "2万クローナです。"

  [[dialogues.turns]]
  cue = "Say that's too expensive."
  cue_ja = "高すぎると言ってください。"
  expect = "thad_er_of_dyrt"
  partner = "Fyrir þig: fimmtán þúsund."
  partner_meaning = "For you: fifteen thousand."
  partner_meaning_ja = "あなたには、1万5千で。"

  [[dialogues.turns]]
  cue = "Ask if he takes cards."
  cue_ja = "カードが使えるか聞いてください。"
  expect = "tekurdu_kort"
  partner = "Nei, bara reiðufé."
  partner_meaning = "No, cash only."
  partner_meaning_ja = "いいえ、現金だけです。"

  [[dialogues.turns]]
  cue = "Say you don't have cash, and ask where the nearest ATM is."
  cue_ja = "現金がないと言って、一番近いATMはどこか聞いてください。"
  expect_text = "Ég er ekki með reiðufé. Hvar er næsti hraðbanki?"
  expect_meaning = "I don't have cash. Where is the nearest ATM?"
  expect_meaning_ja = "現金を持っていません。一番近いATMはどこですか？"
  # issue #48 audit: the seller used to add "Ég er með peysu fyrir þig." ("I have a sweater for
  # you") — a line copied from gonguferd that doesn't follow an ATM question
  partner = "Hinum megin við götuna."
  partner_meaning = "Across the street."
  partner_meaning_ja = "通りの向かいです。"

  [[dialogues.turns]]
  cue = "Thank him."
  cue_ja = "お礼を言ってください。"
  expect = "takk"

# issue #48 (still open after session 30): session 26's number constructions were only ever
# *safe* inside connect(), never used in a partner-driven transaction. Here the learner is the
# seller: a turn expects the construction thad_kostar_big with its fill bound by the cue
# (expect_fill, like Item.situation_fill), so «Það kostar fimm þúsund krónur.» is generated from
# independently known parts inside a real haggle — and the partner answers with a number too.
[[dialogues]]
id = "solubas"
setting = "You're minding a friend's stall at the Kolaportið flea market. A man picks up a wool hat."
setting_ja = "コラポルティズのフリーマーケットで、友達の露店の店番をしています。男性が毛糸の帽子を手に取りました。"
topics = ["money", "shopping"]

  [[dialogues.turns]]
  opener = "Góðan daginn. Hvað kostar þetta?"
  opener_meaning = "Good morning. How much is this?"
  opener_meaning_ja = "こんにちは。これはいくらですか？"
  cue = "Tell him it costs five thousand krónur."
  cue_ja = "5千クローナだと答えてください。"
  expect = "thad_kostar_big"
  expect_fill = { count = "fimm" }
  partner = "Fimm þúsund? Það er of dýrt. Fjögur þúsund?"
  partner_meaning = "Five thousand? That's too expensive. Four thousand?"
  partner_meaning_ja = "5千？高すぎるよ。4千でどう？"

  [[dialogues.turns]]
  cue = "Agree."
  cue_ja = "了承してください。"
  expect = "allt_i_lagi"
  partner = "Frábært. Má ég borga með korti?"
