  { source = "Ég borða fisk.", source_meaning = "I eat fish.", result = "Ég borðaði fisk í gær.", result_meaning = "I ate fish yesterday." },
  { source = "Ég tala við Önnu.", source_meaning = "I talk to Anna.", result = "Ég talaði við Önnu í gær.", result_meaning = "I talked to Anna yesterday." },
  { source = "Ég kem heim.", source_meaning = "I come home.", result = "Ég kom heim í gær.", result_meaning = "I came home yesterday." },
  { source = "Ég sé norðurljósin.", source_meaning = "I see the northern lights.", result = "Ég sá norðurljósin í gær.", result_meaning = "I saw the northern lights yesterday." },
  { source = "Ég kaupi peysu.", source_meaning = "I buy a sweater.", result = "Ég keypti peysu í gær.", result_meaning = "I bought a sweater yesterday." },
  { source = "Ég vinn.", source_meaning = "I work.", result = "Ég vann í gær.", result_meaning = "I worked yesterday." },
]

