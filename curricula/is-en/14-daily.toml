[[items]]
id = "transform_thu_form"
kind = "transform"
target = "Ég … → Þú …"
meaning = "saying it about the listener"
difficulty = 3
topics = ["grammar"]
instruction = "Say it about the other person: you…"
prereqs = ["eg_by_i", "eg_vinn"]
examples = [
  { source = "Ég tala íslensku.", source_meaning = "I speak Icelandic.", result = "Þú talar íslensku.", result_meaning = "You speak Icelandic." },
  { source = "Ég bý í Reykjavík.", source_meaning = "I live in Reykjavík.", result = "Þú býrð í Reykjavík.", result_meaning = "You live in Reykjavík." },
  { source = "Ég vinn.", source_meaning = "I work.", result = "Þú vinnur.", result_meaning = "You work." },
  { source = "Ég fer á morgun.", source_meaning = "I'm leaving tomorrow.", result = "Þú ferð á morgun.", result_meaning = "You're leaving tomorrow." },
  { source = "Ég er þreytt.", source_meaning = "I'm tired.", result = "Þú ert þreytt.", result_meaning = "You're tired." },
  { source = "Ég skil.", source_meaning = "I understand.", result = "Þú skilur.", result_meaning = "You understand." },
  { source = "Ég vil kaffi.", source_meaning = "I want coffee.", result = "Þú vilt kaffi.", result_meaning = "You want coffee." },
]

[[dialogues]]
id = "dagurinn"
setting = "Anna asks about your day over coffee."
topics = ["daily"]
requires = ["eg_vakna", "eg_fer_i_vinnuna", "eg_fer_i_sund", "eg_elda_kvoldmat", "eg_fer_ad_sofa", "hvad_gerir_thu_um_helgar"]

  [[dialogues.turns]]
  opener = "Hvenær vaknar þú?"
  opener_meaning = "When do you wake up?"
  cue = "Say you wake up at seven and go to work."
  expect_text = "Ég vakna klukkan sjö. Ég fer í vinnuna."
  expect_meaning = "I wake up at seven. I go to work."
  partner = "Og eftir vinnu?"
  partner_meaning = "And after work?"

  [[dialogues.turns]]
  cue = "Say you go swimming and cook dinner."
  expect_text = "Ég fer í sund. Ég elda kvöldmat."
  expect_meaning = "I go swimming. I cook dinner."
  partner = "Hvenær ferðu að sofa?"
  partner_meaning = "When do you go to bed?"

  [[dialogues.turns]]
  cue = "Say you go to bed at eleven, then ask what she does at weekends."
  expect_text = "Ég fer að sofa klukkan ellefu. Hvað gerir þú um helgar?"
  expect_meaning = "I go to bed at eleven. What do you do at weekends?"
  partner = "Ég fer út að ganga með hundinn."
  partner_meaning = "I go for a walk with the dog."
