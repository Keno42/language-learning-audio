[[dialogues]]
id = "heimsokn"
setting = "You visit Anna's flat for the first time."
setting_ja = "初めてアンナのアパートを訪ねます。"
topics = ["home"]
requires = ["hae", "audvitad", "fardu_ur_skonum", "viltu_kaffi", "ja_takk", "hvar_er_klosettid_home", "thetta_er_person"]

  [[dialogues.turns]]
  # issue #48 audit: the roles were inverted — the *guest* said «Farðu úr skónum» to the host,
  # who answered «Nákvæmlega» ("exactly"). The host says it now; the learner agrees.
  opener = "Hæ, komdu inn! Farðu úr skónum."
  opener_meaning = "Hi, come in! Take your shoes off."
  opener_meaning_ja = "やあ、入って！靴を脱いでね。"
  cue = "Say hi, and: yes, of course."
  cue_ja = "やあと言って、はい、もちろんと答えてください。"
  expect_text = "Hæ! Já, auðvitað."
  expect_meaning = "Hi! Yes, of course."
  expect_meaning_ja = "やあ！うん、もちろん。"
  partner = "Viltu kaffi?"
  partner_meaning = "Do you want coffee?"
  partner_meaning_ja = "コーヒー飲む？"

  [[dialogues.turns]]
  cue = "Say yes, please, and ask where the toilet is."
  cue_ja = "はい、お願いしますと言って、トイレはどこか聞いてください。"
  expect_text = "Já, takk. Hvar er klósettið?"
  expect_meaning = "Yes, please. Where is the toilet?"
  expect_meaning_ja = "はい、お願いします。トイレはどこですか？"
  partner = "Fyrsta hurð til vinstri."
  partner_meaning = "First door on the left."
  partner_meaning_ja = "左の最初のドアよ。"
