[[dialogues]]
id = "heimsokn"
setting = "You visit Anna's flat for the first time."
topics = ["home"]
requires = ["hae", "fardu_ur_skonum", "viltu_kaffi", "ja_takk", "hvar_er_klosettid_home", "thetta_er_person"]

  [[dialogues.turns]]
  opener = "Hæ, komdu inn!"
  opener_meaning = "Hi, come in!"
  cue = "Say hi. Then she says 'farðu úr skónum' — repeat what she'd say when you keep your shoes on."
  expect_text = "Hæ! Farðu úr skónum."
  expect_meaning = "Hi! Take your shoes off."
  partner = "Nákvæmlega. Viltu kaffi?"
  partner_meaning = "Exactly. Do you want coffee?"

  [[dialogues.turns]]
  cue = "Say yes, please, and ask where the toilet is."
  expect_text = "Já, takk. Hvar er klósettið?"
  expect_meaning = "Yes, please. Where is the toilet?"
  partner = "Fyrsta hurð til vinstri."
  partner_meaning = "First door on the left."
