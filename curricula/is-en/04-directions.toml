[[dialogues]]
id = "sundlaug"
setting = "You want to go swimming. You stop a man in the street."
setting_ja = "泳ぎに行きたいです。道で男性を呼び止めます。"
topics = ["directions"]
requires = ["afsakid", "hvar_er", "sundlaugin", "er_thad_langt", "takk", "bless"]

  [[dialogues.turns]]
  cue = "Get his attention and ask where the swimming pool is."
  cue_ja = "声をかけて、プールはどこか聞いてください。"
  expect_text = "Afsakið, hvar er sundlaugin?"
  expect_meaning = "Excuse me, where is the swimming pool?"
  expect_meaning_ja = "すみません、プールはどこですか？"
  partner = "Sundlaugin? Beint áfram og svo til hægri."
  partner_meaning = "The pool? Straight ahead and then to the right."
  partner_meaning_ja = "プール？まっすぐ行って、それから右です。"

  [[dialogues.turns]]
  cue = "Ask if it's far."
  cue_ja = "遠いか聞いてください。"
  expect = "er_thad_langt"
  partner = "Nei, fimm mínútur."
  partner_meaning = "No, five minutes."
  partner_meaning_ja = "いいえ、5分です。"

  [[dialogues.turns]]
  cue = "Thank him and say bye."
  cue_ja = "お礼を言って、じゃあねと言ってください。"
  expect_text = "Takk. Bless."
  expect_meaning = "Thanks. Bye."
  expect_meaning_ja = "ありがとう。じゃあね。"

[[dialogues]]
id = "tynd"
setting = "You are lost near the harbour with a paper map. A woman is waiting at a crossing."
setting_ja = "紙の地図を手に港の近くで迷いました。横断歩道で女性が待っています。"
topics = ["directions"]
requires = ["afsakid", "eg_er_tynd", "eg_er_ad_leita_ad", "hotelinu", "geturdu_synt_mer_a_kortinu", "hvad_er_langt_thangad", "takk_kaerlega"]

  [[dialogues.turns]]
  cue = "Excuse yourself and say you're lost."
  cue_ja = "すみませんと言って、道に迷ったと伝えてください。"
  expect_text = "Afsakið, ég er týnd."
  expect_meaning = "Excuse me, I'm lost."
  expect_meaning_ja = "すみません、道に迷いました。"
  partner = "Ekkert mál. Hvert ertu að fara?"
  partner_meaning = "No problem. Where are you going?"
  partner_meaning_ja = "大丈夫ですよ。どこへ行くんですか？"

  [[dialogues.turns]]
  cue = "Say you're looking for the hotel."
  cue_ja = "ホテルを探していると言ってください。"
  expect_text = "Ég er að leita að hótelinu."
  expect_meaning = "I'm looking for the hotel."
  expect_meaning_ja = "ホテルを探しています。"
  partner = "Hótelið er hinum megin við götuna, við hliðina á bankanum."
  partner_meaning = "The hotel is across the street, next to the bank."
  partner_meaning_ja = "ホテルは通りの向かい、銀行の隣です。"

  [[dialogues.turns]]
  cue = "Ask her to show you on the map."
  cue_ja = "地図で示してもらうよう頼んでください。"
  expect = "geturdu_synt_mer_a_kortinu"
  partner = "Já, sjáðu: við erum hérna, og hótelið er þarna."
  partner_meaning = "Yes, look: we are here, and the hotel is there."
  partner_meaning_ja = "ええ、見て。私たちはここで、ホテルはあそこ。"

  [[dialogues.turns]]
  cue = "Ask how far it is."
  cue_ja = "どのくらいあるか聞いてください。"
  expect = "hvad_er_langt_thangad"
  partner = "Bara tvær mínútur."
  partner_meaning = "Just two minutes."
  partner_meaning_ja = "ほんの2分です。"

  [[dialogues.turns]]
  cue = "Thank her warmly."
  cue_ja = "心からお礼を言ってください。"
  expect = "takk_kaerlega"
  partner = "Ekkert að þakka. Gangi þér vel!"
  partner_meaning = "You're welcome. Good luck!"
  partner_meaning_ja = "どういたしまして。がんばってね！"
