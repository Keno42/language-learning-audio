# 29 — contrasts: one noun in two forms, and what changes it (#548)
# Lesson 58: «for each sentence the reason its case is chosen is not explained, and no practice nearby uses another case of the same word».
# The owner (2026-11-16): no grammatical term («accusative», «dative»), only what changes the form: going there and being there («á
# flugvöllinn» / «á flugvellinum»), or the word before it («elska fisk» / «ofnæmi fyrir fiski»); each line asked by its meaning («Where are
# you going?» / «Where are you now?»), and linked to something the learner knows with the same form or the same deciding word (`like`).
# `by`: "meaning" or "word". A contrast plays in the noun choice's place once every item of `requires` is met and not failing
# (`Planner.form_choice_pool`). The sentences are made of words the learner knows; the new ones («Ég er á flugvellinum.», «Hittumst við
# sundlaugina.») are candidates until native-checked (#209).

# --- by meaning: going there (á / í + accusative) and being there (á / í + dative) ---

[[contrasts]]
id = "flugvollur_going_being"
by = "meaning"
lead = "Going there and being there: the word changes."
lead_ja = "そこへ行くときと、そこにいるときで、形が変わります。"
requires = ["a_flugvollinn", "flugvellinum", "eg_fer"]

[[contrasts.lines]]
target = "Ég fer á flugvöllinn."
word = "flugvöllinn"
ask = "Where are you going?"
ask_ja = "どこへ行きますか？"
answer = "Á flugvöllinn."
like = "a_flugvollinn_takk"

[[contrasts.lines]]
target = "Ég er á flugvellinum."
word = "flugvellinum"
ask = "Where are you now?"
ask_ja = "今どこにいますか？"
answer = "Á flugvellinum."
like = "flugvellinum"

