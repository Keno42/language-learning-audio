[[dialogues]]
id = "ahugamal"
setting = "A rainy evening indoors. Anna asks about your hobbies."
topics = ["hobbies"]
requires = ["eg_hef_gaman_af", "sundi", "gonguferdum", "hefur_thu_gaman_af", "mer_finnst_gaman_ad", "fara_i_sund", "mer_likar_thad"]

  [[dialogues.turns]]
  opener = "Hvað finnst þér skemmtilegt að gera?"
  opener_meaning = "What do you enjoy doing?"
  cue = "Say you enjoy swimming and hiking."
  expect_text = "Ég hef gaman af sundi og gönguferðum."
  expect_meaning = "I enjoy swimming and hiking."
  partner = "Ég líka! Ég fer í sund á hverjum morgni."
  partner_meaning = "Me too! I go swimming every morning."

  [[dialogues.turns]]
  cue = "Ask if she enjoys films."
  expect_text = "Hefur þú gaman af kvikmyndum?"
  expect_meaning = "Do you enjoy films?"
  partner = "Já, sérstaklega íslenskum myndum. Viltu horfa á eina?"
  partner_meaning = "Yes, especially Icelandic films. Do you want to watch one?"

  [[dialogues.turns]]
  cue = "Say you like it — no: say yes, you'd like that."
  expect_text = "Já, mér líkar það."
  expect_meaning = "Yes, I like that."
  partner = "Frábært, ég geri popp."
  partner_meaning = "Great, I'll make popcorn."
