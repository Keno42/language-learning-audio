[[dialogues]]
id = "vidtal"
setting = "A casual job interview at a café in Reykjavík."
setting_ja = "レイキャビクのカフェで、くだけた面接です。"
topics = ["work"]
requires = ["eg_er_job", "forritari", "eg_vinn_hja", "eg_er_ad_laera", "islensku", "hvad_er_kaupid", "takk_kaerlega"]

  [[dialogues.turns]]
  opener = "Segðu mér aðeins frá þér."
  opener_meaning = "Tell me a bit about yourself."
  opener_meaning_ja = "自己紹介をお願いします。"
  cue = "Say you're a programmer and you work at a small company."
  cue_ja = "プログラマーで、小さな会社で働いていると言ってください。"
  expect_text = "Ég er forritari. Ég vinn hjá litlu fyrirtæki."
  expect_meaning = "I'm a programmer. I work at a small company."
  expect_meaning_ja = "プログラマーです。小さな会社で働いています。"
  partner = "Og þú talar íslensku?"
  partner_meaning = "And you speak Icelandic?"
  partner_meaning_ja = "それで、アイスランド語を話すんですね？"

  [[dialogues.turns]]
  cue = "Say you're learning Icelandic."
  cue_ja = "アイスランド語を勉強していると言ってください。"
  expect_text = "Ég er að læra íslensku."
  expect_meaning = "I'm learning Icelandic."
  expect_meaning_ja = "アイスランド語を勉強しています。"
  partner = "Frábært. Allt í lagi?"
  partner_meaning = "Great. All good?"
  partner_meaning_ja = "それはいいですね。大丈夫ですか？"

  [[dialogues.turns]]
  cue = "Ask what the salary is."
  cue_ja = "給料はいくらか聞いてください。"
  expect = "hvad_er_kaupid"
  partner = "Launin eru góð. Takk fyrir að koma!"
  partner_meaning = "The salary is good. Thanks for coming!"
  partner_meaning_ja = "給料はいいですよ。来てくれてありがとう！"

  [[dialogues.turns]]
  cue = "Thank her warmly."
  cue_ja = "心からお礼を言ってください。"
  expect = "takk_kaerlega"
