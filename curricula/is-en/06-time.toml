[[dialogues]]
id = "stefnumot"
setting = "Anna wants to meet up. You're on the phone."
topics = ["arrangements"]
requires = ["eg_get_ekki_a_morgun", "klukkan_hvad", "thad_hentar_vel", "sjaumst_time", "a_fostudaginn", "hittumst_klukkan", "sjo"]

  [[dialogues.turns]]
  opener = "Eigum við að hittast á morgun?"
  opener_meaning = "Shall we meet tomorrow?"
  cue = "Say you can't tomorrow."
  expect = "eg_get_ekki_a_morgun"
  partner = "Allt í lagi. Á föstudaginn þá?"
  partner_meaning = "OK. On Friday then?"

  [[dialogues.turns]]
  cue = "Ask at what time."
  expect = "klukkan_hvad"
  partner = "Klukkan sjö, á kaffihúsinu?"
  partner_meaning = "At seven, at the café?"

  [[dialogues.turns]]
  cue = "Say that suits you well."
  expect = "thad_hentar_vel"
  partner = "Frábært."
  partner_meaning = "Great."

  [[dialogues.turns]]
  cue = "Say: see you on Friday!"
  expect_text = "Sjáumst á föstudaginn!"
  expect_meaning = "See you on Friday!"
  partner = "Sjáumst!"
  partner_meaning = "See you!"
