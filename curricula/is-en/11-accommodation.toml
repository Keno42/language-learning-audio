[[dialogues]]
id = "innritun"
setting = "Evening, at the hotel reception. The receptionist looks up."
setting_ja = "夜、ホテルの受付。受付の人が顔を上げます。"
topics = ["accommodation", "clarifying"]
requires = ["talar_thu", "ensku", "eg_er_med_bokun", "a_nafninu_yuki", "er_morgunmatur_innifalinn", "hvad_er_lykilordid", "takk"]

  [[dialogues.turns]]
  opener = "Gott kvöld."
  opener_meaning = "Good evening."
  opener_meaning_ja = "こんばんは。"
  cue = "Say you have a reservation, under the name Yuki."
  cue_ja = "予約している、ユキの名前で、と言ってください。"
  expect_text = "Ég er með bókun. Á nafninu Yuki."
  expect_meaning = "I have a reservation. Under the name Yuki."
  expect_meaning_ja = "予約しています。ユキの名前で。"
  partner = "Já, hér er það. Tvær nætur, herbergi tólf."
  partner_meaning = "Yes, here it is. Two nights, room twelve."
  partner_meaning_ja = "はい、ありました。二泊、12号室です。"

  [[dialogues.turns]]
  cue = "Ask if breakfast is included."
  cue_ja = "朝食が含まれているか聞いてください。"
  expect = "er_morgunmatur_innifalinn"
  partner = "Já, frá sjö til tíu."
  partner_meaning = "Yes, from seven to ten."
  partner_meaning_ja = "はい、7時から10時までです。"

  [[dialogues.turns]]
  cue = "Ask what the Wi-Fi password is."
  cue_ja = "Wi-Fiのパスワードを聞いてください。"
  expect = "hvad_er_lykilordid"
  partner = "Það er á lyklinum. Gjörðu svo vel."
  partner_meaning = "It's on the key. Here you are."
  partner_meaning_ja = "鍵に書いてあります。どうぞ。"

  [[dialogues.turns]]
  cue = "Thank her."
  cue_ja = "お礼を言ってください。"
  expect = "takk"
  partner = "Góða nótt!"
  partner_meaning = "Good night!"
  partner_meaning_ja = "おやすみなさい！"

[[dialogues]]
id = "vandamal"
setting = "Next morning. You call reception from your room."
setting_ja = "翌朝。部屋から受付に電話します。"
topics = ["accommodation"]
requires = ["herbergi_numer_tolf", "thad_er_ekkert_heitt_vatn", "get_eg_fengid_annad_handklaedi", "takk_kaerlega"]

  [[dialogues.turns]]
  opener = "Góðan daginn."
  opener_meaning = "Good day."
  opener_meaning_ja = "受付です、こんにちは。"
  cue = "Say: room number twelve. There's no hot water."
  cue_ja = "12号室です、お湯が出ません、と言ってください。"
  expect_text = "Herbergi númer tólf. Það er ekkert heitt vatn."
  expect_meaning = "Room number twelve. There's no hot water."
  expect_meaning_ja = "12号室です。お湯が出ません。"
  partner = "Fyrirgefðu! Ég kem núna."
  partner_meaning = "Sorry! I'm coming now."
  partner_meaning_ja = "申し訳ありません！今すぐ行きます。"

  [[dialogues.turns]]
  cue = "Also ask for another towel."
  cue_ja = "タオルをもう一枚も頼んでください。"
  expect = "get_eg_fengid_annad_handklaedi"
  partner = "Auðvitað, ekkert mál."
  partner_meaning = "Of course, no problem."
  partner_meaning_ja = "もちろんです、問題ありません。"

  [[dialogues.turns]]
  cue = "Thank her warmly."
  cue_ja = "心からお礼を言ってください。"
  expect = "takk_kaerlega"
