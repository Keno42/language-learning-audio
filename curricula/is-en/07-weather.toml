[[dialogues]]
id = "vedur"
setting = "You meet your neighbour outside. It's blowing a gale."
topics = ["weather", "arrangements"]
requires = ["ja", "thad_er_weather", "kalt", "allt_i_lagi", "sjaumst_time", "a_morgun"]

  [[dialogues.turns]]
  opener = "Það er rok í dag!"
  opener_meaning = "It's windy today!"
  cue = "Agree: yes, it's cold."
  expect_text = "Já, það er kalt."
  expect_meaning = "Yes, it's cold."
  partner = "Sjáumst á morgun?"
  partner_meaning = "See you tomorrow?"

  [[dialogues.turns]]
  cue = "Say OK, see you tomorrow."
  expect_text = "Allt í lagi. Sjáumst á morgun!"
  expect_meaning = "OK. See you tomorrow!"

[[dialogues]]
id = "gonguferd"
setting = "You're planning a hike with a friend from the hostel."
topics = ["weather", "arrangements"]
requires = ["hvernig_verdur_vedrid_a_morgun", "thetta_reddast", "eg_tharf_ulpu", "hittumst_klukkan", "niu"]

  [[dialogues.turns]]
  cue = "Ask what the weather will be like tomorrow."
  expect = "hvernig_verdur_vedrid_a_morgun"
  partner = "Rigning og rok, held ég."
  partner_meaning = "Rain and wind, I think."

  [[dialogues.turns]]
  cue = "Say it'll work out."
  expect = "thetta_reddast"
  partner = "Já, en þú þarft betri jakka."
  partner_meaning = "Yes, but you need a better jacket."

  [[dialogues.turns]]
  cue = "Say you need a parka."
  expect = "eg_tharf_ulpu"
  partner = "Ég get lánað þér eina. Klukkan hvað leggjum við af stað?"
  partner_meaning = "I can lend you one. What time do we set off?"

  [[dialogues.turns]]
  cue = "Say: let's meet at nine."
  expect_text = "Hittumst klukkan níu."
  expect_meaning = "Let's meet at nine."
  partner = "Fínt. Góða nótt!"
  partner_meaning = "Fine. Good night!"
