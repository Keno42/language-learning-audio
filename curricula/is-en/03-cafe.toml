[[dialogues]]
id = "kaffihus"
setting = "You're at a café counter in Reykjavík. The barista looks up."
setting_ja = "レイキャビクのカフェのカウンターにいます。バリスタが顔を上げます。"
topics = ["cafe", "clarifying"]
requires = ["godan_daginn", "eg_aetla_ad_fa", "kaffi", "nei", "takk", "gaetirdu_talad_haegar"]

  [[dialogues.turns]]
  opener = "Góðan daginn. Hvað viltu?"
  opener_meaning = "Good day. What do you want?"
  opener_meaning_ja = "こんにちは。ご注文は？"
  cue = "Greet her and say you'll have a coffee."
  cue_ja = "あいさつして、コーヒーをくださいと言ってください。"
  expect_text = "Góðan daginn. Ég ætla að fá kaffi."
  expect_meaning = "Good day. I'll have a coffee."
  expect_meaning_ja = "こんにちは。コーヒーをください。"
  partner = "Með mjólk?"
  partner_meaning = "With milk?"
  partner_meaning_ja = "ミルクは入れますか？"

  [[dialogues.turns]]
  cue = "Say: no, thanks."
  cue_ja = "いいえ、結構です、と言ってください。"
  expect_text = "Nei, takk."
  expect_meaning = "No, thanks."
  expect_meaning_ja = "いいえ、結構です。"
  partner = "Það kostar sex hundruð krónur."
  partner_meaning = "That's six hundred krónur."
  partner_meaning_ja = "600クローナです。"

  [[dialogues.turns]]
  cue = "You didn't catch that. Ask her to speak more slowly."
  cue_ja = "聞き取れませんでした。もっとゆっくり話すよう頼んでください。"
  expect = "gaetirdu_talad_haegar"
  partner = "Sex hundruð krónur."
  partner_meaning = "Six hundred krónur."
  partner_meaning_ja = "600クローナです。"

  [[dialogues.turns]]
  cue = "Thank her."
  cue_ja = "お礼を言ってください。"
  expect = "takk"
  partner = "Gjörðu svo vel."
  partner_meaning = "Here you are."
  partner_meaning_ja = "どうぞ。"

[[dialogues]]
id = "veitingastadur"
setting = "A restaurant on Laugavegur. A waiter comes to your table."
setting_ja = "ロイガヴェーグル通りのレストラン。ウェイターがテーブルに来ます。"
topics = ["cafe", "food"]
requires = ["bord_fyrir_tvo", "eg_aetla_ad_fa", "fisk", "vatn", "get_eg_fengid_reikninginn", "ma_eg_borga_med_korti", "thetta_var_gott"]

  [[dialogues.turns]]
  opener = "Gott kvöld. Velkomin!"
  opener_meaning = "Good evening. Welcome!"
  opener_meaning_ja = "こんばんは。いらっしゃいませ！"
  cue = "Ask for a table for two, please."
  cue_ja = "二人用の席をお願いしてください。"
  expect = "bord_fyrir_tvo"
  partner = "Gjörðu svo vel. Hérna er matseðilinn. Hvað viltu drekka?"
  partner_meaning = "Here you are. Here's the menu. What do you want to drink?"
  partner_meaning_ja = "こちらへどうぞ。メニューです。お飲み物は何にしますか？"

  [[dialogues.turns]]
  cue = "Say you'll have water."
  cue_ja = "水をくださいと言ってください。"
  expect_text = "Ég ætla að fá vatn."
  expect_meaning = "I'll have water."
  expect_meaning_ja = "水をください。"
  partner = "Og að borða?"
  partner_meaning = "And to eat?"
  partner_meaning_ja = "お食事は？"

  [[dialogues.turns]]
  cue = "Say you'll have the fish."
  cue_ja = "魚をくださいと言ってください。"
  expect_text = "Ég ætla að fá fisk."
  expect_meaning = "I'll have fish."
  expect_meaning_ja = "魚をください。"
  partner = "Gott. Verði þér að góðu!"
  partner_meaning = "Good. Enjoy your meal!"
  partner_meaning_ja = "いいですね。どうぞ召し上がれ！"

  [[dialogues.turns]]
  cue = "Later. Say that was good, and ask for the bill."
