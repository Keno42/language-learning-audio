# issue #29 pilot 3 (modality): «má» + infinitive as a construction over the "inf" pool, instead
# of one fixed «Má ég X?» phrase per verb (seven such phrases exist across the course). Gated on
# the modal_infinitive milestone's items (eg_vil, eg_verd_ad, this module's «Má ég borga með
# korti?»), so want / have to / may are named as one family before «má» becomes productive.
[[items]]
