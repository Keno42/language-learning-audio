meaning = "How much is {item}?"
meaning_ja = "{item}はいくらですか？"
difficulty = 2
topics = ["cafe", "shopping"]
slots = { item = "nom_item" }
example = { item = "kaffi" }
prereqs = ["hvad_kostar_thetta"]

