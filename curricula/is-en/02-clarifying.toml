[[dialogues]]
id = "tungumal"
setting = "At the tourist information desk. The woman behind it speaks quickly."
setting_ja = "観光案内所のカウンター。係の女性は早口です。"
topics = ["clarifying"]
requires = ["talar_thu", "ensku", "eg_tala_sma_islensku", "gaetirdu_talad_haegar", "takk"]

  [[dialogues.turns]]
  opener = "Góðan daginn, hvað get ég gert fyrir þig?"
  opener_meaning = "Good day, what can I do for you?"
  opener_meaning_ja = "こんにちは、どのようなご用件ですか？"
  cue = "Ask if she speaks English."
  cue_ja = "英語を話すか聞いてください。"
  expect_text = "Talar þú ensku?"
  expect_meaning = "Do you speak English?"
  expect_meaning_ja = "英語を話しますか？"
  partner = "Já, smá. En þú talar íslensku?"
  partner_meaning = "Yes, a little. But you speak Icelandic?"
  partner_meaning_ja = "ええ、少し。でもあなたはアイスランド語を話すんですね？"

  [[dialogues.turns]]
  cue = "Say you speak a little Icelandic."
  cue_ja = "アイスランド語を少し話すと言ってください。"
  expect = "eg_tala_sma_islensku"
  partner = "Frábært! Tölum við bara íslensku."
  partner_meaning = "Great! We'll just speak Icelandic."
  partner_meaning_ja = "すばらしい！じゃあアイスランド語で話しましょう。"

  [[dialogues.turns]]
  cue = "That was too fast. Ask her to speak more slowly."
  cue_ja = "速すぎました。もっとゆっくり話すよう頼んでください。"
  expect = "gaetirdu_talad_haegar"
  partner = "Fyrirgefðu. Tölum við bara íslensku."
  partner_meaning = "Sorry. We'll just speak Icelandic."
  partner_meaning_ja = "ごめんなさい。アイスランド語で話しましょう。"

  [[dialogues.turns]]
  cue = "Say you understand, and thank her."
  cue_ja = "わかったと言って、お礼を言ってください。"
  expect_text = "Ég skil. Takk."
  expect_meaning = "I understand. Thanks."
  expect_meaning_ja = "わかりました。ありがとう。"

