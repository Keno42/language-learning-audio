difficulty = 4
topics = ["clarifying"]
chunks = ["hægar", "talað hægar", "Gætirðu talað hægar?"]
situation = "The barista is speaking far too fast. Ask her to speak more slowly."
situation_ja = "バリスタの話が速すぎます。もっとゆっくり話すよう頼んでください。"

[[items]]
id = "gaetirdu_endurtekid_thetta"
kind = "phrase"
target = "Gætirðu endurtekið þetta?"
meaning = "Could you repeat that?"
meaning_ja = "もう一度言ってもらえますか？"
difficulty = 4
topics = ["clarifying"]
chunks = ["þetta", "endurtekið þetta", "Gætirðu endurtekið þetta?"]
situation = "You missed the room number she said. Ask her to repeat it."
situation_ja = "部屋番号を聞き逃しました。もう一度言うよう頼んでください。"
# Issue #48 owner review round 2 on PR #52: a curated partner line for connect()'s
# recombination fallback, not a generic known-vocabulary pick — this is what "she said"
# that the situation above already presumes the learner missed, so answer A -> this line
# -> answer B forms a real exchange even with the instructor's own scaffolding stripped
# away (the owner's own worked example: "Gætirðu talað hægar?" -> "Auðvitað. Herbergið er
# númer tuttugu og þrjú." -> "Gætirðu endurtekið þetta?").
partner_cue = "Auðvitað. Herbergið er númer tuttugu og þrjú."

