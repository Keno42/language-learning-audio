[[items]]
id = "gaetirdu_talad_haegar"
kind = "phrase"
target = "Gætirðu talað hægar?"
meaning = "Could you speak more slowly?"
meaning_ja = "もっとゆっくり話してもらえますか？"
difficulty = 4
topics = ["clarifying"]
chunks = ["hægar", "talað hægar", "Gætirðu talað hægar?"]
situation = "The barista is speaking far too fast. Ask her to speak more slowly."
situation_ja = "バリスタの話が速すぎます。もっとゆっくり話すよう頼んでください。"
partner_cue = "Góðan daginn! Hvað má bjóða þér?"  # issue #48: the partner line between godan_daginn and this item in connect()
partner_cue_after = "godan_daginn"
partner_cue_setup = "You walk into a busy café in the morning. Greet the barista: good day."
partner_cue_setup_ja = "朝、混んでいるカフェに入りました。バリスタに、こんにちは、とあいさつしてください。"
partner_cue_meaning = "Good day! What can I get you?"
partner_cue_meaning_ja = "こんにちは！何になさいますか？"
partner_cue_situation = "She asked what you'd like, far too fast. Ask her to speak more slowly."
partner_cue_situation_ja = "何にするか聞かれましたが、早口すぎました。もっとゆっくり話すよう頼んでください。"

[[items]]
id = "gaetirdu_endurtekid_thetta"
kind = "phrase"
target = "Gætirðu endurtekið þetta?"
meaning = "Could you repeat that?"
meaning_ja = "もう一度言ってもらえますか？"
difficulty = 4
topics = ["clarifying"]
chunks = ["þetta", "endurtekið þetta", "Gætirðu endurtekið þetta?"]
situation = "You missed the room number she said. Ask her to repeat it."
situation_ja = "部屋番号を聞き逃しました。もう一度言うよう頼んでください。"
# Issue #48 owner review on PR #52: a curated partner line for connect()'s recombination
# fallback, not a generic known-vocabulary pick — this is what "she said" that the
# situation above already presumes the learner missed, so answer A -> this line ->
# answer B forms a real exchange even with the instructor's own scaffolding stripped away
# (the owner's own worked example: "Gætirðu talað hægar?" -> "Auðvitað. Herbergið er
# númer tuttugu og þrjú." -> "Gætirðu endurtekið þetta?"). partner_cue_after (owner review
# round 3) pins that this line is only compatible following gaetirdu_talad_haegar
# specifically, not any arbitrary item connect() might otherwise pair this one with.
partner_cue = "Auðvitað. Herbergið er númer tuttugu og þrjú."
partner_cue_after = "gaetirdu_talad_haegar"
partner_cue_setup = "At hotel reception, the receptionist is speaking far too fast. Ask her to speak more slowly."
partner_cue_setup_ja = "ホテルのフロントで、受付の人がとても早口です。もっとゆっくり話すよう頼んでください。"
partner_cue_meaning = "Of course. The room is number twenty-three."
partner_cue_meaning_ja = "もちろん。お部屋は23号室です。"
partner_cue_situation = "She slowed down, but you still missed the room number. Ask her to repeat it."
partner_cue_situation_ja = "ゆっくり話してくれましたが、部屋番号を聞き逃しました。もう一度言うよう頼んでください。"

