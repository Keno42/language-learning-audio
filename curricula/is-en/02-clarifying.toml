example = { time = "dag_acc" }
# gated on godur_gender's three greetings (so the gender note fires first) and the worked
# example's fill only — gating on every fill kept the arc from reaching the pattern until all
# three words were durable, i.e. several lessons of isolated «dag»/«nótt»/«kvöld» drills
prereqs = ["eigdu_godan_dag", "godan_daginn", "goda_nott", "gott_kvold", "dag_acc"]
pronunciation_notes = "the same accusative endings as «Góðan daginn / Góða nótt / Gott kvöld» — see the godur_gender note"
situation = "Your friend is leaving the café at six to meet her family. Wish her a good evening."
situation_ja = "友達が家族に会うため6時にカフェを出ます。良い夕べをと言ってください。"
