  [[dialogues.turns]]
  opener = "Sjáðu, þetta er dóttir mín."
  opener_meaning = "Look, this is my daughter."
  opener_meaning_ja = "見て、これが私の娘。"
  cue = "Ask what her name is."
  cue_ja = "彼女の名前を聞いてください。"
  expect = "hvad_heitir_hun"
  partner = "Hún heitir Sóley."
  partner_meaning = "Her name is Sóley."
  partner_meaning_ja = "ソウレイっていうの。"

  [[dialogues.turns]]
  cue = "Ask how old she is."
  cue_ja = "何歳か聞いてください。"
  expect = "hvad_er_hun_gomul"
  partner = "Hún er fjögurra ára. Áttu börn?"
  partner_meaning = "She's four. Do you have children?"
  partner_meaning_ja = "4歳。あなたは子どもいる？"

  [[dialogues.turns]]
  cue = "Say no, and show a photo: this is my brother."
  cue_ja = "いいえと言って、写真を見せながら、こちらは兄です、と言ってください。"
  expect_text = "Nei. Þetta er bróðir minn."
  expect_meaning = "No. This is my brother."
  expect_meaning_ja = "いいえ。こちらは私の兄です。"
  partner = "Býr hann líka í Tókýó?"
  partner_meaning = "Does he also live in Tokyo?"
  partner_meaning_ja = "彼も東京に住んでるの？"

  [[dialogues.turns]]
  cue = "Say he lives in Japan — no: say yes, he lives in Japan."
  cue_ja = "はい、彼は日本に住んでいます、と言ってください。"
  expect_text = "Já, hann býr í Japan."
  expect_meaning = "Yes, he lives in Japan."
  expect_meaning_ja = "はい、彼は日本に住んでいます。"
  partner = "Gaman að sjá þetta!"
  partner_meaning = "Nice to see these!"
  partner_meaning_ja = "見せてくれてうれしい！"
