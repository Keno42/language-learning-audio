[[dialogues]]
id = "peysubud"
setting = "In a wool shop. A shop assistant approaches."
topics = ["shopping"]
requires = ["eg_er_ad_leita_ad_thing", "attu", "peysu", "ma_eg_mata_thetta", "thetta_er_of_litid", "attu_thetta_i_staerra", "thetta_passar", "eg_aetla_ad_taka_thetta"]

  [[dialogues.turns]]
  opener = "Get ég aðstoðað?"
  opener_meaning = "Can I help you?"
  cue = "Ask if she has a sweater."
  expect_text = "Áttu peysu?"
  expect_meaning = "Do you have a sweater?"
  partner = "Já, hérna eru lopapeysur. Þessi er falleg."
  partner_meaning = "Yes, here are the wool sweaters. This one is beautiful."

  [[dialogues.turns]]
  cue = "Ask if you may try it on."
  expect = "ma_eg_mata_thetta"
  partner = "Auðvitað. Mátunarklefinn er þarna."
  partner_meaning = "Of course. The fitting room is over there."

  [[dialogues.turns]]
  cue = "Come out and say it's too small, and ask for a bigger size."
  expect_text = "Þetta er of lítið. Áttu þetta í stærra?"
  expect_meaning = "This is too small. Do you have it in a bigger size?"
  partner = "Já, hérna er large."
  partner_meaning = "Yes, here is a large."

  [[dialogues.turns]]
  cue = "Say it fits and you'll take it."
  expect_text = "Þetta passar. Ég ætla að taka þetta."
  expect_meaning = "It fits. I'll take it."
  partner = "Frábært. Kassinn er hérna."
  partner_meaning = "Great. The till is here."
