[[dialogues]]
id = "apotek"
setting = "At the pharmacy. The pharmacist greets you."
setting_ja = "薬局です。薬剤師があいさつします。"
topics = ["health"]
requires = ["eg_er_med", "hofudverk", "attu_eitthvad_vid_hofudverk", "hvad_kostar_thetta", "takk"]

  [[dialogues.turns]]
  opener = "Góðan daginn, get ég hjálpað?"
  opener_meaning = "Good day, can I help?"
  opener_meaning_ja = "こんにちは、どうされましたか？"
  cue = "Say you have a headache."
  cue_ja = "頭痛があると言ってください。"
  expect_text = "Ég er með höfuðverk."
  expect_meaning = "I have a headache."
  expect_meaning_ja = "頭痛があります。"
  partner = "Ertu líka með hita?"
  partner_meaning = "Do you also have a fever?"
  partner_meaning_ja = "熱もありますか？"

  [[dialogues.turns]]
  cue = "Say no, and ask if she has something for a headache."
  cue_ja = "いいえと言って、頭痛に効くものがあるか聞いてください。"
  expect_text = "Nei. Áttu eitthvað við höfuðverk?"
  expect_meaning = "No. Do you have something for a headache?"
  expect_meaning_ja = "いいえ。頭痛に効くものはありますか？"
  partner = "Já, þetta hérna."
  partner_meaning = "Yes, this one here."
  partner_meaning_ja = "はい、こちらです。"

  [[dialogues.turns]]
  cue = "Ask how much it is."
  cue_ja = "いくらか聞いてください。"
  expect = "hvad_kostar_thetta"
  partner = "Níu hundruð krónur."
  partner_meaning = "Nine hundred krónur."
  partner_meaning_ja = "900クローナです。"

  [[dialogues.turns]]
  cue = "Thank her."
  cue_ja = "お礼を言ってください。"
  expect = "takk"
  partner = "Bless bless!"
  partner_meaning = "Bye bye!"
  partner_meaning_ja = "またね！"

[[dialogues]]
id = "laeknir"
setting = "At the health centre. The doctor comes in."
setting_ja = "保健センターです。医者が入ってきます。"
topics = ["health"]
requires = ["mer_lidur_illa", "eg_er_med", "hita", "halsbolgu", "thad_er_sart_herna", "eg_er_med_sjukratryggingu"]

  [[dialogues.turns]]
  opener = "Góðan daginn. Hvað er að?"
  opener_meaning = "Good day. What's wrong?"
  opener_meaning_ja = "こんにちは。どうしましたか？"
  cue = "Say you feel unwell and you have a fever."
  cue_ja = "気分が悪く、熱があると言ってください。"
  expect_text = "Mér líður illa. Ég er með hita."
  expect_meaning = "I feel unwell. I have a fever."
  expect_meaning_ja = "気分が悪いです。熱があります。"
  partner = "Ertu með hálsbólgu?"
  partner_meaning = "Do you have a sore throat?"
  partner_meaning_ja = "喉は痛みますか？"

  [[dialogues.turns]]
  cue = "Say yes, and say it hurts here."
  cue_ja = "はいと言って、ここが痛いと言ってください。"
  expect_text = "Já. Það er sárt hérna."
  expect_meaning = "Yes. It hurts here."
  expect_meaning_ja = "はい。ここが痛いです。"
  partner = "Ég skil."
  partner_meaning = "I see."
  partner_meaning_ja = "なるほど。"

  [[dialogues.turns]]
  cue = "Say you have health insurance."
  cue_ja = "健康保険に入っていると言ってください。"
  expect = "eg_er_med_sjukratryggingu"
  partner = "Gott. Bless bless!"
  partner_meaning = "Good. Bye bye!"
  partner_meaning_ja = "結構です。またね！"
