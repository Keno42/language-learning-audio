[[dialogues]]
id = "ferdaskrifstofa"
setting = "At a tour desk in the town centre."
topics = ["travel"]
requires = ["eg_vil_fara_i_hvalaskodun", "hvad_kostar_ferdin", "hvenaer_leggjum_vid_af_stad", "hvar_er_saekt", "eg_aetla_ad_taka_thetta"]

  [[dialogues.turns]]
  opener = "Hæ! Hvað get ég gert fyrir þig?"
  opener_meaning = "Hi! What can I do for you?"
  cue = "Say you want to go whale watching."
  expect = "eg_vil_fara_i_hvalaskodun"
  partner = "Frábært, það er ferð á morgun."
  partner_meaning = "Great, there's a tour tomorrow."

  [[dialogues.turns]]
  cue = "Ask how much the tour costs."
  expect = "hvad_kostar_ferdin"
  partner = "Tólf þúsund krónur."
  partner_meaning = "Twelve thousand krónur."

  [[dialogues.turns]]
  cue = "Ask when you set off, and where the pick-up is."
  expect_text = "Hvenær leggjum við af stað? Hvar er sótt?"
  expect_meaning = "When do we set off? Where is the pick-up?"
  partner = "Klukkan níu, við höfnina."
  partner_meaning = "At nine, at the harbour."

  [[dialogues.turns]]
  cue = "Say you'll take it."
  expect = "eg_aetla_ad_taka_thetta"
  partner = "Góða ferð á morgun!"
  partner_meaning = "Have a good trip tomorrow!"
