[[dialogues]]
id = "nagranni"
setting = "You meet your neighbour on the stairs in the morning."
setting_ja = "朝、階段で近所の人に会いました。"
topics = ["greetings", "social"]
requires = ["godan_daginn", "hvad_segirdu_gott", "allt_gott", "en_thu", "sjaumst"]

  [[dialogues.turns]]
  cue = "Greet her with good day and ask how she is."
  cue_ja = "こんにちはとあいさつして、元気か聞いてください。"
  expect_text = "Góðan daginn. Hvað segirðu gott?"
  expect_meaning = "Good day. How are you?"
  expect_meaning_ja = "こんにちは。元気？"
  partner = "Allt gott, takk. En þú?"
  partner_meaning = "All good, thanks. And you?"
  partner_meaning_ja = "元気だよ、ありがとう。あなたは？"

  [[dialogues.turns]]
  cue = "Say all good, thanks."
  cue_ja = "元気です、ありがとうと言ってください。"
  expect = "allt_gott"
  partner = "Gott að heyra. Jæja, ég verð að fara."
  partner_meaning = "Good to hear. Well, I have to go."
  partner_meaning_ja = "よかった。じゃあ、もう行かないと。"

  [[dialogues.turns]]
  cue = "Say OK, see you!"
  cue_ja = "わかりました、またね、と言ってください。"
  expect_text = "Allt í lagi. Sjáumst!"
  expect_meaning = "OK. See you!"
  expect_meaning_ja = "わかりました。またね！"
  partner = "Sjáumst!"
  partner_meaning = "See you!"
  partner_meaning_ja = "またね！"
