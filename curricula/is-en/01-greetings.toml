# 01 — greetings and politeness

[[items]]
id = "godan_daginn"
kind = "phrase"
target = "Góðan daginn."
meaning = "Good day."
meaning_ja = "こんにちは。"
difficulty = 2
topics = ["greetings"]
situation = "You walk into a bakery in the morning. Greet the person behind the counter."
situation_ja = "朝、パン屋に入ります。店の人にあいさつしてください。"

[[items]]
id = "takk"
kind = "phrase"
target = "Takk."
meaning = "Thanks."
meaning_ja = "ありがとう。"
alternatives = ["Takk fyrir."]
difficulty = 1
topics = ["greetings"]
situation = "The barista hands you your coffee. Thank her."
situation_ja = "バリスタがコーヒーを渡してくれました。お礼を言ってください。"

[[items]]
id = "hvad_segirdu_gott"
kind = "phrase"
target = "Hvað segirðu gott?"
meaning = "How are you?"
meaning_ja = "元気？"
difficulty = 3
topics = ["greetings", "social"]
chunks = ["gott", "segirðu gott", "Hvað segirðu gott?"]
situation = "You bump into your neighbour. Ask how she is."
situation_ja = "近所の人にばったり会いました。元気か聞いてください。"

[[items]]
id = "en_thu"
kind = "phrase"
target = "En þú?"
meaning = "And you?"
meaning_ja = "あなたは？"
difficulty = 1
topics = ["social"]
situation = "You've answered her question. Return it to her."
situation_ja = "質問に答えました。同じ質問を返してください。"

[[items]]
id = "hae"
kind = "phrase"
target = "Hæ."
meaning = "Hi."
meaning_ja = "やあ。"
difficulty = 1
topics = ["greetings"]
situation = "A friend waves at you across the street. Greet them casually."
situation_ja = "通りの向こうから友達が手を振っています。くだけたあいさつをしてください。"

[[items]]
id = "hallo"
kind = "phrase"
target = "Halló."
meaning = "Hello."
meaning_ja = "もしもし。／ハロー。"
difficulty = 1
topics = ["greetings"]
situation = "You answer the phone."
situation_ja = "電話に出ます。"
pronunciation_notes = "'Halló' is a Danish loanword (in use since the 1600s) and is pronounced with a plain 'l', close to the familiar 'hello' — not the pre-aspirated click that native double-'l' words get (e.g. 'fjall', mountain; 'jökull', glacier), which this course pronounces properly wherever it genuinely occurs."

[[items]]
id = "allt_gott"
