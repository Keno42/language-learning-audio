difficulty = 2
tags = ["adj_neut"]
topics = ["adjectives", "discourse"]
situation = "Anna says the road is open. Say: great!"
situation_ja = "アンナが道路が開通したと言いました。「すばらしい！」と言ってください。"

# Promoted from module 24 (issue #29 triage): the "nagranni" dialogue right below
# uses this verbatim as its partner's reaction line, at order ~11 — 915 items before
# it was otherwise taught. See docs/HANDOFF.md.
[[items]]
id = "gott_ad_heyra"
kind = "phrase"
target = "Gott að heyra."
meaning = "Good to hear."
meaning_ja = "それはよかった。"
difficulty = 2
topics = ["discourse"]
situation = "A friend says she's feeling better. Say good to hear."
situation_ja = "友達が体調が良くなったと言いました。よかったと言ってください。"
partner_cue = "Mér líður miklu betur, takk."  # issue #48: the partner line between hvad_segirdu_gott and this item in connect()
partner_cue_after = "hvad_segirdu_gott"
partner_cue_setup = "Your friend was ill last week. You bump into her. Ask how she is."
partner_cue_setup_ja = "先週具合が悪かった友達にばったり会いました。元気か聞いてください。"
partner_cue_meaning = "I feel much better, thanks."
partner_cue_meaning_ja = "ずっと良くなったよ、ありがとう。"
partner_cue_situation = "She said she feels much better. Say good to hear."
partner_cue_situation_ja = "ずっと良くなったと言いました。それはよかったと言ってください。"

[[dialogues]]
id = "nagranni"
setting = "You meet your neighbour on the stairs in the morning."
setting_ja = "朝、階段で近所の人に会いました。"
topics = ["greetings", "social"]
requires = ["godan_daginn", "hvad_segirdu_gott", "allt_gott", "en_thu", "sjaumst"]

  [[dialogues.turns]]
  cue = "Greet her with good day and ask how she is."
  cue_ja = "こんにちはとあいさつして、元気か聞いてください。"
  expect_text = "Góðan daginn. Hvað segirðu gott?"
  expect_meaning = "Good day. How are you?"
  expect_meaning_ja = "こんにちは。元気？"
  partner = "Allt gott, takk. En þú?"
  partner_meaning = "All good, thanks. And you?"
  partner_meaning_ja = "元気だよ、ありがとう。あなたは？"

  [[dialogues.turns]]
  cue = "Say all good, thanks."
  cue_ja = "元気です、ありがとうと言ってください。"
  expect = "allt_gott"
  partner = "Gott að heyra. Jæja, ég verð að fara."
  partner_meaning = "Good to hear. Well, I have to go."
  partner_meaning_ja = "よかった。じゃあ、もう行かないと。"

  [[dialogues.turns]]
  cue = "Say OK, see you!"
  cue_ja = "わかりました、またね、と言ってください。"
  expect_text = "Allt í lagi. Sjáumst!"
  expect_meaning = "OK. See you!"
  expect_meaning_ja = "わかりました。またね！"
  partner = "Sjáumst!"
  partner_meaning = "See you!"
  partner_meaning_ja = "またね！"
