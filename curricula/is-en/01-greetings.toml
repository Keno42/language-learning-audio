[[items]]
id = "hallo"
kind = "phrase"
target = "Halló."
meaning = "Hello."
meaning_ja = "もしもし。／ハロー。"
difficulty = 1
topics = ["greetings"]
situations = [
  "Your phone rings. Answer it.",
  "You pick up a call from a number you don't know. Say hello.",
  "You walk into your friend's flat, but nobody seems to be home. Call out hello.",
]
situations_ja = [
  "電話が鳴りました。電話に出てください。",
  "知らない番号からの電話に出ます。「もしもし」と言ってください。",
  "友達の部屋に入りましたが、誰もいないようです。「こんにちは」と呼びかけてください。",
]
pronunciation_notes = "'Halló' is a Danish loanword (in use since the 1600s) and is pronounced with a plain 'l', close to the familiar 'hello' — not the pre-aspirated click that native double-'l' words get (e.g. 'fjall', mountain; 'jökull', glacier), which this course pronounces properly wherever it genuinely occurs."

