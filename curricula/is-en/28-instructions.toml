# 28 — instructions in Icelandic (#429, the long run: O2, H8)
# The instructor's most frequent commands, said in Icelandic once taught: «Endurtaktu.» for «Repeat.», «Hlustaðu.» for «Listen.».
# Each is taught as material, on top of the day's new items (it takes no place among them), then said in an Icelandic voice with the English after it,
# until the learner's review has recalled it twice; a failure brings the English back. `command` names the instruction it replaces.
# Step 2 (lesson 54: «the instructions in Icelandic did not increase»): «Hægt.» for «Slowly.» and «Hlustaðu aftur.» for a pick-out's «Listen
# again.», the two said most after the first pair (four times each in lesson 54). One a lesson, in this order. Candidates until
# native-checked (#209).

