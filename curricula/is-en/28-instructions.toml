# 28 — instructions in Icelandic (#429, the long run: O2, H8)
# The instructor's most frequent lines, said in Icelandic once taught: «Endurtaktu.» for «Repeat.», «Hlustaðu.» for «Listen.».
# Each is taught as material, on top of the day's new items (it takes no place among them), one a lesson in this file's order, then said in
# an Icelandic voice with the English after it in the lesson that teaches it and the next; from the third lesson it is said alone, and a
# failure brings the English back (`Builder.command_support`). `command` names the line it replaces (`content.COMMAND_KEYS`).
# The order is how often the lessons say them: lesson 54 for «Hægt.» and «Hlustaðu aftur.»; lesson 57 (all four taught, «no new Icelandic
# instruction came») for «Og á eðlilegum hraða.» (9 times), «Svarið:» (6), «Aftur að tala.» (6), «Samtalinu er lokið.» (5) and «Nú kemur
# stutt samtal.» (4: a conversation's opening, «Now a short conversation.»); lesson 59 (the lines left run out in lesson 62) for the frames of
# a cue, «Segðu:» («Say:», «In Icelandic, say:»: 40 times) and «Hvernig segir maður:» («How do you say:»: 18), said between the cue's lead
# and what to say, which stays in the learner's language (`exercises.cue_frames`); lessons 63–67 on the replay of lesson 60's export (those
# two taught, the lines left run out in lesson 64) for the next frames, «Kláraðu setninguna:» (a cloze's «Complete the sentence to say:»: 5–13
# a lesson) and «Eitthvað nýtt.» (a new item's «Something new.»: 2–6), said the same way; lessons 63–69 on the replay of lesson 62's export
# (the frames taught, the lines left run out in lesson 66) for the form work's own lines, «Segðu hverja setningu.» («Now say each one.»: 26
# times in eight lessons) and «Æfingunni er lokið.» (its way back, «That's the end of the form work.»: 15, said as «Samtalinu er lokið.» is);
# lessons 64–71 on the replay of lesson 64's export (the form work's lines taught in lessons 67 and 68, none left from lesson 69) for an aside's
# own lines, «Smá útúrdúr.» («A quick aside.»: 19 times in eight lessons) and «Aftur að efninu.» («Back to the lesson.»: 19, which builds on
# «Aftur að tala.»). A milestone's «Here's a pattern worth noticing.» and «Let's continue.» stay in English. Lessons 65–72 on the replay of
# lesson 65's export (an aside's lines taught in lessons 69 and 70) for a part's frame inside its sentence, «Þessi orð eru í setningunni:»
# («These words are in it:»: 18 times in eight lessons) and «Þetta orð er í setningunni:» («This word is in it:»: 7), which build on
# «Kláraðu setninguna:», and a build-up's lead, «Byrjum á endanum.» («Let's build it up from the end.»: 13), said before «Endurtaktu.».
# Lessons 66–73 on the replay of lesson 66's export (a part's frames and a build-up's lead taught in lessons 71–73) for «Úr orðum sem þú
# kannt.» («Made of words you know.»: 15 times in eight lessons), a framing line before a line asked as a use of known words, and a known
# conversation's opening, «Samtalið aftur. Þú kannt þínar setningar. Segðu þær þegar þú átt að tala.» («The conversation again. You know your
# lines: say them when it's your turn.»: 14), each of the English line's three parts said, the last the learner's action; it builds on
# «setninguna», «Segðu hverja setningu.» and «Aftur að tala.» (review of #588: without «Segðu þær …», the action went with the English;
# the owner chose «þegar þú átt að tala», words the learner has, over «þegar röðin kemur að þér», which brings a new word).
# Lessons 67–74 on the replay of lesson 67's export (the lines above taught in lessons 67–75) for a pick-out's need, said before the line to
# listen to: «Listen for how long it takes, then say it.» (13 times in eight lessons) and «Listen for the price, then say it.» (8), the most
# frequent of the seven needs (35 in all). Each is the question the learner asks for that information, which they have («Hvað tekur þetta
# langan tíma?», «Hvað kostar þetta?»), then «Hlustaðu og segðu það.», built on «Hlustaðu.» and «Segðu:»: the need heard as what one asks.
# An instruction's meaning, the cue the lesson and the written review ask it by, quotes the English line it replaces and names it an
# instruction: «Say: the instruction "How do you say".» (lesson 65: «Say: How do you say, before what to say.» read as two frames in a row).
# Candidates until native-checked (#209).

