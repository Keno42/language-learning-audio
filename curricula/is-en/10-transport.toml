[[dialogues]]
id = "straeto"
setting = "A bus pulls up at the stop. You step up to the driver."
setting_ja = "バスが停留所に来ました。運転手のところへ進みます。"
topics = ["transport"]
requires = ["fer_thessi_straeto_i_midbaeinn", "einn_mida_takk", "hvar_a_eg_ad_fara_ut", "takk"]

  [[dialogues.turns]]
  cue = "Ask whether this bus goes to the town centre."
  cue_ja = "このバスは町の中心に行くか聞いてください。"
  expect = "fer_thessi_straeto_i_midbaeinn"
  partner = "Já, þessi fer í miðbæinn."
  partner_meaning = "Yes, this one goes to the centre."
  partner_meaning_ja = "ええ、これは中心街に行きます。"

  [[dialogues.turns]]
  cue = "Ask for one ticket."
  cue_ja = "切符を一枚頼んでください。"
  expect = "einn_mida_takk"
  partner = "Gjörðu svo vel."
  partner_meaning = "Here you are."
  partner_meaning_ja = "どうぞ。"

  [[dialogues.turns]]
  cue = "Ask where you should get off."
  cue_ja = "どこで降りればいいか聞いてください。"
  expect = "hvar_a_eg_ad_fara_ut"
  partner = "Á Hlemmi. Ég læt þig vita."
  partner_meaning = "At Hlemmur. I'll let you know."
  partner_meaning_ja = "フレンムルで。声をかけますよ。"

  [[dialogues.turns]]
  cue = "Thank him."
  cue_ja = "お礼を言ってください。"
  expect = "takk"

[[dialogues]]
id = "flugvollur"
setting = "At the check-in desk at Keflavík airport."
setting_ja = "ケプラヴィーク空港のチェックインカウンターにいます。"
topics = ["transport"]
requires = ["eg_a_bokun", "eg_er_med_eina_tosku", "hvar_er_hlidid", "hvenaer_fer_flugid", "takk"]

  [[dialogues.turns]]
  opener = "Góðan daginn. Vegabréf, takk."
  opener_meaning = "Good day. Passport, please."
  opener_meaning_ja = "こんにちは。パスポートをお願いします。"
  cue = "Hand it over and say you have a booking."
  cue_ja = "パスポートを渡して、予約があると言ってください。"
  expect = "eg_a_bokun"
  partner = "Takk. Ertu með farangur?"
  partner_meaning = "Thanks. Do you have luggage?"
  partner_meaning_ja = "ありがとうございます。お荷物はありますか？"

  [[dialogues.turns]]
  cue = "Say you have one bag."
  cue_ja = "荷物は一つだと言ってください。"
  expect = "eg_er_med_eina_tosku"
  partner = "Settu hana hérna. Gjörðu svo vel, brottfararspjaldið."
  partner_meaning = "Put it here. Here you are, the boarding pass."
  partner_meaning_ja = "ここに置いてください。どうぞ、搭乗券です。"

  [[dialogues.turns]]
  cue = "Ask where the gate is."
  cue_ja = "搭乗口はどこか聞いてください。"
  expect = "hvar_er_hlidid"
  partner = "Hlið tólf, beint áfram."
  partner_meaning = "Gate twelve, straight ahead."
  partner_meaning_ja = "12番ゲート、まっすぐです。"

  [[dialogues.turns]]
  cue = "Ask when the flight leaves."
  cue_ja = "フライトは何時に出るか聞いてください。"
  expect = "hvenaer_fer_flugid"
  partner = "Klukkan hálf þrjú. Góða ferð!"
  partner_meaning = "At half past two. Have a good trip!"
  partner_meaning_ja = "2時半です。良いご旅行を！"
