[[dialogues]]
id = "spjall"
setting = "Chatting with Anna over a second coffee."
setting_ja = "二杯目のコーヒーを飲みながらアンナとおしゃべり。"
topics = ["discourse"]
requires = ["er_thad", "eg_er_sammala", "thad_er_synd", "vid_sjaum_til", "thad_er_god_hugmynd"]

  [[dialogues.turns]]
  opener = "Ég fór í sund í morgun."
  opener_meaning = "I went swimming this morning."
  opener_meaning_ja = "今朝、海で泳いだの。"
  cue = "React: really?"
  cue_ja = "そうなの？と反応してください。"
  expect = "er_thad"
  partner = "Já! Það er kalt en það er svo gott á eftir."
  partner_meaning = "Yes! It's cold but it feels so good afterwards."
  partner_meaning_ja = "うん！冷たいけど、後がすごく気持ちいいの。"

  [[dialogues.turns]]
  cue = "Say you agree."
  cue_ja = "賛成だと言ってください。"
  expect = "eg_er_sammala"
  partner = "Komdu með á morgun! Nei, bíddu, á morgun er ég að vinna."
  partner_meaning = "Come along tomorrow! No, wait, tomorrow I'm working."
  partner_meaning_ja = "明日一緒に来て！あ、待って、明日は仕事だ。"

  [[dialogues.turns]]
  cue = "Say that's a pity."
  cue_ja = "残念だと言ってください。"
  expect = "thad_er_synd"
  partner = "Kannski um helgina?"
  partner_meaning = "Maybe at the weekend?"
  partner_meaning_ja = "週末はどう？"

  [[dialogues.turns]]
  cue = "Say that's a good idea — we'll see."
  cue_ja = "いい考えですね、様子を見ましょう、と言ってください。"
  expect_text = "Það er góð hugmynd. Við sjáum til."
  expect_meaning = "That's a good idea. We'll see."
  expect_meaning_ja = "いい考えですね。様子を見ましょう。"
