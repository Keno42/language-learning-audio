  { source = "Ég er stressuð.", source_meaning = "I'm stressed.", source_meaning_ja = "私はストレスがたまっています。", result = "Hún er stressuð.", result_meaning = "She's stressed.", result_meaning_ja = "彼女はストレスがたまっています。" },
  { source = "Ég er tilbúin.", source_meaning = "I'm ready.", source_meaning_ja = "私は準備ができています。", result = "Hún er tilbúin.", result_meaning = "She's ready.", result_meaning_ja = "彼女は準備ができています。" },
]

[[dialogues]]
id = "kvedja"
setting = "The end of your stay. Anna drives you to the airport bus."
setting_ja = "滞在の最終日。アンナが空港バスまで送ってくれます。"
topics = ["feelings", "greetings"]
requires = ["thad_var_gaman", "takk_fyrir_kvoldid", "eg_sakna_thin", "eg_mun_koma_aftur", "goda_ferd"]

  [[dialogues.turns]]
  opener = "Jæja."
  opener_meaning = "Well."
  opener_meaning_ja = "さて。"
  cue = "Say that was fun, and thank her for everything."
  cue_ja = "楽しかったと言って、いろいろありがとうと伝えてください。"
  expect_text = "Það var gaman. Takk fyrir allt."
  expect_meaning = "That was fun. Thanks for everything."
  expect_meaning_ja = "楽しかったです。いろいろありがとう。"
  partner = "Ekkert að þakka. Ég á eftir að sakna þín."
  partner_meaning = "You're welcome. I'm going to miss you."
  partner_meaning_ja = "どういたしまして。寂しくなるな。"

  [[dialogues.turns]]
  cue = "Say you'll miss her too, and you'll come back."
  cue_ja = "自分も寂しくなる、また来る、と言ってください。"
  expect_text = "Ég sakna þín líka. Ég kem aftur."
  expect_meaning = "I'll miss you too. I'll come back."
  expect_meaning_ja = "私も寂しいです。また来ます。"
  partner = "Góða ferð! Sjáumst!"
  partner_meaning = "Have a good trip! See you!"
  partner_meaning_ja = "良い旅を！またね！"
