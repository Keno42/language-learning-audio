[[items]]
id = "godur_noun"
kind = "construction"
target = "{adj} {noun}."
meaning = "Good {noun:bare}."  # the bare form: the nouns' in_sentence forms carry "a" for «Þetta er {thing}.»
meaning_ja = "良い{noun}。"
difficulty = 3
topics = ["adjectives", "grammar"]
slots = { noun = "gendered_noun" }
agreement = { adj = { from = "noun", masc = "Góður", fem = "Góð", neut = "Gott" } }
example = { noun = "hus" }
prereqs = ["godur_matur", "gott_vedur", "thad_er_god_hugmynd", "bill", "bok", "hus"]
pronunciation_notes = "the adjective's own ending tracks the noun's gender, not just which noun is named — see the «góður/góð/gott» note (90-notes.toml)"
# Issue #29 owner review: earlier milestones (godur_gender, godur_gender_nominative) only ever
# paired the góður/góð/gott forms with pre-authored phrases — the *learner* never combined the
# gender rule with a noun themselves. This construction is the actual generate-from-parts pilot:
# `resolve_slots` derives {adj} from whichever known noun (bíll/bók/hús, each independently
# learnable, see their own gendered_noun items) fills {noun}, so "Góður bíll."/"Góð bók." are
# never authored as their own items — they're produced the first time the learner reaches this
# construction already knowing a masculine or feminine gendered_noun.
#
# Owner review on PR #50, point 1: the *system* can resolve a noun's gender from `Item.gender`,
# but nothing previously taught the *learner* that bíll/bók/hús carry that gender — it only ever
# lived in curriculum metadata. Gating on all three (not just the worked example, `hus`) means
# the note below has always fired, and the learner has actually been told each noun's gender,
# before this construction can ever be reached.

[[items]]
id = "adjective_opposites"
kind = "transform"
target = "gott → vont"
meaning = "saying the opposite"
meaning_ja = "反対の意味を言う"
difficulty = 2
topics = ["grammar", "adjectives"]
instruction = "Say the opposite:"
instruction_ja = "反対の意味で言ってください。"
prereqs = ["thetta_er_adj", "vont"]
examples = [
  { source = "Þetta er gott.", source_meaning = "This is good.", source_meaning_ja = "これは良いです。", result = "Þetta er vont.", result_meaning = "This is bad.", result_meaning_ja = "これは悪いです。" },
  { source = "Þetta er dýrt.", source_meaning = "This is expensive.", source_meaning_ja = "これは高いです。", result = "Þetta er ódýrt.", result_meaning = "This is cheap.", result_meaning_ja = "これは安いです。" },
  { source = "Þetta er stórt.", source_meaning = "This is big.", source_meaning_ja = "これは大きいです。", result = "Þetta er lítið.", result_meaning = "This is small.", result_meaning_ja = "これは小さいです。" },
  { source = "Þetta er erfitt.", source_meaning = "This is difficult.", source_meaning_ja = "これは難しいです。", result = "Þetta er auðvelt.", result_meaning = "This is easy.", result_meaning_ja = "これは簡単です。" },
  { source = "Þetta er nýtt.", source_meaning = "This is new.", source_meaning_ja = "これは新しいです。", result = "Þetta er gamalt.", result_meaning = "This is old.", result_meaning_ja = "これは古いです。" },
  { source = "Þetta er skemmtilegt.", source_meaning = "This is fun.", source_meaning_ja = "これは楽しいです。", result = "Þetta er leiðinlegt.", result_meaning = "This is boring.", result_meaning_ja = "これは退屈です。" },
  { source = "Það er opið.", source_meaning = "It's open.", source_meaning_ja = "開いています。", result = "Það er lokað.", result_meaning = "It's closed.", result_meaning_ja = "閉まっています。" },
]

