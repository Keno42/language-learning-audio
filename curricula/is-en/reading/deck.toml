# Reading deck (issue #133): the audio course never shows spelling, so reading signs,
# shop words and place names — and enjoying it — is taught here, as cards the Discord
# review shows a few at a time (read aloud → reveal meaning and hint → 🔊 TTS).
#
# A subdirectory, so load_curriculum never reads it as a module. Stages run in order:
# letters (sounds anchored in words the audio course already taught) → signs → shop →
# places → parts (what place names are made of).
#
# `hint_ja` is a katakana approximation for a Japanese speaker, not a transcription: the
# 🔊 button plays the real pronunciation, and the native tutor checks these hints (#129).
# General content only: a learner's own places come from the private trip profile (#132).

# ---------------------------------------------------------------- letters

[[cards]]
id = "l_thorn"
stage = "letters"
text = "Það · Þetta · Því miður"
meaning = "þ: the 'th' of 'think'"
meaning_ja = "þ は英語 think の th（息だけで出す音）"
hint_ja = "サズ・セッタ・スヴィ ミズル（最初の「サ・セ・ス」は舌を歯にあてた th）"
words = [["Það", "それ"], ["Þetta", "これ"], ["Því miður", "残念ながら"]]

[[cards]]
id = "l_eth"
stage = "letters"
text = "Góðan daginn · Fyrirgefðu"
meaning = "ð: the 'th' of 'this'"
meaning_ja = "ð は英語 this の th（声を出す th）"
hint_ja = "ゴウザン ダイイン・フィリルゲヴズ（「ザ・ズ」は this の th）"
words = [["Góðan daginn", "こんにちは"], ["Fyrirgefðu", "すみません"]]

