# The scene check (owner, 2026-10-16; LEARNING-DESIGN §9 "Good enough overall"; docs/SCENE-REVIEW.md).
#
# A pattern makes a sentence with every fill its slot's tag allows. Grammatical is not enough: the learner must be able to picture
# someone saying it. Each verdict here is on one fill of one pattern:
#
#   fill = "a scene in one line"   the sentence has a scene; the lesson uses this line as the cue when it asks the sentence
#                                  («It's raining and your friend suggests a walk. Say: I can't be bothered to go out.»)
#   fill = false                   the sentence has no scene a traveller would be in: it is never generated
#   "*" = "a scene in one line"    the pattern's line, for every fill without a line of its own, when the scene does not depend on
#                                  the fill («Your friend asks what time it is.» for every hour); a fill's own line or false overrides it.
#                                  A fill tagged later takes it without a review (`audiolesson validate` counts them).
#
# A sentence of several slots takes the line of its one fill that has one, else the pattern's line.
# A fill with no verdict is still generated, and `audiolesson validate` counts it; `audiolesson scene-check` prints the sheet to judge.
# A scene is in English (the course's primary language); a learner of another language gets the meaning alone until a
# per-language line is added ({ en = "…", ja = "…" }).

[scenes.attu]
leigubil = false  # «Áttu leigubíl?»: you don't ask someone whether they own a taxi (#192)
vegabref = "Your Icelandic friend wants to visit you in Japan next year."  # asks whether one owns a passport (#192's point): so a trip being planned, not the way to the airport («Ertu með vegabréfið?»)
poka = "At the till, you have no bag."
peysu = "Your friend is shivering on the boat."
sundfot = "Your friend wants to come to the pool with you."
mida = "The bus is coming, and your friend is searching her pockets."
ost = "At the small corner shop, you can't see what you want."
egg = "At the small corner shop, you can't see what you want."
smjor = "At the small corner shop, you can't see what you want."
mjolk = "At the small corner shop, you can't see what you want."
epli = "At the small corner shop, you can't see what you want."

[scenes.ma_eg_inf]
sofa = false  # «Má ég sofa?»: a traveller does not ask permission to sleep (#333)
fara_heim = "The workshop runs late, and you ask the organiser."
kaupa_mida = "You're at the counter, not sure tickets are sold here."
fara_a_safnid = false  # «Má ég» asks permission: an adult traveller asks whether the museum is open or how to get there, not whether they may go
borda = false  # an adult does not ask permission to eat; at a host's table it is «Má ég byrja?»
fara_i_sund = false  # an adult does not ask permission to go swimming
drekka_kaffi = false  # one asks for coffee («Get ég fengið kaffi?»), not permission to drink it

[scenes.fer_thessi_straeto_dest]
