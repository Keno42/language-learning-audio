[[dialogues]]
id = "kynning"
setting = "At a friend's kitchen table you're introduced to Anna."
setting_ja = "友達の家の食卓で、アンナを紹介されました。"
topics = ["social"]
requires = ["eg_heiti", "eg_er_fra_japan", "en_thu", "ja", "eg_er_i_frii", "takk"]

  [[dialogues.turns]]
  opener = "Hæ! Hvað heitir þú?"
  opener_meaning = "Hi! What's your name?"
  opener_meaning_ja = "やあ！お名前は？"
  cue = "Say your name is Yuki."
  cue_ja = "名前はユキだと言ってください。"
  expect = "eg_heiti"
  partner = "Gaman að kynnast þér. Hvaðan ert þú?"
  partner_meaning = "Nice to meet you. Where are you from?"
  partner_meaning_ja = "はじめまして。どちらのご出身？"

  [[dialogues.turns]]
  cue = "Say you're from Japan, then ask: and you?"
  cue_ja = "日本から来たと言って、あなたは？と聞き返してください。"
  expect_text = "Ég er frá Japan. En þú?"
  expect_meaning = "I'm from Japan. And you?"
  expect_meaning_ja = "日本から来ました。あなたは？"
  partner = "Ég er frá Akureyri. Ertu í fríi?"
  partner_meaning = "I'm from Akureyri. Are you on holiday?"
  partner_meaning_ja = "私はアークレイリ出身です。休暇ですか？"

  [[dialogues.turns]]
  cue = "Say yes, you're on holiday."
  cue_ja = "はい、休暇中だと答えてください。"
  expect_text = "Já, ég er í fríi."
  expect_meaning = "Yes, I'm on holiday."
  expect_meaning_ja = "はい、休暇中です。"
  partner = "Velkomin!"
  partner_meaning = "Welcome!"
  partner_meaning_ja = "ようこそ！"

  [[dialogues.turns]]
  cue = "Thank her."
  cue_ja = "お礼を言ってください。"
  expect = "takk"

# Relocated from module 20 (issue #29 cluster B, PR #53 follow-up — the owner's own triage
# comment on #29 names this exactly: "leigubill... a reusable 'have been' construction").
# leigubill's own opener asks "Hefurðu verið hér áður?" ("Have you been here before?"); this
# was sitting 500+ items past that point, unresequenced. Not turned into a slot-fill
# construction: the only other "hef + participle" example in the curriculum
# (eg_hef_aldrei_smakkad_thetta, "I've never tasted this") takes a direct object where this one
# takes a place adverbial ("hér áður") — too little shared shape for one clean template, so this
# stays what it already was, a genuinely useful whole phrase, just correctly positioned.
[[items]]
id = "eg_hef_verid_her_adur"
kind = "phrase"
target = "Ég hef verið hér áður."
meaning = "I have been here before."
meaning_ja = "前にここに来たことがあります。"
difficulty = 4
topics = ["grammar", "social"]
chunks = ["áður", "hér áður", "verið hér áður", "Ég hef verið hér áður."]
situation = "The driver asks if it's your first time. Say you've been here before."
situation_ja = "運転手に初めてか聞かれました。前に来たことがあると答えてください。"

[[dialogues]]
id = "leigubill"
setting = "In a taxi from the airport. The driver makes conversation."
setting_ja = "空港からのタクシーの中。運転手が話しかけてきます。"
topics = ["social", "transport"]
requires = ["eg_er_her_i_fyrsta_sinn", "eg_er_her_i_viku", "eg_er_job", "forritari", "mer_finnst_island_fallegt", "eg_by_i", "tokyo_dat"]

  [[dialogues.turns]]
  opener = "Hefurðu verið hér áður?"
  opener_meaning = "Have you been here before?"
  opener_meaning_ja = "アイスランドに来たことはありますか？"
  cue = "Say you're here for the first time."
  cue_ja = "初めてだと言ってください。"
  expect = "eg_er_her_i_fyrsta_sinn"
  partner = "Og hvað ertu lengi?"
  partner_meaning = "And how long are you staying?"
  partner_meaning_ja = "どのくらい滞在するんですか？"

  [[dialogues.turns]]
  cue = "Say you're here for a week."
  cue_ja = "一週間滞在すると言ってください。"
  expect = "eg_er_her_i_viku"
  partner = "Gott. Hvað gerir þú?"
  partner_meaning = "Good. What do you do?"
  partner_meaning_ja = "いいですね。お仕事は？"

  [[dialogues.turns]]
  cue = "Say you're a programmer and you live in Tokyo."
  cue_ja = "プログラマーで、東京に住んでいると言ってください。"
  expect_text = "Ég er forritari. Ég bý í Tókýó."
  expect_meaning = "I'm a programmer. I live in Tokyo."
  expect_meaning_ja = "プログラマーです。東京に住んでいます。"
  partner = "Tókýó! Og hvað finnst þér um Ísland?"
  partner_meaning = "Tokyo! And what do you think of Iceland?"
  partner_meaning_ja = "東京！アイスランドはどうですか？"

  [[dialogues.turns]]
  cue = "Say you think Iceland is beautiful."
  cue_ja = "アイスランドは美しいと思うと言ってください。"
  expect = "mer_finnst_island_fallegt"
  partner = "Takk fyrir það!"
  partner_meaning = "Thanks for that!"
  partner_meaning_ja = "そう言ってもらえてうれしいです！"
