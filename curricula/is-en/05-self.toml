[[dialogues]]
id = "kynning"
setting = "At a friend's kitchen table you're introduced to Anna."
topics = ["social"]
requires = ["eg_heiti", "eg_er_fra_japan", "en_thu", "ja", "eg_er_i_frii", "takk"]

  [[dialogues.turns]]
  opener = "Hæ! Hvað heitir þú?"
  opener_meaning = "Hi! What's your name?"
  cue = "Say your name is Yuki."
  expect = "eg_heiti"
  partner = "Gaman að kynnast þér. Hvaðan ert þú?"
  partner_meaning = "Nice to meet you. Where are you from?"

  [[dialogues.turns]]
  cue = "Say you're from Japan, then ask: and you?"
  expect_text = "Ég er frá Japan. En þú?"
  expect_meaning = "I'm from Japan. And you?"
  partner = "Ég er frá Akureyri. Ertu í fríi?"
  partner_meaning = "I'm from Akureyri. Are you on holiday?"

  [[dialogues.turns]]
  cue = "Say yes, you're on holiday."
  expect_text = "Já, ég er í fríi."
  expect_meaning = "Yes, I'm on holiday."
  partner = "Velkomin til Íslands!"
  partner_meaning = "Welcome to Iceland!"

  [[dialogues.turns]]
  cue = "Thank her."
  expect = "takk"

[[dialogues]]
id = "leigubill"
setting = "In a taxi from the airport. The driver makes conversation."
topics = ["social", "transport"]
requires = ["eg_er_her_i_fyrsta_sinn", "eg_er_her_i_viku", "eg_er_job", "forritari", "mer_finnst_island_fallegt", "eg_by_i", "tokyo_dat"]

  [[dialogues.turns]]
  opener = "Hefurðu komið til Íslands áður?"
  opener_meaning = "Have you been to Iceland before?"
  cue = "Say you're here for the first time."
  expect = "eg_er_her_i_fyrsta_sinn"
  partner = "Og hvað ertu lengi?"
  partner_meaning = "And how long are you staying?"

  [[dialogues.turns]]
  cue = "Say you're here for a week."
  expect = "eg_er_her_i_viku"
  partner = "Fínt. Hvað gerir þú?"
  partner_meaning = "Nice. What do you do?"

  [[dialogues.turns]]
  cue = "Say you're a programmer and you live in Tokyo."
  expect_text = "Ég er forritari. Ég bý í Tókýó."
  expect_meaning = "I'm a programmer. I live in Tokyo."
  partner = "Tókýó! Og hvernig líst þér á Ísland?"
  partner_meaning = "Tokyo! And how do you like Iceland?"

  [[dialogues.turns]]
  cue = "Say you think Iceland is beautiful."
  expect = "mer_finnst_island_fallegt"
  partner = "Takk fyrir það!"
  partner_meaning = "Thanks for that!"
