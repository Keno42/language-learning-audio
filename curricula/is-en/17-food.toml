[[dialogues]]
id = "kvoldmatur"
setting = "Dinner at Anna's. She's made lamb soup."
setting_ja = "アンナの家で夕食。ラムのスープを作ってくれました。"
topics = ["food", "home"]
requires = ["hvad_er_i_thessu", "thetta_er_ljuffengt", "ma_eg_fa_meira", "takk_fyrir_matinn", "verdi_ther_ad_godu"]

  [[dialogues.turns]]
  opener = "Gjörðu svo vel, ég er með kjötsúpu!"
  opener_meaning = "Here you are, I have lamb soup!"
  opener_meaning_ja = "どうぞ、ラムのスープよ！"
  cue = "Ask what's in it."
  cue_ja = "何が入っているか聞いてください。"
  expect = "hvad_er_i_thessu"
  partner = "Lambakjöt, kartöflur og hrísgrjón."
  partner_meaning = "Lamb, potatoes and rice."
  partner_meaning_ja = "ラム肉と、じゃがいもと、ごはん。"

  [[dialogues.turns]]
  cue = "Taste it and say it's delicious."
  cue_ja = "味わって、とてもおいしいと言ってください。"
  expect = "thetta_er_ljuffengt"
  partner = "Takk! Viltu meira?"
  partner_meaning = "Thanks! Do you want more?"
  partner_meaning_ja = "ありがとう！おかわりはいかが？"

  [[dialogues.turns]]
  cue = "Ask if you may have more."
  cue_ja = "おかわりをもらえるか聞いてください。"
  expect = "ma_eg_fa_meira"
  partner = "Auðvitað."
  partner_meaning = "Of course."
  partner_meaning_ja = "もちろん。"

  [[dialogues.turns]]
  cue = "After the meal: thank her for the meal."
  cue_ja = "食事の後で、ごちそうさまと言ってください。"
  expect = "takk_fyrir_matinn"
  partner = "Verði þér að góðu."
  partner_meaning = "You're welcome (enjoy)."
  partner_meaning_ja = "どういたしまして。"
