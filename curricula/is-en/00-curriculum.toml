# Icelandic for English speakers — a three-month A1/A2 course in topic modules.
# The loader merges every *.toml in this directory in filename order.
#
# Conventions (see docs/CURRICULUM.md "Languages with cases"):
#   tags name the case a slot needs:  acc_*  nom_*  dat_*
