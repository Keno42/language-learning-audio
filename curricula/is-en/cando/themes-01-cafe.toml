  { who = "partner", say = "Já, gjörðu svo vel.", meaning = "Yes, go ahead.", meaning_ja = "ええ、どうぞ。", variants = [
      { say = "Já, það er laust.", meaning = "Yes, it's free.", meaning_ja = "ええ、空いていますよ。", word_glosses = { laust = { en = "free", ja = "空いています" } } },
      { say = "Já, sestu bara.", meaning = "Yes, just sit down.", meaning_ja = "ええ、どうぞ座ってください。", word_glosses = { sestu = { en = "sit down", ja = "座ってください", pointer = { en = "the action you were invited to do", ja = "相手がするように勧めたこと" } }, bara = { en = "just", ja = "ただ", pointer = { en = "the word alongside the invitation to sit down", ja = "座るよう勧めたときに添えたことば" } } } },
    ] },
  { who = "you", cue = "At the counter, ask for the menu.", cue_ja = "カウンターでメニューをもらってください。", aim = "ask for the menu", aim_ja = "メニューをもらう", say = "Get ég fengið matseðilinn?", items = ["get_eg_fengid", "matsedilinn"] },
  { who = "partner", say = "Já. Súpa dagsins er kjötsúpa.", meaning = "Sure. The soup of the day is lamb soup.", meaning_ja = "はい。本日のスープはラム肉のスープです。", word_glosses = { dagsins = { en = "of the day", ja = "今日の", pointer = { en = "the word describing which day the soup is for", ja = "スープがいつのものかを説明した部分" } }, "kjötsúpa" = { en = "lamb soup", ja = "ラム肉のスープ" } }, variants = [
      { say = "Auðvitað. Í dag er kjötsúpa.", meaning = "Of course. Today there's lamb soup.", meaning_ja = "もちろん。今日はラム肉のスープです。", word_glosses = { "auðvitað" = { en = "of course", ja = "もちろん" }, "kjötsúpa" = { en = "lamb soup", ja = "ラム肉のスープ" } } },
    ] },
  { who = "you", cue = "Order the soup.", cue_ja = "スープを注文してください。", aim = "order the soup", aim_ja = "スープを注文する", say = "Ég ætla að fá súpu.", items = ["eg_aetla_ad_fa", "supu"] },
  { who = "partner", say = "Eitthvað að drekka?", meaning = "Anything to drink?", meaning_ja = "お飲み物は？", variants = [
      { say = "Viltu eitthvað að drekka?", meaning = "Would you like something to drink?", meaning_ja = "何かお飲みになりますか？" },
      { say = "Hvað má bjóða þér að drekka?", meaning = "What can I get you to drink?", meaning_ja = "お飲み物は何にしますか？" },
    ] },
  { who = "you", cue = "Just water.", cue_ja = "水だけでいいです。", aim = "ask for just water", aim_ja = "水だけ頼む", say = "Vatn, takk.", items = ["vatn", "takk"] },
]

