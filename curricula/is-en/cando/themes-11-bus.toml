scene_line = "You get into a taxi outside the hotel."
scene_line_ja = "ホテルの前でタクシーに乗ります。"
turns = [
  { who = "partner", say = "Góðan daginn. Hvert ertu að fara?", meaning = "Good morning. Where are you going?", meaning_ja = "おはようございます。どちらまで？", variants = [
