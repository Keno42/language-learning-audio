  { who = "partner", say = "Ekkert mál.", meaning = "No problem.", meaning_ja = "わかりました。" },
  { who = "you", cue = "Ask how long it takes.", cue_ja = "どのくらい時間がかかるか聞いてください。", aim = "ask how long it takes", aim_ja = "かかる時間を聞く", say = "Hvað tekur þetta langan tíma?", items = ["hvad_tekur_thetta_langan_tima"] },
  { who = "partner", say = "Um fimmtán mínútur.", meaning = "About fifteen minutes.", meaning_ja = "15分くらいです。", word_glosses = { um = { en = "about", ja = "くらい" } }, probes = [{ kind = "duration", answer = "fimmtán mínútur", meanings = { en = "fifteen minutes", ja = "15分" } }], variants = [
