# Scenario cards (issue #129): one scripted beat of a can-do scenario (#131), for the
# Discord review. The learner reads the situation, hears the local's line (🔊) if there is
# one, answers aloud, then sees the model replies and the line with its meaning.
#
# `items` are what the first reply needs: a card is shown only once the learner has met
# all of them. A partner line may go beyond the course (clerk-side lines, #134); its
# meaning is revealed with the answer. Wordings are candidates; a native speaker's
# corrections are applied when they come. General content only: no learner's dates or places.

# ---------------------------------------------------------------- A1 greetings

[[scenes]]
id = "a1_enter"
scenario = "A1"
kind = "initiate"
situation = "You walk into a small shop in the morning. The clerk looks up."
situation_ja = "朝、小さなお店に入ります。店員と目が合いました。"
replies = ["Góðan daginn.", "Hæ."]
items = ["godan_daginn"]

[[scenes]]
id = "a1_leave"
scenario = "A1"
kind = "initiate"
situation = "You've paid and are leaving the shop."
situation_ja = "支払いが終わり、店を出るところです。"
replies = ["Takk, bless.", "Bless.", "Eigðu góðan dag."]
items = ["takk", "bless"]

[[scenes]]
id = "a1_evening"
scenario = "A1"
kind = "respond"
situation = "You come back to the hotel in the evening. The receptionist greets you."
situation_ja = "夜、ホテルに戻ると、受付の人に声をかけられました。"
partner = "Gott kvöld."
partner_meaning = "Good evening."
partner_meaning_ja = "こんばんは。"
replies = ["Gott kvöld."]
items = ["gott_kvold"]

[[scenes]]
id = "a1_same_to_you"
scenario = "A1"
kind = "respond"
situation = "As you leave, the clerk says this."
situation_ja = "店を出るとき、店員にこう言われました。"
partner = "Eigðu góðan dag!"
partner_meaning = "Have a good day!"
partner_meaning_ja = "良い一日を！"
replies = ["Takk, sömuleiðis.", "Sömuleiðis."]
items = ["takk", "somuleidis"]

[[scenes]]
id = "a1_holidays"
scenario = "A1"
kind = "respond"
situation = "It's late December. As you leave, the clerk says this."
situation_ja = "12月下旬。店を出るとき、店員にこう言われました。"
partner = "Gleðileg jól!"
partner_meaning = "Merry Christmas!"
partner_meaning_ja = "メリークリスマス！"
replies = ["Takk, sömuleiðis.", "Gleðileg jól!"]
items = ["gledileg_jol", "somuleidis"]
season = "winter-holidays"

