[[themes.levels]]
# #427 (lesson 40: «is it normal to ask someone's age straight away, or to say you're single and live alone?»; lesson 42, after #433's
# fix: «still odd to talk about marriage and age with another customer at a café, out of the blue»). Not a stranger in the lounge: a coffee
# with Anna, the friend made there (the scene the meet theme arranges). Her birthday opens the age, and her remark on your ring opens
# whether you're married, so each question has its reason and «En þú?» is asked only of the age. Her lines use words taught by the level's
# own items or before them (the owner, on «Maðurinn minn … hef verið … í tíu ár»: none of it taught by lesson 40)
goal = "Congratulate her and ask her age, say yours, and say you're married."
goal_ja = "お祝いを言って相手の年齢を聞き、自分の年齢と、結婚していることを伝える。"
partner_speaker = "native_a"
scene_line = "You're having coffee with Anna, whom you met at the guesthouse."
scene_line_ja = "ゲストハウスで知り合ったアンナと、カフェでお茶をしています。"
turns = [
  { who = "partner", say = "Ég á afmæli í dag!", meaning = "It's my birthday today!", meaning_ja = "今日は私の誕生日なんです！", word_glosses = { "afmæli" = { en = "birthday", ja = "誕生日" } } },
  { who = "you", cue = "Congratulate her, and ask her how old she is.", cue_ja = "お祝いを言って、何歳になったか聞いてください。", aim = "congratulate her and ask how old she is", aim_ja = "お祝いを言い、年齢を聞く", say = "Til hamingju! Hvað ertu gömul?", items = ["til_hamingju", "hvad_ertu_gomul"] },
  { who = "partner", say = "Takk! Ég er þrjátíu ára. En þú?", meaning = "Thanks! I'm thirty. And you?", meaning_ja = "ありがとう！30歳です。あなたは？", variants = [
      { say = "Takk! Þrjátíu ára í dag. En þú?", meaning = "Thanks! Thirty today. And you?", meaning_ja = "ありがとう！今日で30歳。あなたは？" },
      { say = "Takk! Ég er tuttugu og sex ára. En þú?", meaning = "Thanks! I'm twenty-six. And you?", meaning_ja = "ありがとう！26歳です。あなたは？" },
      { say = "Takk! Ég er fjörutíu ára. En þú?", meaning = "Thanks! I'm forty. And you?", meaning_ja = "ありがとう！40歳です。あなたは？" },
    ] },
  { who = "you", cue = "Say you're twenty.", cue_ja = "20歳だと言ってください。", aim = "say your age", aim_ja = "自分の年齢を言う", say = "Ég er tuttugu ára.", items = ["eg_er_ara", "tuttugu_ara"] },
  { who = "partner", say = "Þú ert með hring!", meaning = "You're wearing a ring!", meaning_ja = "指輪をしているんですね！", word_glosses = { "hring" = { en = "ring", ja = "指輪" } } },
  { who = "you", cue = "Thank her, and say you're married.", cue_ja = "お礼を言って、結婚していると言ってください。", aim = "say you're married", aim_ja = "結婚していると言う", say = "Takk! Ég er gift.", say_m = "Takk! Ég er giftur.", items = ["takk", "eg_er_gift"] },
  { who = "partner", say = "Gaman að heyra það! Skál!", meaning = "Nice to hear that! Cheers!", meaning_ja = "それはいいですね！乾杯！" },
  { who = "you", cue = "Say cheers.", cue_ja = "乾杯と言ってください。", aim = "say cheers", aim_ja = "乾杯と言う", say = "Skál!", items = ["skal"] },
]
[[themes.levels]]
# #327 batch: where you live, your work, children, a place visited before (lessons 41–46 of the lesson-40 replay). A coach ride's seat
# neighbour, after the view: the questions come once the talk has started (#427, lesson 40: age and marital status asked straight away).
# Its own scene line: the theme's «Someone sits down next to you and says hello.» names no coach and no view for «Fallegt» (lesson 42).
goal = "On a long coach ride, tell your neighbour you've been here before, where you live, what you do, and about your children."
goal_ja = "長いバス旅行で、隣の人に前にも来たこと、住んでいる所、仕事、子どものことを話す。"
partner_speaker = "native_a"
scene_line = "On a long coach ride, the woman next to you is looking out at the view."
scene_line_ja = "長距離バスで、隣の女性が窓の外の景色を眺めています。"
turns = [
  { who = "partner", say = "Fallegt, er það ekki? Hefurðu komið hingað áður?", meaning = "Beautiful, isn't it? Have you been here before?", meaning_ja = "きれいですね。前にも来たことがありますか？" },
  { who = "you", cue = "Say yes, you've been here before.", cue_ja = "はい、前にも来たことがあると言ってください。", aim = "say you've been here before", aim_ja = "前にも来たことがあると言う", say = "Já, ég hef verið hér áður.", items = ["ja", "eg_hef_verid_her_adur"] },
  { who = "partner", say = "Nú já! Gaman að heyra.", meaning = "Oh! Nice to hear.", meaning_ja = "そうなんですね！" },
  { who = "you", cue = "Ask her where she lives.", cue_ja = "どこに住んでいるか聞いてください。", aim = "ask where she lives", aim_ja = "どこに住んでいるか聞く", say = "Hvar býrð þú?", items = ["hvar_byrd_thu"] },
  { who = "partner", say = "Á Selfossi. En þú?", meaning = "In Selfoss. And you?", meaning_ja = "セルフォスです。あなたは？" },
  { who = "you", cue = "Say you live in Osaka.", cue_ja = "大阪に住んでいると言ってください。", aim = "say you live in Osaka", aim_ja = "大阪に住んでいると言う", say = "Ég bý í Ósaka.", items = ["eg_by_i", "osaka_dat"] },
  { who = "partner", say = "Og hvað gerir þú?", meaning = "And what do you do?", meaning_ja = "お仕事は何ですか？", variants = [{ say = "Og við hvað vinnur þú?", meaning = "And what do you work as?", meaning_ja = "お仕事は何をしていますか？" }] },
  { who = "you", cue = "Say you're a doctor.", cue_ja = "医者だと言ってください。", aim = "say you're a doctor", aim_ja = "医者だと言う", say = "Ég er læknir.", items = ["eg_er_job", "laeknir"] },
  { who = "partner", say = "Áttu börn?", meaning = "Do you have children?", meaning_ja = "お子さんはいますか？" },
  { who = "you", cue = "Say yes, you have two children.", cue_ja = "はい、子どもが二人いると言ってください。", aim = "say you have two children", aim_ja = "子どもが二人いると言う", say = "Já, ég á tvö börn.", items = ["ja", "eg_a_tvo_born"] },
  { who = "partner", say = "Ég líka!", meaning = "Me too!", meaning_ja = "私もです！" },
]
