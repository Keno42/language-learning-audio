  { who = "partner", say = "Hvar býrð þú?", meaning = "Where do you live?", meaning_ja = "どこに住んでいるんですか？" },
  { who = "you", cue = "Say you live in Tokyo, and ask her back.", cue_ja = "東京に住んでいると言い、聞き返してください。", aim = "say you live in Tokyo and ask her back", aim_ja = "東京に住んでいると言い、聞き返す", say = "Ég bý í Tókýó. En þú?", items = ["eg_by_i", "tokyo_dat", "en_thu"] },
