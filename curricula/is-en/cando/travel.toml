# Travel can-do scenarios (issue #131). The outcome the course aims at for a short trip:
# read signs and place names with enjoyment; greet, shop, order and pay; handle simple
# conversation; show respect for the people and the culture.
#
# Generic by design. A learner's own dates, itinerary and weights never go here: they live
# in a private profile next to the learner file (issue #132).
#
# `items` are curriculum ids the scenario needs (validated); `missing` is what the
# curriculum still lacks for it. `reading` feeds the reading track (#133), `clerk_lines`
# the listening track (#134); both are candidates until the native tutor checks them.
# Default tiers suit a budget traveller: supermarket and café before restaurant.

# ---------------------------------------------------------------- Tier A: must, by T−7 weeks

[[scenarios]]
id = "A1"
tier = "A"
title = "Greet and take leave, incl. holiday-season greetings"
title_ja = "挨拶と別れ（季節の挨拶を含む）"
setting = "Walking into and out of any shop, café, pool or tour bus."
success = "Greets by time of day and leaves with a farewell, unprompted; returns a seasonal greeting."
items = ["godan_daginn", "gott_kvold", "goda_nott", "hae", "hallo", "bless", "sjaumst", "eigdu_godan_dag", "eigdu_godur", "somuleidis"]
missing = ["holiday-season greetings: «Gleðileg jól», «Gleðilega hátíð», «Gleðilegt nýtt ár (og takk fyrir það liðna)» (#135)"]
respect = ["greet", "farewell"]

