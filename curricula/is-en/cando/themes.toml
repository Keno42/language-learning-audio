  { who = "partner", say = "Viltu kvittun?", meaning = "Would you like the receipt?", meaning_ja = "レシートはいりますか？", variants = [{ say = "Viltu fá kvittun?", meaning = "Do you want a receipt?", meaning_ja = "レシートが欲しいですか？", word_glosses = { "viltu" = { en = "do you want", ja = "ほしいですか" }, "kvittun" = { en = "a receipt", ja = "レシート" } } }, { say = "Þarftu kvittun?", meaning = "Do you need a receipt?", meaning_ja = "レシートは必要ですか？", word_glosses = { "þarftu" = { en = "do you need", ja = "必要ですか" }, "kvittun" = { en = "a receipt", ja = "レシート" } } }] },
  { who = "you", cue = "No need.", cue_ja = "いりません。", say = "Nei, takk.", items = ["nei", "takk"] },
]

