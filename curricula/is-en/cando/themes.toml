[[themes.levels]]
goal = "Check in a bag and find the gate."
goal_ja = "荷物を預けて搭乗口を見つける。"
turns = [
  { who = "partner", say = "Góðan daginn. Vegabréfið, takk.", meaning = "Good morning. Your passport, please.", meaning_ja = "おはようございます。パスポートをお願いします。" },
  { who = "you", cue = "Hand it over.", cue_ja = "渡してください。", say = "Gjörðu svo vel.", items = ["gjordu_svo_vel"] },
  { who = "partner", say = "Ertu með farangur?", meaning = "Do you have luggage?", meaning_ja = "預ける荷物はありますか？" },
  { who = "you", cue = "One suitcase.", cue_ja = "スーツケースが一つです。", say = "Ég er með eina tösku.", items = ["eg_er_med_eina_tosku"] },
  { who = "partner", say = "Hliðið er númer tólf.", meaning = "The gate is number twelve.", meaning_ja = "搭乗口は12番です。" },
  { who = "you", cue = "Later you can't find it. Ask where the gate is.", cue_ja = "あとで搭乗口が見つかりません。どこか聞いてください。", say = "Hvar er hliðið?", items = ["hvar_er_hlidid"] },
]
listen = [
