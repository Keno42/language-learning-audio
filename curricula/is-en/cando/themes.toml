  { who = "partner", say = "Þrjú þúsund og fimm hundruð.", meaning = "Three thousand five hundred.", meaning_ja = "3500です。" },
  { who = "partner", say = "Viltu kvittun?", meaning = "Would you like the receipt?", meaning_ja = "レシートはいりますか？" },
  { who = "you", cue = "No need.", cue_ja = "いりません。", say = "Nei, takk.", items = ["nei", "takk"] },
]
read = ["Ávextir og grænmeti", "Best fyrir", "Poki"]

