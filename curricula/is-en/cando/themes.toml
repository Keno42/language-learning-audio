  { who = "partner", say = "Já, ég kem strax.", meaning = "Yes, I'll be right there.", meaning_ja = "はい、すぐ伺います。", variants = [{ say = "Já, augnablik.", meaning = "Yes, one moment.", meaning_ja = "はい、少々お待ちください。", word_glosses = { "augnablik" = { en = "a moment", ja = "少しの間", pointer = { en = "the word used when asking you to wait", ja = "待つように言った部分" } } } }, { say = "Já, ég kem með reikninginn.", meaning = "Yes, I'll bring the bill.", meaning_ja = "はい、お会計をお持ちします。", word_glosses = { "kem" = { en = "I come", ja = "来ます", pointer = { en = "the word for what the speaker will do with the bill", ja = "お会計をどうすると言ったかを表す部分" } }, "reikninginn" = { en = "the bill", ja = "お会計" } } }], listen = [{ say = "Kaffið kostar fimm hundruð krónur og samlokan kostar þúsund krónur.", meaning = "The coffee costs five hundred krónur and the sandwich costs a thousand krónur.", meaning_ja = "コーヒーは500クローナ、サンドイッチは1000クローナです。", probes = [{ kind = "price", answer = "fimm hundruð krónur", meanings = { en = "five hundred krónur", ja = "500クローナ" }, ask = { en = "How much is the coffee?", ja = "コーヒーはいくらですか？" } }, { kind = "price", answer = "þúsund krónur", meanings = { en = "a thousand krónur", ja = "1000クローナ" }, ask = { en = "How much is the sandwich?", ja = "サンドイッチはいくらですか？" } }] }] },
  { who = "you", cue = "Tell her it was good.", cue_ja = "おいしかったと伝えてください。", say = "Þetta var gott.", items = ["thetta_var_gott"], alts = ["Þetta var ljúffengt."] },
  { who = "partner", say = "Takk fyrir það!", meaning = "Thank you!", meaning_ja = "ありがとうございます！", variants = [{ say = "Gaman að heyra!", meaning = "Nice to hear!", meaning_ja = "それはよかったです！", word_glosses = { "gaman" = { en = "nice", ja = "うれしい", pointer = { en = "the word expressing the reaction to what you said", ja = "あなたの話への反応を表す部分" } }, "heyra" = { en = "to hear", ja = "聞く", pointer = { en = "the last word in the reaction to what you said", ja = "あなたの話への返事の最後の部分" } } } }, { say = "Takk fyrir komuna!", meaning = "Thanks for coming!", meaning_ja = "ご来店ありがとうございました！", word_glosses = { "komuna" = { en = "the visit", ja = "ご来店", pointer = { en = "the word for what the speaker thanked you for", ja = "何についてお礼を言ったかを表す部分" } } } }] },
]

