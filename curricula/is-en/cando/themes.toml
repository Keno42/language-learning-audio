[[themes]]
# #327: the town and asking the way. From lesson 30 on, its lines («Hvar er bankinn?», «Er það langt?», «Ég er að leita að bankanum.»)
# are the largest supply of new material, and before this theme they came in lessons that replayed the museum's ticket desk.
id = "town"
scenario = "A8"
title = "Asking the way"
title_ja = "道を尋ねる"
setting = "A street in town: ask a passer-by the way."
setting_ja = "街の通り。通りがかりの人に道を尋ねる。"
scene_line = "You're in town."
scene_line_ja = "街にいます。"
topics = ["directions"]
[[themes.levels]]
goal = "Ask where a place is, and understand the way."
goal_ja = "場所を尋ねて、道順を聞き取る。"
turns = [
  { who = "you", cue = "Stop someone in the street and ask where the bank is.", cue_ja = "通りで人を呼び止めて、銀行がどこか聞いてください。", say = "Afsakið, hvar er bankinn?", items = ["afsakid", "hvar_er", "bankinn"] },
  { who = "partner", say = "Hann er þarna, til vinstri.", meaning = "It's over there, on the left.", meaning_ja = "あそこ、左側です。", variants = [{ say = "Beint áfram og svo til vinstri.", meaning = "Straight ahead, and then left.", meaning_ja = "まっすぐ行って、それから左です。" }, { say = "Hann er til hægri, við kirkjuna.", meaning = "It's on the right, by the church.", meaning_ja = "右側、教会のそばです。" }] },
  { who = "you", cue = "Ask if it's far.", cue_ja = "遠いか聞いてください。", say = "Er það langt?", items = ["er_thad_langt"] },
  { who = "partner", say = "Nei, það er nálægt. Bara fimm mínútur.", meaning = "No, it's close. Just five minutes.", meaning_ja = "いいえ、近いですよ。5分だけです。", probes = [{ kind = "duration", answer = "fimm mínútur", meanings = { en = "five minutes", ja = "5分" } }], variants = [{ say = "Nei, það tekur bara fimm mínútur að ganga.", meaning = "No, it's only a five-minute walk.", meaning_ja = "いいえ、歩いて5分だけです。", probes = [{ kind = "duration", answer = "fimm mínútur", meanings = { en = "five minutes", ja = "5分" } }] }], listen = [{ say = "Nei, það er nálægt. Bara sjö mínútur.", meaning = "No, it's close. Only seven minutes.", meaning_ja = "いいえ、近いですよ。たった7分です。", probes = [{ kind = "duration", answer = "sjö mínútur", meanings = { en = "seven minutes", ja = "7分" } }] }, { say = "Nei, það tekur bara átta mínútur að ganga.", meaning = "No, it only takes eight minutes to walk.", meaning_ja = "いいえ、歩いてたった8分です。", probes = [{ kind = "duration", answer = "átta mínútur", meanings = { en = "eight minutes", ja = "8分" } }] }, { say = "Nei, bara sex mínútur.", meaning = "No, only six minutes.", meaning_ja = "いいえ、たった6分です。", probes = [{ kind = "duration", answer = "sex mínútur", meanings = { en = "six minutes", ja = "6分" } }] }] },
  { who = "you", cue = "Thank them warmly.", cue_ja = "心をこめてお礼を言ってください。", say = "Takk kærlega.", items = ["takk_kaerlega"] },
  { who = "partner", say = "Ekkert að þakka.", meaning = "You're welcome.", meaning_ja = "どういたしまして。", variants = [{ say = "Ekkert mál.", meaning = "No problem.", meaning_ja = "いえいえ。" }] },
]
