topics = ["travel", "nature"]
[[themes.levels]]
partner_speaker = "native_a"  # the partner is a woman
goal = "Greet the guide and find out when the coach leaves."
goal_ja = "ガイドにあいさつし、バスの出発時刻を確かめる。"
turns = [
  { who = "partner", say = "Góðan daginn öll! Ég heiti Anna og ég er leiðsögumaðurinn ykkar í dag.", meaning = "Good morning, everyone! I'm Anna, and I'm your guide today.", meaning_ja = "皆さんおはようございます！今日のガイドのアンナです。" },
  { who = "you", cue = "Greet her back.", cue_ja = "あいさつを返してください。", say = "Góðan daginn.", items = ["godan_daginn"] },
  { who = "partner", say = "Við stoppum hérna í tuttugu mínútur.", meaning = "We'll stop here for twenty minutes.", meaning_ja = "ここで20分休憩します。", probes = [{ kind = "duration", answer = "tuttugu mínútur", meanings = { en = "twenty minutes", ja = "20分" } }], variants = [{ say = "Við verðum hérna í tuttugu mínútur.", meaning = "We'll be here for twenty minutes.", meaning_ja = "ここに20分います。", probes = [{ kind = "duration", answer = "tuttugu mínútur", meanings = { en = "twenty minutes", ja = "20分" } }] }, { say = "Hér stoppum við í tuttugu mínútur.", meaning = "Here we stop for twenty minutes.", meaning_ja = "ここで20分止まります。", probes = [{ kind = "duration", answer = "tuttugu mínútur", meanings = { en = "twenty minutes", ja = "20分" } }] }], listen = [{ say = "Við stoppum hérna í tuttugu mínútur og förum svo klukkan hálf þrjú.", meaning = "We'll stop here for twenty minutes, and then we leave at half past two.", meaning_ja = "ここで20分休憩して、2時半に出発します。", probes = [{ kind = "duration", answer = "tuttugu mínútur", meanings = { en = "twenty minutes", ja = "20分" }, ask = { en = "How long do we stop?", ja = "何分休憩しますか？" } }, { kind = "time", answer = "klukkan hálf þrjú", meanings = { en = "half past two", ja = "2時半" }, ask = { en = "When do we leave?", ja = "何時に出発しますか？" } }] }] },
  { who = "you", cue = "Ask when you're leaving.", cue_ja = "いつ出発するか聞いてください。", say = "Hvenær leggjum við af stað?", items = ["hvenaer_leggjum_vid_af_stad"] },
  { who = "partner", say = "Klukkan hálf þrjú.", meaning = "At half past two.", meaning_ja = "2時半です。", probes = [{ kind = "time", answer = "klukkan hálf þrjú", meanings = { en = "half past two", ja = "2時半" } }], variants = [{ say = "Við förum klukkan hálf þrjú.", meaning = "We leave at half past two.", meaning_ja = "2時半に出発します。", probes = [{ kind = "time", answer = "klukkan hálf þrjú", meanings = { en = "half past two", ja = "2時半" } }] }, { say = "Rútan fer klukkan hálf þrjú.", meaning = "The coach leaves at half past two.", meaning_ja = "バスは2時半に出ます。", probes = [{ kind = "time", answer = "klukkan hálf þrjú", meanings = { en = "half past two", ja = "2時半" } }] }] },
  { who = "you", cue = "Thank her.", cue_ja = "お礼を言ってください。", say = "Takk.", items = ["takk"] },
]
