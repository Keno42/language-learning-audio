goal_ja = "チケットを買ってカードで払う。"
turns = [
  { who = "you", cue = "At the museum desk, greet and ask for one adult ticket.", cue_ja = "博物館の窓口であいさつし、大人1枚と頼んでください。", say = "Góðan daginn. Einn fullorðinn, takk.", items = ["godan_daginn", "einn_fullordinn_takk"] },
  { who = "partner", say = "Það eru tvö þúsund og fimm hundruð krónur.", meaning = "That's two thousand five hundred krónur.", meaning_ja = "2500クローナです。", probes = [{ kind = "price", answer = "tvö þúsund og fimm hundruð krónur", meanings = { en = "two thousand five hundred krónur", ja = "2500クローナ" } }], variants = [{ say = "Það gera tvö þúsund og fimm hundruð krónur.", meaning = "That's two thousand five hundred krónur.", meaning_ja = "2500クローナです。", probes = [{ kind = "price", answer = "tvö þúsund og fimm hundruð krónur", meanings = { en = "two thousand five hundred krónur", ja = "2500クローナ" } }] }, { say = "Tvö þúsund og fimm hundruð, takk.", meaning = "Two thousand five hundred, please.", meaning_ja = "2500お願いします。", probes = [{ kind = "price", answer = "tvö þúsund og fimm hundruð", meanings = { en = "two thousand five hundred", ja = "2500" } }] }], listen = [{ say = "Safnið opnar klukkan tíu og lokar klukkan fimm.", meaning = "The museum opens at ten and closes at five.", meaning_ja = "博物館は10時に開き、5時に閉まります。", probes = [{ kind = "time", answer = "klukkan tíu", meanings = { en = "ten o'clock", ja = "10時" }, ask = { en = "When does the museum open?", ja = "博物館は何時に開きますか？" } }, { kind = "time", answer = "klukkan fimm", meanings = { en = "five o'clock", ja = "5時" }, ask = { en = "When does it close?", ja = "何時に閉まりますか？" } }] }] },
  { who = "you", cue = "Ask if you can pay by card.", cue_ja = "カードで払えるか聞いてください。", say = "Má ég borga með korti?", items = ["ma_eg_borga_med_korti"] },
  { who = "partner", say = "Já, auðvitað.", meaning = "Yes, of course.", meaning_ja = "はい、もちろん。", variants = [{ say = "Já, það er í lagi.", meaning = "Yes, that's fine.", meaning_ja = "はい、大丈夫ですよ。" }, { say = "Já, að sjálfsögðu.", meaning = "Yes, of course.", meaning_ja = "はい、もちろんです。" }] },
]

[[themes]]
id = "tour"
scenario = "B2"
title = "Day tour with a guide"
title_ja = "ガイド付きの日帰りツアー"
