ich costs eight hundred krónur.", meaning_ja = "コーヒーは400クローナ、サンドイッチは800クローナです。", probes = [{ kind = "price", answer = "fjögur hundruð krónur", meanings = { en = "four hundred krónur", ja = "400クローナ" }, ask = { en = "How much is the coffee?", ja = "コーヒーはいくらですか？" } }, { kind = "price", answer = "átta hundruð krónur", meanings = { en = "eight hundred krónur", ja = "800クローナ" }, ask = { en = "How much is the sandwich?", ja = "サンドイッチはいくらですか？" } }] }] },
