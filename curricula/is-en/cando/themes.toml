[[themes]]
# #327 batch: arranging to meet. On the replay of the lesson-40 export, from lesson 41 the day's new material is making arrangements
# («Ég fer {time}.», «Ég kem {time}.», «Sjáumst {time}!», «Hentar það?», «Það hentar vel.», «Ég er sein.», «Ég kem eftir tíu mínútur.»,
# «Ég get ekki á morgun.») and no level says it. The same scenario as small talk (B3): the friend made there.
id = "meet"
scenario = "B3"
title = "Arranging to meet"
title_ja = "待ち合わせの約束"
setting = "Anna, met at the guesthouse, wants to meet again."
setting_ja = "ゲストハウスで知り合ったアンナが、また会おうと言っています。"
scene_line = "Anna, whom you met at the guesthouse, wants to meet again."
scene_line_ja = "ゲストハウスで知り合ったアンナが、また会いたいと言っています。"
topics = ["arrangements"]
[[themes.levels]]
goal = "Say when you're leaving, ask what time, and say the time suits you."
goal_ja = "出発する日を伝え、時間を聞いて、その時間で大丈夫と言う。"
partner_speaker = "native_a"
turns = [
  { who = "partner", say = "Eigum við að hittast á morgun?", meaning = "Shall we meet tomorrow?", meaning_ja = "明日会いませんか？", word_glosses = { "hittast" = { en = "meet", ja = "会い" } } },
  { who = "you", cue = "Say you're leaving tomorrow.", cue_ja = "明日は出発すると言ってください。", say = "Ég fer á morgun.", items = ["eg_fer", "a_morgun"] },
  { who = "partner", say = "Nú, en í kvöld?", meaning = "Oh, how about this evening?", meaning_ja = "そうですか、じゃあ今夜は？", variants = [{ say = "Æ, en í kvöld þá?", meaning = "Oh, this evening then?", meaning_ja = "ああ、じゃあ今夜は？" }] },
  { who = "you", cue = "Ask at what time.", cue_ja = "何時か聞いてください。", say = "Klukkan hvað?", items = ["klukkan_hvad"] },
  { who = "partner", say = "Klukkan átta, á kaffihúsinu. Hentar það?", meaning = "At eight, at the café. Does that suit you?", meaning_ja = "8時に、カフェで。都合はどうですか？", probes = [{ kind = "time", answer = "klukkan átta", meanings = { en = "eight o'clock", ja = "8時" }, ask = { en = "When do you meet?", ja = "何時に会いますか？" } }], listen = [{ say = "Klukkan sjö, á kaffihúsinu. Hentar það?", meaning = "At seven, at the café. Does that suit you?", meaning_ja = "7時に、カフェで。都合はどうですか？", probes = [{ kind = "time", answer = "klukkan sjö", meanings = { en = "seven o'clock", ja = "7時" }, ask = { en = "When do you meet?", ja = "何時に会いますか？" } }] }, { say = "Klukkan níu, á kaffihúsinu. Hentar það?", meaning = "At nine, at the café. Does that suit you?", meaning_ja = "9時に、カフェで。都合はどうですか？", probes = [{ kind = "time", answer = "klukkan níu", meanings = { en = "nine o'clock", ja = "9時" }, ask = { en = "When do you meet?", ja = "何時に会いますか？" } }] }, { say = "Klukkan sex, á kaffihúsinu. Hentar það?", meaning = "At six, at the café. Does that suit you?", meaning_ja = "6時に、カフェで。都合はどうですか？", probes = [{ kind = "time", answer = "klukkan sex", meanings = { en = "six o'clock", ja = "6時" }, ask = { en = "When do you meet?", ja = "何時に会いますか？" } }] }] },
  { who = "you", cue = "Say that suits you well.", cue_ja = "それで大丈夫だと言ってください。", say = "Það hentar vel.", items = ["thad_hentar_vel"] },
  { who = "partner", say = "Frábært! Sjáumst í kvöld.", meaning = "Great! See you this evening.", meaning_ja = "よかった！じゃあ今夜。" },
]
