# Lesson themes (issue #149, step 1b-ii): a scene of a trip as a short exchange, at rising levels.
# See audiolesson/themes.py. A lesson consolidates one theme: its exchange is played twice, once
# early with the partner's lines translated and once late with only the partner's line as the cue.
# Level 1 is the shortest exchange that works; later levels raise its resolution.
#
# Partner lines may go beyond the course: getting the gist of 80-90% of what is said is the
# point. The learner's own lines (`who = "you"`) list the items they need. Wordings are candidates;
# a native speaker's corrections are applied when they come.
# General content only: no learner's dates, itinerary or lodging (the private trip profile
# decides which theme comes first).

[[themes]]
id = "cafe"
scenario = "A4"
title = "Café"
title_ja = "カフェ"
setting = "A busy café: order at the counter, find a seat, ask for the bill."
setting_ja = "混んだカフェ。カウンターで注文し、席を見つけ、会計する。"
scene_line = "You're at a busy café."
scene_line_ja = "混んだカフェにいます。"
topics = ["cafe"]

[[themes.levels]]
goal = "Order a coffee and answer the milk question."
goal_ja = "コーヒーを注文し、ミルクがいるかに答える。"
turns = [
  { who = "partner", say = "Hæ! Hvað má bjóða þér?", meaning = "Hi! What can I get you?", meaning_ja = "こんにちは！何にしますか？", variants = [{ say = "Góðan daginn! Hvað má bjóða þér?", meaning = "Good morning! What can I get you?", meaning_ja = "おはようございます！何にしますか？" }, { say = "Hæ! Hvað viltu fá?", meaning = "Hi! What would you like?", meaning_ja = "こんにちは！何にしますか？" }] },
  { who = "you", cue = "Order a coffee.", cue_ja = "コーヒーを注文してください。", say = "Ég ætla að fá kaffi.", items = ["eg_aetla_ad_fa", "kaffi"], alts = ["Kaffi, takk."] },
  { who = "partner", say = "Með mjólk?", meaning = "With milk?", meaning_ja = "ミルクは入れますか？", variants = [{ say = "Viltu mjólk út í?", meaning = "Do you want milk in it?", meaning_ja = "ミルクを入れますか？" }] },
  { who = "you", cue = "Yes, please.", cue_ja = "はい、お願いします。", say = "Já, takk.", items = ["ja", "takk"] },
  { who = "partner", say = "Gjörðu svo vel.", meaning = "Here you go.", meaning_ja = "どうぞ。" },
  { who = "you", cue = "Thank him.", cue_ja = "お礼を言ってください。", say = "Takk.", items = ["takk"] },
]

[[themes.levels]]
goal = "Find a free seat, ask for the menu, order the soup and a drink."
goal_ja = "空いた席を見つけ、メニューをもらい、スープと飲み物を頼む。"
turns = [
  { who = "you", cue = "The café is crowded. Ask a stranger if the seat next to them is free.", cue_ja = "カフェが混んでいます。隣の席が空いているか、知らない人に聞いてください。", say = "Er þetta sæti laust?", items = ["er_thetta_saeti_laust"] },
  { who = "partner", say = "Já, gjörðu svo vel.", meaning = "Yes, go ahead.", meaning_ja = "ええ、どうぞ。", variants = [{ say = "Já, það er laust.", meaning = "Yes, it's free.", meaning_ja = "ええ、空いていますよ。", word_glosses = { "laust" = { en = "free", ja = "空いています" } } }, { say = "Já, sestu bara.", meaning = "Yes, just sit down.", meaning_ja = "ええ、どうぞ座ってください。", word_glosses = { "sestu" = { en = "sit down", ja = "座ってください", pointer = { en = "the action you were invited to do", ja = "相手がするように勧めたこと" } }, "bara" = { en = "just", ja = "ただ", pointer = { en = "the word alongside the invitation to sit down", ja = "座るよう勧めたときに添えたことば" } } } }] },
  { who = "you", cue = "At the counter, ask for the menu.", cue_ja = "カウンターでメニューをもらってください。", say = "Get ég fengið matseðilinn?", items = ["get_eg_fengid", "matsedilinn"] },
  { who = "partner", say = "Já. Súpa dagsins er kjötsúpa.", meaning = "Sure. The soup of the day is lamb soup.", meaning_ja = "はい。本日のスープはラム肉のスープです。", word_glosses = { "dagsins" = { en = "of the day", ja = "今日の", pointer = { en = "the word describing which day the soup is for", ja = "スープがいつのものかを説明した部分" } }, "kjötsúpa" = { en = "lamb soup", ja = "ラム肉のスープ" } }, variants = [{ say = "Auðvitað. Í dag er kjötsúpa.", meaning = "Of course. Today there's lamb soup.", meaning_ja = "もちろん。今日はラム肉のスープです。", word_glosses = { "auðvitað" = { en = "of course", ja = "もちろん" }, "kjötsúpa" = { en = "lamb soup", ja = "ラム肉のスープ" } } }] },
  { who = "you", cue = "Order the soup.", cue_ja = "スープを注文してください。", say = "Ég ætla að fá súpu.", items = ["eg_aetla_ad_fa", "supu"] },
  { who = "partner", say = "Eitthvað að drekka?", meaning = "Anything to drink?", meaning_ja = "お飲み物は？", variants = [{ say = "Viltu eitthvað að drekka?", meaning = "Would you like something to drink?", meaning_ja = "何かお飲みになりますか？" }, { say = "Hvað má bjóða þér að drekka?", meaning = "What can I get you to drink?", meaning_ja = "お飲み物は何にしますか？" }] },
  { who = "you", cue = "Just water.", cue_ja = "水だけでいいです。", say = "Vatn, takk.", items = ["vatn", "takk"] },
]

