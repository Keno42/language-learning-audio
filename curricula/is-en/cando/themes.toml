[[themes.levels]]
goal = "Say the weather is good today, ask about tomorrow, and say you need an umbrella."
goal_ja = "今日はいい天気だと言い、明日の天気を聞いて、傘が要ると言う。"
partner_speaker = "native_b"
turns = [
  { who = "partner", say = "Góðan daginn! Ætlarðu út í dag?", meaning = "Good morning! Are you going out today?", meaning_ja = "おはようございます！今日はお出かけですか？" },
  { who = "you", cue = "Say yes: the weather is good today.", cue_ja = "はい、今日はいい天気ですねと言ってください。", say = "Já, veðrið er gott í dag.", items = ["ja", "vedrid_er_gott_i_dag"] },
  { who = "partner", say = "Já, en það breytist fljótt hér.", meaning = "Yes, but it changes fast here.", meaning_ja = "ええ、でもここではすぐ変わりますよ。", variants = [{ say = "Já, en það breytist fljótt á Íslandi.", meaning = "Yes, but it changes fast in Iceland.", meaning_ja = "ええ、でもアイスランドではすぐ変わりますよ。" }] },
  { who = "you", cue = "Ask what the weather will be like tomorrow.", cue_ja = "明日の天気はどうか聞いてください。", say = "Hvernig verður veðrið á morgun?", items = ["hvernig_verdur_vedrid_a_morgun"] },
  { who = "partner", say = "Það á að rigna allan daginn.", meaning = "It's supposed to rain all day.", meaning_ja = "一日中雨の予報です。" },
  { who = "you", cue = "Say you need an umbrella.", cue_ja = "傘が要ると言ってください。", say = "Ég þarf regnhlíf.", items = ["eg_tharf", "regnhlif"] },
