turns = [
  { who = "you", cue = "You can't find skyr. Ask a member of staff if they have it.", cue_ja = "スキールが見つかりません。店員にあるか聞いてください。", say = "Afsakið, áttu skyr?", items = ["afsakid", "attu", "skyr"] },
  { who = "partner", say = "Já, það er þarna, í kælinum.", meaning = "Yes, it's over there, in the fridge.", meaning_ja = "はい、あちらの冷蔵棚です。", word_glosses = { "kælinum" = { en = "the fridge", ja = "冷蔵庫" } }, variants = [{ say = "Já, það er í kælinum þarna.", meaning = "Yes, it's in the fridge over there.", meaning_ja = "はい、あそこの冷蔵棚にあります。", word_glosses = { "kælinum" = { en = "the fridge", ja = "冷蔵庫" } } }, { say = "Já, skyrið er hjá mjólkinni.", meaning = "Yes, the skyr is next to the milk.", meaning_ja = "はい、スキールは牛乳の隣です。", word_glosses = { "hjá" = { en = "next to", ja = "そばに" }, "mjólkinni" = { en = "the milk", ja = "牛乳" } } }] },
  { who = "you", cue = "Thank him.", cue_ja = "お礼を言ってください。", say = "Takk.", items = ["takk"] },
  { who = "partner", scene = "At the till.", scene_ja = "レジです。", say = "Viltu poka?", meaning = "Would you like a bag?", meaning_ja = "袋はいりますか？", variants = [{ say = "Þarftu poka?", meaning = "Do you need a bag?", meaning_ja = "袋は必要ですか？", word_glosses = { "þarftu" = { en = "do you need", ja = "必要ですか" }, "poka" = { en = "a bag", ja = "袋" } } }, { say = "Viltu poka með því?", meaning = "Would you like a bag with that?", meaning_ja = "袋をおつけしますか？", word_glosses = { "viltu" = { en = "do you want", ja = "ほしいですか" }, "poka" = { en = "a bag", ja = "袋" } } }] },
  { who = "you", cue = "Yes, you need one.", cue_ja = "はい、いります。", say = "Já, takk.", items = ["ja", "takk"] },
  { who = "partner", say = "Það gera tvö þúsund krónur.", meaning = "That's two thousand krónur.", meaning_ja = "2000クローナです。", probes = [{ kind = "price", answer = "tvö þúsund krónur", meanings = { en = "two thousand krónur", ja = "2000クローナ" } }], variants = [{ say = "Það eru tvö þúsund krónur.", meaning = "It's two thousand krónur.", meaning_ja = "2000クローナです。", probes = [{ kind = "price", answer = "tvö þúsund krónur", meanings = { en = "two thousand krónur", ja = "2000クローナ" } }] }, { say = "Tvö þúsund krónur, takk.", meaning = "Two thousand krónur, please.", meaning_ja = "2000クローナお願いします。", probes = [{ kind = "price", answer = "tvö þúsund krónur", meanings = { en = "two thousand krónur", ja = "2000クローナ" } }] }] },
  { who = "you", cue = "Hand over your card.", cue_ja = "カードを渡します。", say = "Gjörðu svo vel.", items = ["gjordu_svo_vel"] },
]

