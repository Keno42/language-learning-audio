ínútur", meanings = { en = "ten minutes", ja = "10分" }, ask = { en = "How long do we stop?", ja = "何分休憩しますか？" } }, { kind = "time", answer = "klukkan hálf fimm", meanings = { en = "half past four", ja = "4時半" }, ask = { en = "When do we leave?", ja = "何時に出発しますか？" } }] }] },
