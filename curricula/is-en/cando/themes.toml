  { who = "partner", say = "Nei, það er nálægt. Bara fimm mínútur.", meaning = "No, it's close. Just five minutes.", meaning_ja = "いいえ、近いですよ。5分だけです。", probes = [{ kind = "duration", answer = "fimm mínútur", meanings = { en = "five minutes", ja = "5分" } }], variants = [{ say = "Nei, það tekur bara fimm mínútur að ganga.", meaning = "No, it's only a five-minute walk.", meaning_ja = "いいえ、歩いて5分だけです。", probes = [{ kind = "duration", answer = "fimm mínútur", meanings = { en = "five minutes", ja = "5分" } }] }] },
  { who = "you", cue = "Thank them warmly.", cue_ja = "心をこめてお礼を言ってください。", say = "Takk kærlega.", items = ["takk_kaerlega"] },
  { who = "partner", say = "Ekkert að þakka.", meaning = "You're welcome.", meaning_ja = "どういたしまして。", variants = [{ say = "Ekkert mál.", meaning = "No problem.", meaning_ja = "いえいえ。" }] },
