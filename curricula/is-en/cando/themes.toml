# Lesson themes (issue #149, step 1b-ii): a scene of a trip as a short exchange, at rising levels.
# See audiolesson/themes.py. A lesson consolidates one theme: its exchange is played twice, once
# early with the partner's lines translated and once late with only the partner's line as the cue.
# Level 1 is the shortest exchange that works; later levels raise its resolution.
#
# Partner lines may go beyond the course: getting the gist of 80-90% of what is said is the
# point. The learner's own lines (`who = "you"`) list the items they need. Wordings are candidates;
# a native speaker's corrections are applied when they come.
# General content only: no learner's dates, itinerary or lodging (the private trip profile
# decides which theme comes first).

[[themes]]
id = "cafe"
scenario = "A4"
title = "Café"
title_ja = "カフェ"
setting = "A busy café: order at the counter, find a seat, ask for the bill."
setting_ja = "混んだカフェ。カウンターで注文し、席を見つけ、会計する。"
topics = ["cafe"]

[[themes.levels]]
goal = "Order a coffee and answer the milk question."
goal_ja = "コーヒーを注文し、ミルクがいるかに答える。"
turns = [
  { who = "partner", say = "Hæ! Hvað má bjóða þér?", meaning = "Hi! What can I get you?", meaning_ja = "こんにちは！何にしますか？" },
  { who = "you", cue = "Order a coffee.", cue_ja = "コーヒーを注文してください。", say = "Ég ætla að fá kaffi.", items = ["eg_aetla_ad_fa", "kaffi"], alts = ["Kaffi, takk."] },
  { who = "partner", say = "Með mjólk?", meaning = "With milk?", meaning_ja = "ミルクは入れますか？" },
  { who = "you", cue = "Yes, please.", cue_ja = "はい、お願いします。", say = "Já, takk.", items = ["ja", "takk"] },
  { who = "partner", say = "Gjörðu svo vel.", meaning = "Here you go.", meaning_ja = "どうぞ。" },
  { who = "you", cue = "Thank him.", cue_ja = "お礼を言ってください。", say = "Takk.", items = ["takk"] },
]

[[themes.levels]]
goal = "Find a free seat, ask for the menu, order the soup and a drink."
goal_ja = "空いた席を見つけ、メニューをもらい、スープと飲み物を頼む。"
turns = [
  { who = "you", cue = "The café is crowded. Ask a stranger if the seat next to them is free.", cue_ja = "カフェが混んでいます。隣の席が空いているか、知らない人に聞いてください。", say = "Er þetta sæti laust?", items = ["er_thetta_saeti_laust"] },
  { who = "partner", say = "Já, gjörðu svo vel.", meaning = "Yes, go ahead.", meaning_ja = "ええ、どうぞ。" },
  { who = "you", cue = "At the counter, ask for the menu.", cue_ja = "カウンターでメニューをもらってください。", say = "Get ég fengið matseðilinn?", items = ["get_eg_fengid", "matsedilinn"], prompted = false },
  { who = "partner", say = "Já. Súpa dagsins er kjötsúpa.", meaning = "Sure. The soup of the day is lamb soup.", meaning_ja = "はい。本日のスープはラム肉のスープです。" },
  { who = "you", cue = "Order the soup.", cue_ja = "スープを注文してください。", say = "Ég ætla að fá súpu.", items = ["eg_aetla_ad_fa", "supu"] },
  { who = "partner", say = "Eitthvað að drekka?", meaning = "Anything to drink?", meaning_ja = "お飲み物は？" },
  { who = "you", cue = "Just water.", cue_ja = "水だけでいいです。", say = "Vatn, takk.", items = ["vatn", "takk"] },
]

[[themes.levels]]
partner_speaker = "native_a"  # the partner is a woman
goal = "Ask for the bill and say it was good."
goal_ja = "会計を頼み、おいしかったと伝える。"
turns = [
  { who = "you", cue = "You've finished. Ask for the bill.", cue_ja = "食べ終わりました。お会計を頼んでください。", say = "Get ég fengið reikninginn?", items = ["get_eg_fengid_reikninginn"] },
  { who = "partner", say = "Já, ég kem strax.", meaning = "Yes, I'll be right there.", meaning_ja = "はい、すぐ伺います。" },
  { who = "you", cue = "Tell her it was good.", cue_ja = "おいしかったと伝えてください。", say = "Þetta var gott.", items = ["thetta_var_gott"], prompted = false, alts = ["Þetta var ljúffengt."] },
  { who = "partner", say = "Takk fyrir það!", meaning = "Thank you!", meaning_ja = "ありがとうございます！" },
]

[[themes]]
id = "supermarket"
scenario = "A3"
title = "Supermarket"
title_ja = "スーパー"
setting = "A supermarket: the shelves, the dairy fridge, the till."
setting_ja = "スーパー。棚、乳製品の冷蔵棚、レジ。"
topics = ["shopping", "food"]

[[themes.levels]]
goal = "Ask staff for something you can't find, answer the bag question, pay."
goal_ja = "見つからない物を店員に聞き、袋がいるかに答えて払う。"
turns = [
  { who = "you", cue = "You can't find skyr. Ask a member of staff if they have it.", cue_ja = "スキールが見つかりません。店員にあるか聞いてください。", say = "Afsakið, áttu skyr?", items = ["afsakid", "attu", "skyr"] },
  { who = "partner", say = "Já, það er þarna, í kælinum.", meaning = "Yes, it's over there, in the fridge.", meaning_ja = "はい、あちらの冷蔵棚です。" },
  { who = "you", cue = "Thank him.", cue_ja = "お礼を言ってください。", say = "Takk.", items = ["takk"] },
  { who = "partner", say = "Viltu poka?", meaning = "Would you like a bag?", meaning_ja = "袋はいりますか？" },
  { who = "you", cue = "Yes, you need one.", cue_ja = "はい、いります。", say = "Já, takk.", items = ["ja", "takk"] },
  { who = "partner", say = "Það gera tvö þúsund krónur.", meaning = "That's two thousand krónur.", meaning_ja = "2000クローナです。" },
  { who = "you", cue = "Hand over your card.", cue_ja = "カードを渡します。", say = "Gjörðu svo vel.", items = ["gjordu_svo_vel"] },
]

[[themes.levels]]
goal = "Say you're just looking, ask for the total, decline the receipt."
goal_ja = "見ているだけと伝え、合計を聞き、レシートを断る。"
turns = [
  { who = "partner", say = "Get ég aðstoðað?", meaning = "Can I help?", meaning_ja = "何かお探しですか？" },
  { who = "you", cue = "You're just looking.", cue_ja = "見ているだけです。", say = "Ég er bara að skoða.", items = ["eg_er_ad_leita_ad_thing"] },
  { who = "you", cue = "At the till, ask how much it is in total.", cue_ja = "レジで合計がいくらか聞いてください。", say = "Hvað er þetta mikið samtals?", items = ["hvad_er_thetta_mikid_samtals"] },
  { who = "partner", say = "Þrjú þúsund og fimm hundruð.", meaning = "Three thousand five hundred.", meaning_ja = "3500です。" },
  { who = "partner", say = "Viltu kvittun?", meaning = "Would you like the receipt?", meaning_ja = "レシートはいりますか？" },
  { who = "you", cue = "No need.", cue_ja = "いりません。", say = "Nei, takk.", items = ["nei", "takk"] },
]

[[themes]]
id = "museum"
scenario = "B1"
title = "Museum"
title_ja = "博物館"
setting = "The ticket desk, the cloakroom and the exhibition."
setting_ja = "チケット窓口、クローク、展示室。"
topics = ["travel", "directions"]
[[themes.levels]]
goal = "Buy a ticket and pay by card."
goal_ja = "チケットを買ってカードで払う。"
turns = [
  { who = "you", cue = "At the museum desk, greet and ask for one adult ticket.", cue_ja = "博物館の窓口であいさつし、大人1枚と頼んでください。", say = "Góðan daginn. Einn fullorðinn, takk.", items = ["godan_daginn", "einn_fullordinn_takk"] },
  { who = "partner", say = "Það eru tvö þúsund og fimm hundruð krónur.", meaning = "That's two thousand five hundred krónur.", meaning_ja = "2500クローナです。" },
  { who = "you", cue = "Ask if you can pay by card.", cue_ja = "カードで払えるか聞いてください。", say = "Má ég borga með korti?", items = ["ma_eg_borga_med_korti"], prompted = false },
  { who = "partner", say = "Já, auðvitað.", meaning = "Yes, of course.", meaning_ja = "はい、もちろん。" },
]

[[themes]]
id = "tour"
scenario = "B2"
title = "Day tour with a guide"
title_ja = "ガイド付きの日帰りツアー"
setting = "A coach tour: the guide talks to the group, stops at a waterfall, points at a volcano."
setting_ja = "バスツアー。ガイドの説明、滝での休憩、火山の案内。"
topics = ["travel", "nature"]
[[themes.levels]]
partner_speaker = "native_a"  # the partner is a woman
goal = "Greet the guide and find out when the coach leaves."
goal_ja = "ガイドにあいさつし、バスの出発時刻を確かめる。"
turns = [
  { who = "partner", say = "Góðan daginn öll! Ég heiti Anna og ég er leiðsögumaðurinn ykkar í dag.", meaning = "Good morning, everyone! I'm Anna, and I'm your guide today.", meaning_ja = "皆さんおはようございます！今日のガイドのアンナです。" },
  { who = "you", cue = "Greet her back.", cue_ja = "あいさつを返してください。", say = "Góðan daginn.", items = ["godan_daginn"] },
  { who = "partner", say = "Við stoppum hérna í tuttugu mínútur.", meaning = "We'll stop here for twenty minutes.", meaning_ja = "ここで20分休憩します。" },
  { who = "you", cue = "Ask when you're leaving.", cue_ja = "いつ出発するか聞いてください。", say = "Hvenær leggjum við af stað?", items = ["hvenaer_leggjum_vid_af_stad"], prompted = false },
  { who = "partner", say = "Klukkan hálf þrjú.", meaning = "At half past two.", meaning_ja = "2時半です。" },
  { who = "you", cue = "Thank her.", cue_ja = "お礼を言ってください。", say = "Takk.", items = ["takk"] },
]
[[themes.levels]]
goal = "Ask the name of a mountain, react to the view, accept a photo."
goal_ja = "山の名前を聞き、景色に反応し、写真を撮ってもらう。"
turns = [
  { who = "you", cue = "Point at a mountain and ask its name.", cue_ja = "山を指して名前を聞いてください。", say = "Hvað heitir þetta fjall?", items = ["hvad_er_thetta_fjall"] },
  { who = "partner", say = "Þetta er Hekla. Hún er eldfjall.", meaning = "That's Hekla. It's a volcano.", meaning_ja = "ヘクラ山です。火山ですよ。" },
  { who = "you", cue = "React to the view.", cue_ja = "景色に反応してください。", say = "Vá! Útsýnið er fallegt.", items = ["vaa", "utsynid_er_fallegt"], prompted = false },
  { who = "partner", say = "Viltu að ég taki mynd af ykkur?", meaning = "Shall I take a photo of you?", meaning_ja = "写真を撮りましょうか？" },
  { who = "you", cue = "Yes, please.", cue_ja = "はい、お願いします。", say = "Já, takk.", items = ["ja", "takk"] },
]
