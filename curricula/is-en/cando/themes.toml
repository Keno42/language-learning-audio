# Lesson themes (issue #149): a scene of a trip as a short exchange, at rising levels.
# See audiolesson/themes.py. A lesson consolidates one theme instead of a word count; level
# 1 is the shortest exchange that works, later levels raise its resolution (owner, after
# lesson 12: the bakery as greet → "this one, please" → yes/no to a bag → goodbye).
#
# Partner lines and `listen` lines may go beyond the course: getting the gist of 80–90%
# is the point. The learner's own lines (`who = "you"`) list the items they need.
# Wordings are candidates; a native speaker's corrections are applied when they come.
# General content only: no learner's dates, itinerary or lodging.

# ---------------------------------------------------------------- food and shops

[[themes]]
id = "bakery"
scenario = "A4"
title = "Bakery counter"
title_ja = "パン屋のカウンター"
setting = "A bakery in the morning: pastries behind glass, a clerk at the till."
setting_ja = "朝のパン屋。ガラスケースのパンと、レジの店員。"
topics = ["bakery", "cafe"]

[[themes.levels]]
goal = "Get one pastry by pointing, answer the bag question, leave."
goal_ja = "指さしで一つ買い、袋がいるかに答えて店を出る。"
turns = [
  { who = "you", cue = "You walk into a bakery in the morning. Greet the clerk.", cue_ja = "朝、パン屋に入ります。店員にあいさつしてください。", say = "Góðan daginn.", items = ["godan_daginn"], alts = ["Hæ."] },
  { who = "partner", say = "Góðan daginn! Hvað má bjóða þér?", meaning = "Good morning! What can I get you?", meaning_ja = "おはようございます！何になさいますか？" },
  { who = "you", cue = "You don't know the name of the pastry you want. Point at it.", cue_ja = "欲しいパンの名前がわかりません。指さしてください。", say = "Þetta, takk.", items = ["thetta_takk"] },
  { who = "partner", say = "Viltu poka?", meaning = "Would you like a bag?", meaning_ja = "袋はいりますか？" },
  { who = "you", cue = "You don't need a bag.", cue_ja = "袋はいりません。", say = "Nei, takk.", items = ["nei", "takk"] },
  { who = "partner", say = "Gjörðu svo vel. Eigðu góðan dag!", meaning = "Here you go. Have a nice day!", meaning_ja = "どうぞ。良い一日を！" },
  { who = "you", cue = "Thank her and leave.", cue_ja = "お礼を言って店を出ます。", say = "Takk, bless.", items = ["takk", "bless"], alts = ["Takk, sömuleiðis."] },
]
listen = [{ say = "Næsti, gjörðu svo vel.", meaning = "Next, please.", meaning_ja = "次の方どうぞ。" }]
read = ["Opið"]

[[themes.levels]]
goal = "Order by name, say that's all, take it away, pay by card."
goal_ja = "名前で注文し、以上ですと言い、持ち帰りでカード払いする。"
turns = [
  { who = "partner", say = "Hæ, hvað má bjóða þér?", meaning = "Hi, what can I get you?", meaning_ja = "こんにちは、何になさいますか？" },
  { who = "you", cue = "Ask for a cinnamon bun.", cue_ja = "シナモンロールを頼んでください。", say = "Ég ætla að fá snúð.", items = ["eg_aetla_ad_fa", "snud"], alts = ["Get ég fengið snúð?"] },
  { who = "partner", say = "Eitthvað fleira?", meaning = "Anything else?", meaning_ja = "他には？" },
  { who = "you", cue = "That's all.", cue_ja = "以上です。", say = "Þetta er allt.", items = ["thetta_er_allt"], alts = ["Nei, takk."] },
  { who = "partner", say = "Til að taka með?", meaning = "To take away?", meaning_ja = "お持ち帰りですか？" },
  { who = "you", cue = "Yes, to take away.", cue_ja = "はい、持ち帰りです。", say = "Til að taka með, takk.", items = ["til_ad_taka_med"] },
  { who = "partner", say = "Það gera sex hundruð krónur.", meaning = "That's six hundred krónur.", meaning_ja = "600クローナです。" },
  { who = "you", cue = "Ask whether you can pay by card.", cue_ja = "カードで払えるか聞いてください。", say = "Má ég borga með korti?", items = ["ma_eg_borga_med_korti"] },
  { who = "partner", say = "Já, auðvitað.", meaning = "Yes, of course.", meaning_ja = "はい、もちろん。" },
]
read = ["Kanilsnúður", "Vínarbrauð"]

[[themes.levels]]
goal = "Ask what an unknown pastry is, try it, ask for a receipt."
goal_ja = "知らないパンが何か聞き、試してみて、レシートをもらう。"
turns = [
  { who = "you", cue = "There's a pastry you've never seen. Ask what it is.", cue_ja = "見たことのないお菓子があります。何か聞いてください。", say = "Hvað er þetta?", items = ["hvad_er_thetta"] },
  { who = "partner", say = "Þetta er kleina. Hún er íslensk.", meaning = "It's a kleina. It's Icelandic.", meaning_ja = "クレイナです。アイスランドのお菓子ですよ。" },
  { who = "you", cue = "You'd like to try it.", cue_ja = "試してみたいです。", say = "Ég vil smakka.", items = ["eg_vil_smakka"] },
  { who = "partner", say = "Gjörðu svo vel. Þrjú hundruð krónur.", meaning = "Here you go. Three hundred krónur.", meaning_ja = "どうぞ。300クローナです。" },
  { who = "you", cue = "Ask for a receipt.", cue_ja = "レシートをもらってください。", say = "Get ég fengið kvittun?", items = ["get_eg_fengid_kvittun"] },
  { who = "partner", say = "Já, hérna.", meaning = "Yes, here.", meaning_ja = "はい、こちらです。" },
]

[[themes]]
id = "cafe"
