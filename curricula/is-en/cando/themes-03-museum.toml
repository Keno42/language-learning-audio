# Lesson themes: one file a theme, read in file-name order (`load_records`). The format and its rules: themes-01-cafe.toml's
# header and audiolesson/themes.py.

[[themes]]
id = "museum"
scenario = "B1"
title = "Museum"
title_ja = "博物館"
setting = "The ticket desk, the cloakroom and the exhibition."
setting_ja = "チケット窓口、クローク、展示室。"
scene_line = "You're at a museum."
scene_line_ja = "博物館にいます。"
# not "directions" (#327): its exchange is the ticket desk, and asking the way is the town theme's
topics = ["travel"]
[[themes.levels]]
goal = "Buy a ticket and pay by card."
goal_ja = "チケットを買ってカードで払う。"
turns = [
