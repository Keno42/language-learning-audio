      { say = "Já, það er í lagi.", meaning = "Yes, that's fine.", meaning_ja = "はい、大丈夫ですよ。" },
      { say = "Já, að sjálfsögðu.", meaning = "Yes, of course.", meaning_ja = "はい、もちろんです。" },
    ] },
]

[[themes.levels]]
# #451 step 2b: how many you are, and tickets by age, two forms of «two» side by side («tvo fullorðna», «tvö börn»). No total is said:
# level 1 has the ticket price, and a family's total would add another «þúsund» (#451). Candidates until native-checked (#209).
goal = "Say how many you are, ask for two adults and two children, and pay by card."
goal_ja = "何人か答え、大人2名と子ども2名を頼み、カードで払う。"
scene_line = "You're at the museum desk with a friend and two children."
scene_line_ja = "友人と子ども二人と博物館の窓口にいます。"
turns = [
  { who = "partner", say = "Góðan daginn. Hvað eruð þið mörg?", meaning = "Hello. How many of you are there?", meaning_ja = "こんにちは。何名様ですか？", word_glosses = { "mörg" = { en = "how many", ja = "何名" } } },
  { who = "you", cue = "Say there are four of you.", cue_ja = "四人だと答えてください。", aim = "say how many you are", aim_ja = "何人か答える", say = "Við erum fjögur.", items = ["vid_erum_fjogur"] },
  { who = "partner", say = "Fullorðnir eða börn?", meaning = "Adults or children?", meaning_ja = "大人ですか、子どもですか？" },
  { who = "you", cue = "Ask for two adults and two children.", cue_ja = "大人2名と子ども2名を頼んでください。", aim = "ask for two adults and two children", aim_ja = "大人2名と子ども2名を頼む", say = "Tvo fullorðna og tvö börn, takk.", items = ["tvo_fullordna_og_tvo_born_takk"] },
  { who = "partner", say = "Það er frítt fyrir börn.", meaning = "It's free for children.", meaning_ja = "子どもは無料です。", word_glosses = { "frítt" = { en = "free", ja = "無料" } } },
  { who = "you", cue = "Ask if you can pay by card.", cue_ja = "カードで払えるか聞いてください。", aim = "ask if you can pay by card", aim_ja = "カードで払えるか聞く", say = "Má ég borga með korti?", items = ["ma_eg_borga_med_korti"] },
  { who = "partner", say = "Já, auðvitað.", meaning = "Yes, of course.", meaning_ja = "はい、もちろん。", variants = [{ say = "Já, að sjálfsögðu.", meaning = "Yes, of course.", meaning_ja = "はい、もちろんです。" }] },
]
