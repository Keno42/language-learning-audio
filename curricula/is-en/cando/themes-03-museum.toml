      { say = "Það gera tvö þúsund og fimm hundruð krónur.", meaning = "That's two thousand five hundred krónur.", meaning_ja = "2500クローナです。", probes = [{ kind = "price", answer = "tvö þúsund og fimm hundruð krónur", meanings = { en = "two thousand five hundred krónur", ja = "2500クローナ" } }] },
      { say = "Tvö þúsund og fimm hundruð, takk.", meaning = "Two thousand five hundred, please.", meaning_ja = "2500お願いします。", probes = [{ kind = "price", answer = "tvö þúsund og fimm hundruð", meanings = { en = "two thousand five hundred", ja = "2500" } }] },
      { say = "Það eru þrjú þúsund krónur.", meaning = "That's three thousand krónur.", meaning_ja = "3000クローナです。", probes = [{ kind = "price", answer = "þrjú þúsund krónur", meanings = { en = "three thousand krónur", ja = "3000クローナ" } }] },
      { say = "Það eru tvö þúsund og átta hundruð krónur.", meaning = "That's two thousand eight hundred krónur.", meaning_ja = "2800クローナです。", probes = [{ kind = "price", answer = "tvö þúsund og átta hundruð krónur", meanings = { en = "two thousand eight hundred krónur", ja = "2800クローナ" } }] },
    ], listen = [
      { say = "Safnið opnar klukkan hálf ellefu og lokar klukkan sex.", meaning = "The museum opens at half past ten and closes at six.", meaning_ja = "博物館は10時半に開き、6時に閉まります。", probes = [{ kind = "time", answer = "klukkan hálf ellefu", meanings = { en = "half past ten", ja = "10時半" }, ask = { en = "When does the museum open?", ja = "博物館は何時に開きますか？" } }, { kind = "time", answer = "klukkan sex", meanings = { en = "six o'clock", ja = "6時" }, ask = { en = "When does it close?", ja = "何時に閉まりますか？" } }] },
      { say = "Safnið opnar klukkan tíu og lokar klukkan fimm.", meaning = "The museum opens at ten and closes at five.", meaning_ja = "博物館は10時に開き、5時に閉まります。", probes = [{ kind = "time", answer = "klukkan tíu", meanings = { en = "ten o'clock", ja = "10時" }, ask = { en = "When does the museum open?", ja = "博物館は何時に開きますか？" } }, { kind = "time", answer = "klukkan fimm", meanings = { en = "five o'clock", ja = "5時" }, ask = { en = "When does it close?", ja = "何時に閉まりますか？" } }] },
      { say = "Safnið opnar klukkan níu og lokar klukkan sex.", meaning = "The museum opens at nine and closes at six.", meaning_ja = "博物館は9時に開き、6時に閉まります。", probes = [{ kind = "time", answer = "klukkan níu", meanings = { en = "nine o'clock", ja = "9時" }, ask = { en = "When does the museum open?", ja = "博物館は何時に開きますか？" } }, { kind = "time", answer = "klukkan sex", meanings = { en = "six o'clock", ja = "6時" }, ask = { en = "When does it close?", ja = "何時に閉まりますか？" } }] },
      { say = "Safnið opnar klukkan ellefu og lokar klukkan fjögur.", meaning = "The museum opens at eleven and closes at four.", meaning_ja = "博物館は11時に開き、4時に閉まります。", probes = [{ kind = "time", answer = "klukkan ellefu", meanings = { en = "eleven o'clock", ja = "11時" }, ask = { en = "When does the museum open?", ja = "博物館は何時に開きますか？" } }, { kind = "time", answer = "klukkan fjögur", meanings = { en = "four o'clock", ja = "4時" }, ask = { en = "When does it close?", ja = "何時に閉まりますか？" } }] },
    ] },
  { who = "you", cue = "Ask if you can pay by card.", cue_ja = "カードで払えるか聞いてください。", aim = "ask if you can pay by card", aim_ja = "カードで払えるか聞く", say = "Má ég borga með korti?", items = ["ma_eg_borga_med_korti"] },
