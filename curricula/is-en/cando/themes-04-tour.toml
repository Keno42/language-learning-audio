    ] },
  { who = "you", cue = "Say you understand.", cue_ja = "わかりましたと言ってください。", aim = "say you understand", aim_ja = "理解したと伝える", say = "Ég skil.", items = ["eg_skil"] },
  { who = "partner", say = "Gott. Þá förum við af stað.", meaning = "Good. Then off we go.", meaning_ja = "よし。では出発しましょう。", variants = [{ say = "Gott. Þá leggjum við af stað.", meaning = "Good. Then we set off.", meaning_ja = "よし。では出発します。" }] },
]
