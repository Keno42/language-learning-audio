    ] },
  { who = "you", cue = "Say OK.", cue_ja = "わかりましたと言ってください。", aim = "say OK", aim_ja = "了解する", say = "Allt í lagi.", items = ["allt_i_lagi"] },
  { who = "partner", say = "Við snúum við klukkan þrjú. Það dimmir snemma.", meaning = "We turn back at three. It gets dark early.", meaning_ja = "3時に引き返します。暗くなるのが早いので。", probes = [{ kind = "time", answer = "klukkan þrjú", meanings = { en = "three o'clock", ja = "3時" } }], listen = [
