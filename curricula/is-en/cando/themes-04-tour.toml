    ], variants = [
      { say = "Við snúum við klukkan hálf fjögur. Það dimmir snemma.", meaning = "We turn back at half past three. It gets dark early.", meaning_ja = "3時半に引き返します。暗くなるのが早いので。", probes = [{ kind = "time", answer = "klukkan hálf fjögur", meanings = { en = "half past three", ja = "3時半" } }] },
