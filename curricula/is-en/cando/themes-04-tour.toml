# Lesson themes: one file a theme, read in file-name order (`load_records`). The format and its rules: themes-01-cafe.toml's
# header and audiolesson/themes.py.

[[themes]]
id = "tour"
scenario = "B2"
title = "Day tour with a guide"
title_ja = "ガイド付きの日帰りツアー"
setting = "A coach tour: the guide talks to the group, stops at a waterfall, points at a volcano."
setting_ja = "バスツアー。ガイドの説明、滝での休憩、火山の案内。"
scene_line = "You're on a coach tour."
scene_line_ja = "バスツアーに参加しています。"
topics = ["travel", "nature"]
[[themes.levels]]
partner_speaker = "native_a"  # the partner is a woman
goal = "Greet the guide and find out when the coach leaves."
goal_ja = "ガイドにあいさつし、バスの出発時刻を確かめる。"
turns = [
  { who = "partner", say = "Góðan daginn öll! Ég heiti Anna og ég er leiðsögumaðurinn ykkar í dag.", meaning = "Good morning, everyone! I'm Anna, and I'm your guide today.", meaning_ja = "皆さんおはようございます！今日のガイドのアンナです。" },
  { who = "you", cue = "Greet her back.", cue_ja = "あいさつを返してください。", aim = "greet the guide", aim_ja = "ガイドにあいさつを返す", say = "Góðan daginn.", items = ["godan_daginn"] },
  { who = "partner", say = "Við stoppum hérna í tuttugu mínútur.", meaning = "We'll stop here for twenty minutes.", meaning_ja = "ここで20分休憩します。", probes = [{ kind = "duration", answer = "tuttugu mínútur", meanings = { en = "twenty minutes", ja = "20分" } }], variants = [
      { say = "Við verðum hérna í tuttugu mínútur.", meaning = "We'll be here for twenty minutes.", meaning_ja = "ここに20分います。", probes = [{ kind = "duration", answer = "tuttugu mínútur", meanings = { en = "twenty minutes", ja = "20分" } }] },
      { say = "Hér stoppum við í tuttugu mínútur.", meaning = "Here we stop for twenty minutes.", meaning_ja = "ここで20分止まります。", probes = [{ kind = "duration", answer = "tuttugu mínútur", meanings = { en = "twenty minutes", ja = "20分" } }] },
      { say = "Við stoppum hérna í þrjátíu mínútur.", meaning = "We'll stop here for thirty minutes.", meaning_ja = "ここで30分休憩します。", probes = [{ kind = "duration", answer = "þrjátíu mínútur", meanings = { en = "thirty minutes", ja = "30分" } }] },
      { say = "Við stoppum hérna í fimmtán mínútur.", meaning = "We'll stop here for fifteen minutes.", meaning_ja = "ここで15分休憩します。", probes = [{ kind = "duration", answer = "fimmtán mínútur", meanings = { en = "fifteen minutes", ja = "15分" } }] },
    ], listen = [
      { say = "Við stoppum hérna í tuttugu mínútur og förum svo klukkan hálf þrjú.", meaning = "We'll stop here for twenty minutes, and then we leave at half past two.", meaning_ja = "ここで20分休憩して、2時半に出発します。", probes = [{ kind = "duration", answer = "tuttugu mínútur", meanings = { en = "twenty minutes", ja = "20分" }, ask = { en = "How long do we stop?", ja = "何分休憩しますか？" } }, { kind = "time", answer = "klukkan hálf þrjú", meanings = { en = "half past two", ja = "2時半" }, ask = { en = "When do we leave?", ja = "何時に出発しますか？" } }] },
      { say = "Við stoppum hérna í fimm mínútur og förum svo klukkan fjögur.", meaning = "We stop here for five minutes and then leave at four.", meaning_ja = "ここで5分休憩して、4時に出発します。", probes = [{ kind = "duration", answer = "fimm mínútur", meanings = { en = "five minutes", ja = "5分" }, ask = { en = "How long do we stop?", ja = "何分休憩しますか？" } }, { kind = "time", answer = "klukkan fjögur", meanings = { en = "four o'clock", ja = "4時" }, ask = { en = "When do we leave?", ja = "何時に出発しますか？" } }] },
      { say = "Við stoppum hérna í tíu mínútur og förum svo klukkan hálf fimm.", meaning = "We stop here for ten minutes and then leave at half past four.", meaning_ja = "ここで10分休憩して、4時半に出発します。", probes = [{ kind = "duration", answer = "tíu mínútur", meanings = { en = "ten minutes", ja = "10分" }, ask = { en = "How long do we stop?", ja = "何分休憩しますか？" } }, { kind = "time", answer = "klukkan hálf fimm", meanings = { en = "half past four", ja = "4時半" }, ask = { en = "When do we leave?", ja = "何時に出発しますか？" } }] },
    ] },
  { who = "you", cue = "Ask when you're leaving.", cue_ja = "いつ出発するか聞いてください。", aim = "ask when you're leaving", aim_ja = "いつ出発するか聞く", say = "Hvenær leggjum við af stað?", items = ["hvenaer_leggjum_vid_af_stad"] },
  { who = "partner", say = "Klukkan hálf þrjú.", meaning = "At half past two.", meaning_ja = "2時半です。", probes = [{ kind = "time", answer = "klukkan hálf þrjú", meanings = { en = "half past two", ja = "2時半" } }], variants = [
      { say = "Við förum klukkan hálf þrjú.", meaning = "We leave at half past two.", meaning_ja = "2時半に出発します。", probes = [{ kind = "time", answer = "klukkan hálf þrjú", meanings = { en = "half past two", ja = "2時半" } }] },
      { say = "Rútan fer klukkan hálf þrjú.", meaning = "The coach leaves at half past two.", meaning_ja = "バスは2時半に出ます。", probes = [{ kind = "time", answer = "klukkan hálf þrjú", meanings = { en = "half past two", ja = "2時半" } }] },
      { say = "Klukkan hálf fjögur.", meaning = "At half past three.", meaning_ja = "3時半です。", probes = [{ kind = "time", answer = "klukkan hálf fjögur", meanings = { en = "half past three", ja = "3時半" } }] },
      { say = "Klukkan þrjú.", meaning = "At three.", meaning_ja = "3時です。", probes = [{ kind = "time", answer = "klukkan þrjú", meanings = { en = "three o'clock", ja = "3時" } }] },
    ], listen = [
      { say = "Við leggjum aftur af stað klukkan korter yfir þrjú.", meaning = "We set off again at a quarter past three.", meaning_ja = "3時15分にまた出発します。", probes = [{ kind = "time", answer = "klukkan korter yfir þrjú", meanings = { en = "a quarter past three", ja = "3時15分" } }] },
      { say = "Klukkan korter í fjögur, eftir þrjátíu mínútur.", meaning = "At a quarter to four, in thirty minutes.", meaning_ja = "3時45分、30分後です。", probes = [{ kind = "time", answer = "klukkan korter í fjögur", meanings = { en = "a quarter to four", ja = "3時45分" }, ask = { en = "When do you leave?", ja = "何時に出発しますか？" } }, { kind = "duration", answer = "þrjátíu mínútur", meanings = { en = "thirty minutes", ja = "30分" }, ask = { en = "In how long?", ja = "あと何分後ですか？" } }] },
      { say = "Rútan fer klukkan þrjú.", meaning = "The bus leaves at three.", meaning_ja = "バスは3時に出ます。", probes = [{ kind = "time", answer = "klukkan þrjú", meanings = { en = "three o'clock", ja = "3時" } }] },
      { say = "Við förum klukkan hálf fimm.", meaning = "We leave at half past four.", meaning_ja = "4時半に出発します。", probes = [{ kind = "time", answer = "klukkan hálf fimm", meanings = { en = "half past four", ja = "4時半" } }] },
    ] },
  { who = "you", cue = "Thank her.", cue_ja = "お礼を言ってください。", aim = "thank her", aim_ja = "お礼を言う", say = "Takk.", items = ["takk"] },
]
[[themes.levels]]
goal = "Ask the name of a mountain, react to the view, accept a photo."
goal_ja = "山の名前を聞き、景色に反応し、写真を撮ってもらう。"
turns = [
  { who = "you", cue = "Point at a mountain and ask its name.", cue_ja = "山を指して名前を聞いてください。", aim = "ask the name of a mountain", aim_ja = "山の名前を聞く", say = "Hvað heitir þetta fjall?", items = ["hvad_er_thetta_fjall"] },
  { who = "partner", say = "Þetta er Hekla. Hún er eldfjall.", meaning = "That's Hekla. It's a volcano.", meaning_ja = "ヘクラ山です。火山ですよ。", variants = [
      { say = "Þetta er Hekla, eldfjall.", meaning = "That's Hekla, a volcano.", meaning_ja = "ヘクラ山、火山です。" },
      { say = "Þarna er Hekla. Hún er eldfjall.", meaning = "There's Hekla. It's a volcano.", meaning_ja = "あれがヘクラ山です。火山ですよ。" },
    ] },
  { who = "you", cue = "React to the view.", cue_ja = "景色に反応してください。", aim = "react to the view", aim_ja = "景色に反応する", say = "Vá! Útsýnið er fallegt.", items = ["vaa", "utsynid_er_fallegt"] },
  { who = "partner", say = "Viltu að ég taki mynd af ykkur?", meaning = "Shall I take a photo of you?", meaning_ja = "写真を撮りましょうか？", variants = [
      { say = "Á ég að taka mynd af ykkur?", meaning = "Shall I take a picture of you?", meaning_ja = "写真を撮りましょうか？" },
      { say = "Viltu að ég taki mynd?", meaning = "Do you want me to take a photo?", meaning_ja = "写真を撮りましょうか？" },
    ] },
  { who = "you", cue = "Yes, please.", cue_ja = "はい、お願いします。", aim = "accept a photo", aim_ja = "写真を撮ってもらう", say = "Já, takk.", items = ["ja", "takk"] },
]
[[themes.levels]]
partner_speaker = "native_a"  # the partner is a woman
goal = "Say what you'd like to see."
goal_ja = "見たいものを伝える。"
turns = [
  { who = "partner", say = "Hvað langar ykkur að sjá?", meaning = "What would you like to see?", meaning_ja = "何が見たいですか？", variants = [{ say = "Hvað viljið þið sjá?", meaning = "What do you want to see?", meaning_ja = "何を見たいですか？" }] },
  { who = "you", cue = "Say you'd like to see a volcano.", cue_ja = "火山が見たいと言ってください。", aim = "say you'd like to see a volcano", aim_ja = "火山が見たいと伝える", say = "Mig langar að sjá eldfjall.", items = ["mig_langar_ad_sja", "eldfjall"], alts = ["Mig langar að sjá jökul."] },
  { who = "partner", say = "Já, það er hægt.", meaning = "Yes, that's possible.", meaning_ja = "ええ、できますよ。" },
  { who = "you", cue = "Thank her.", cue_ja = "お礼を言ってください。", aim = "thank her", aim_ja = "お礼を言う", say = "Takk.", items = ["takk"] },
]

[[themes.levels]]
# #451 step 2e: a day (said inside «Ég fer …», never bare), a booking number read digit by digit, the departure time. Full dates (ordinals,
# months) are not in the course yet. Candidates until native-checked (#209).
partner_speaker = "native_a"  # the partner is a woman, as the cues say
goal = "At the tour desk, book a tour for Thursday, and catch the booking number and when the coach leaves."
goal_ja = "ツアーデスクで木曜日のツアーを予約し、予約番号とバスの出発時刻を聞き取る。"
scene_line = "You're at the tour desk in town."
scene_line_ja = "町のツアーデスクにいます。"
turns = [
  { who = "you", cue = "Say you'd like to book a tour.", cue_ja = "ツアーを予約したいと言ってください。", aim = "say you'd like to book a tour", aim_ja = "ツアーを予約したいと伝える", say = "Ég vil bóka ferð.", items = ["eg_vil_boka_ferd"] },
  { who = "partner", say = "Já. Hvaða dag?", meaning = "Yes. Which day?", meaning_ja = "はい。何曜日ですか？", variants = [
      { say = "Já, auðvitað. Fyrir hvaða dag?", meaning = "Yes, of course. For which day?", meaning_ja = "はい、もちろん。何曜日にしますか？" },
    ] },
  { who = "you", cue = "Say you're going on Thursday.", cue_ja = "木曜日に行くと言ってください。", aim = "say the day", aim_ja = "曜日を言う", say = "Ég fer á fimmtudaginn.", items = ["eg_fer", "a_fimmtudaginn"] },
  { who = "partner", say = "Bókunarnúmerið er sex, fjórir, níu, tveir, og rútan fer klukkan átta.", meaning = "The booking number is six, four, nine, two, and the coach leaves at eight.", meaning_ja = "予約番号は6、4、9、2で、バスは8時に出ます。", probes = [
      { kind = "number", answer = "sex, fjórir, níu, tveir", meanings = { en = "six, four, nine, two", ja = "6、4、9、2" }, ask = { en = "What's the booking number?", ja = "予約番号は？" } },
      { kind = "time", answer = "klukkan átta", meanings = { en = "eight o'clock", ja = "8時" }, ask = { en = "When does the coach leave?", ja = "バスは何時に出ますか？" } },
    ], variants = [
      { say = "Bókunarnúmerið er þrír, sjö, einn, átta, og rútan fer klukkan hálf átta.", meaning = "The booking number is three, seven, one, eight, and the coach leaves at half past seven.", meaning_ja = "予約番号は3、7、1、8で、バスは7時半に出ます。", probes = [{ kind = "number", answer = "þrír, sjö, einn, átta", meanings = { en = "three, seven, one, eight", ja = "3、7、1、8" }, ask = { en = "What's the booking number?", ja = "予約番号は？" } }, { kind = "time", answer = "klukkan hálf átta", meanings = { en = "half past seven", ja = "7時半" }, ask = { en = "When does the coach leave?", ja = "バスは何時に出ますか？" } }] },
    ] },
  { who = "you", cue = "Thank her.", cue_ja = "お礼を言ってください。", aim = "thank her", aim_ja = "お礼を言う", say = "Takk fyrir.", items = ["takk_fyrir"] },
]
