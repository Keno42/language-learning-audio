    ] },
  { who = "you", cue = "Ask if this is dangerous.", cue_ja = "これは危ないか聞いてください。", aim = "ask if it's dangerous", aim_ja = "危なくないか聞く", say = "Er þetta hættulegt?", items = ["er_thetta_haettulegt"] },
  { who = "partner", say = "Nei, en ekki fara út af stígnum.", meaning = "No, but don't leave the path.", meaning_ja = "いいえ、でも道から外れないでください。", variants = [
