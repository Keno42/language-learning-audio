  { who = "partner", say = "Frábært! Sjáumst eftir tíu mínútur.", meaning = "Great! See you in ten minutes.", meaning_ja = "よかった！10分後にね。", word_glosses = { "frábært" = { en = "great", ja = "よかった" } }, probes = [{ kind = "duration", answer = "tíu mínútur", meanings = { en = "ten minutes", ja = "10分" } }], variants = [
