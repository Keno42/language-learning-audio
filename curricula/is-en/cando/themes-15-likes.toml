    ] },
  { who = "you", cue = "Say you love Iceland.", cue_ja = "アイスランドが大好きだと言ってください。", aim = "say you love Iceland", aim_ja = "アイスランドが大好きだと言う", say = "Ég elska Ísland.", items = ["eg_elska_island"] },
]
