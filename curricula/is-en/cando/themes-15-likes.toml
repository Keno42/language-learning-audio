[[themes]]
id = "likes"
scenario = "B3"
title = "What you like"
title_ja = "好きなこと"
setting = "A friend's party, then a message from a friend: what you enjoy, your favourite food, and what you're doing."
setting_ja = "友達のパーティー、それから友達からの連絡。好きなこと、好きな食べ物、今していること。"
scene_line = "At a friend's party, a man asks you what you like."
scene_line_ja = "友達のパーティーで、男性があなたの好きなことを聞いてきます。"
topics = ["likes"]
[[themes.levels]]
goal = "Say what you enjoy and that you play it, and ask him what he enjoys."
goal_ja = "好きなことと、それをすると言い、相手の好きなことを聞く。"
turns = [
  { who = "partner", say = "Hvað finnst þér skemmtilegt?", meaning = "What do you find fun?", meaning_ja = "何をするのが好きですか？", variants = [
      { say = "En þú, hvað finnst þér skemmtilegt?", meaning = "And you, what do you find fun?", meaning_ja = "あなたは、何をするのが好きですか？" },
    ] },
  { who = "you", cue = "Say you enjoy football.", cue_ja = "サッカーが好きだと言ってください。", aim = "say what you enjoy", aim_ja = "好きなことを言う", say = "Ég hef gaman af fótbolta.", items = ["eg_hef_gaman_af", "fotbolta"] },
  { who = "partner", say = "Í alvöru? Spilar þú fótbolta?", meaning = "Really? Do you play football?", meaning_ja = "本当に？サッカーをするんですか？", word_glosses = { "alvöru" = { en = "really", ja = "本当" } } },
  { who = "you", cue = "Say yes, you play football. Then ask him if he enjoys music.", cue_ja = "はい、サッカーをすると言い、音楽が好きか聞いてください。", aim = "say you play, and ask him back", aim_ja = "すると言い、相手に聞く", say = "Já, ég spila fótbolta. Hefur þú gaman af tónlist?", items = ["ja", "eg_spila_fotbolta", "hefur_thu_gaman_af", "tonlist"] },
  { who = "partner", say = "Já, ég spila á gítar og syng.", meaning = "Yes, I play the guitar and sing.", meaning_ja = "はい、ギターを弾いて歌います。" },
  { who = "you", cue = "Say you like that.", cue_ja = "それはいいですねと言ってください。", aim = "say you like it", aim_ja = "いいと言う", say = "Ég fíla það.", items = ["mer_likar_thad"] },
]
[[themes.levels]]
