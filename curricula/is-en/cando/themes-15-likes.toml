  { who = "you", cue = "Say your favourite food is fish.", cue_ja = "好きな食べ物は魚だと言ってください。", aim = "say your favourite food", aim_ja = "好きな食べ物を言う", say = "Uppáhaldsmaturinn minn er fiskur.", items = ["uppahaldsmaturinn_minn_er_fiskur"] },
  { who = "partner", say = "Viltu smakka hákarl?", meaning = "Do you want to taste fermented shark?", meaning_ja = "ハウカットル（発酵させたサメ）を味見してみますか？", word_glosses = { "hákarl" = { en = "fermented shark", ja = "発酵させたサメ" } } },
  { who = "you", cue = "Say no, thanks.", cue_ja = "いいえ、結構ですと言ってください。", aim = "turn it down", aim_ja = "断る", say = "Nei, takk.", items = ["nei_takk"] },
  { who = "partner", say = "Ha ha. Hvernig finnst þér Ísland?", meaning = "Ha ha. How do you like Iceland?", meaning_ja = "はは。アイスランドはどうですか？", variants = [
