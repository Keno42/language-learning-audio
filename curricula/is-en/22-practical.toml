[[dialogues]]
id = "simabud"
setting = "At a phone shop."
topics = ["practical"]
requires = ["eg_tharf_simkort", "hvad_kostar_thetta", "eg_er_ekki_med_kennitolu", "allt_i_lagi", "takk"]

  [[dialogues.turns]]
  opener = "Hæ, get ég aðstoðað?"
  opener_meaning = "Hi, can I help?"
  cue = "Say you need a SIM card."
  expect = "eg_tharf_simkort"
  partner = "Ertu með kennitölu?"
  partner_meaning = "Do you have a kennitala?"

  [[dialogues.turns]]
  cue = "Say you don't have a kennitala."
  expect = "eg_er_ekki_med_kennitolu"
  partner = "Ekkert mál, þá tekurðu frelsiskort. Vegabréf, takk."
  partner_meaning = "No problem, then you take a prepaid card. Passport, please."

  [[dialogues.turns]]
  cue = "Ask how much it is."
  expect = "hvad_kostar_thetta"
  partner = "Tvö þúsund krónur með tíu gígabætum."
  partner_meaning = "Two thousand krónur with ten gigabytes."

  [[dialogues.turns]]
  cue = "Say OK, and thank him."
  expect_text = "Allt í lagi. Takk."
  expect_meaning = "OK. Thanks."
