[[dialogues]]
id = "simabud"
setting = "At a phone shop."
setting_ja = "携帯ショップです。"
topics = ["practical"]
requires = ["eg_tharf_simkort", "hvad_kostar_thetta", "eg_er_ekki_med_kennitolu", "allt_i_lagi", "takk"]

  [[dialogues.turns]]
  opener = "Hæ, get ég hjálpað?"
  opener_meaning = "Hi, can I help?"
  opener_meaning_ja = "いらっしゃいませ、何かお探しですか？"
  cue = "Say you need a SIM card."
  cue_ja = "SIMカードが必要だと言ってください。"
  expect = "eg_tharf_simkort"
  partner = "Ertu með kennitölu?"
  partner_meaning = "Do you have a kennitala?"
  partner_meaning_ja = "個人番号（kennitala）はお持ちですか？"

  [[dialogues.turns]]
  cue = "Say you don't have a kennitala."
  cue_ja = "kennitala を持っていないと言ってください。"
  expect = "eg_er_ekki_med_kennitolu"
  partner = "Ekkert mál. Vegabréf, takk."
  partner_meaning = "No problem. Passport, please."
  partner_meaning_ja = "大丈夫です。パスポートをお願いします。"

  [[dialogues.turns]]
  cue = "Ask how much it is."
  cue_ja = "いくらか聞いてください。"
  expect = "hvad_kostar_thetta"
  partner = "Tvö þúsund krónur."
  partner_meaning = "Two thousand krónur."
  partner_meaning_ja = "2000クローナです。"

  [[dialogues.turns]]
  cue = "Say OK, and thank him."
  cue_ja = "わかりましたと言って、お礼を言ってください。"
  expect_text = "Allt í lagi. Takk."
  expect_meaning = "OK. Thanks."
  expect_meaning_ja = "わかりました。ありがとう。"
