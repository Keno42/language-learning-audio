[[dialogues]]
id = "spurningar"
setting = "A child at the table asks you lots of questions."
setting_ja = "食卓で子どもが次々に質問してきます。"
topics = ["questions", "social"]
requires = ["eg_er_fra_japan", "eg_er_job", "forritari", "af_thvi_ad", "mer_finnst_island_fallegt", "eg_lika"]

  [[dialogues.turns]]
  opener = "Hvaðan ert þú?"
  opener_meaning = "Where are you from?"
  opener_meaning_ja = "どこから来たの？"
  cue = "Say you're from Japan."
  cue_ja = "日本から来たと言ってください。"
  expect = "eg_er_fra_japan"
  partner = "Hvað gerir þú?"
  partner_meaning = "What do you do?"
  partner_meaning_ja = "お仕事は何？"

  [[dialogues.turns]]
  cue = "Say you're a programmer."
  cue_ja = "プログラマーだと言ってください。"
  expect_text = "Ég er forritari."
  expect_meaning = "I'm a programmer."
  expect_meaning_ja = "プログラマーです。"
  partner = "Af hverju ertu hér?"
  partner_meaning = "Why are you here?"
  partner_meaning_ja = "どうしてアイスランドにいるの？"

  [[dialogues.turns]]
  cue = "Say: because you think Iceland is beautiful."
  cue_ja = "アイスランドは美しいと思うから、と言ってください。"
  expect_text = "Af því að mér finnst Ísland fallegt."
  expect_meaning = "Because I think Iceland is beautiful."
  expect_meaning_ja = "アイスランドは美しいと思うからです。"
  partner = "Mér líka!"
  partner_meaning = "Me too!"
  partner_meaning_ja = "私も！"
