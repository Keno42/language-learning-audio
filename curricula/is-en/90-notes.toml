# 90 — asides spoken by the instructor (English), written for a learner from Japan.
# Each note is tied to items; the planner plays one right after one of them, at most a couple
# per lesson. Most are optional cultural trivia. `milestone = true` marks an instructional note
# instead: it never fires until the learner has met every id in `items`, and once it can fire,
# it does (see audiolesson/planner.py's `_eligible_milestone`) — it is never picked as filler for
# an unrelated exercise, unlike the cultural ones.

[[notes]]
id = "godur_gender"
milestone = true
items = ["godan_daginn", "goda_nott", "gott_kvold"]
topics = ["grammar", "greetings"]
text = "In «Góðan daginn», «Góða nótt», and «Gott kvöld», «góðan», «góða», and «gott» are forms of the same adjective, meaning 'good.' Here the ending changes with the noun's grammatical gender: «dagur» is masculine, «nótt» feminine, and «kvöld» neuter. Icelandic adjectives also change for case and number; we'll get to those later."
text_ja = "«Góðan daginn»、«Góða nótt»、«Gott kvöld» に出てくる «góðan»、«góða»、«gott» は、どれも「良い」という同じ形容詞の形です。ここでは名詞の文法上の性に合わせて語尾が変わります。«dagur» は男性名詞、«nótt» は女性名詞、«kvöld» は中性名詞です。形容詞は格や数によっても変わりますが、それはまた別の機会に。"

# Owner review round 2 on #29 (blocker): the first cut wired góður/góð/gott (nominative)
# into godur_gender's own transfer_items alongside góðan/góða/gott (accusative) as if
# they were the same paradigm slot with only gender varying -- but masculine/feminine
# adjective endings also change with case (BÍN: góður masc. nom., góðan masc. acc.), so
# that pairing silently taught case and gender as one undifferentiated change, directly
# contradicting this very note's own "the ending changes with the noun's grammatical
# gender" (case held constant in its own three examples). Split into its own milestone
# instead, explicit about which case these forms are in and how it differs from
# godur_gender's — see docs/HANDOFF.md.
[[notes]]
id = "godur_gender_nominative"
milestone = true
items = ["godur_matur", "thad_er_god_hugmynd", "gott_vedur"]
topics = ["grammar"]
text = "«Góður matur», «góð hugmynd», and «gott veður» show the same adjective as «Góðan daginn» — but in a different case: nominative, not accusative. The ending still changes with the noun's gender the same way — «matur» is masculine, «hugmynd» feminine, «veður» neuter — but nominative and accusative endings differ for masculine and feminine («góðan» becomes «góður», «góða» becomes «góð»); neuter happens to look the same in both."
text_ja = "«Góður matur»、«góð hugmynd»、«gott veður» に出てくるのは «Góðan daginn» と同じ形容詞ですが、格が違います：対格ではなく主格です。語尾は名詞の性に合わせて変わる点は同じです。«matur» は男性名詞、«hugmynd» は女性名詞、«veður» は中性名詞です。ただし主格と対格では男性・女性の語尾が異なります（«góðan» は «góður» に、«góða» は «góð» になります）。中性はたまたま両方の格で同じ形になります。"

# Owner review on PR #50, point 1: godur_noun's `agreement` mechanism lets the *system* derive
# the right ending from a noun's gender, but nothing previously told the *learner* that gender —
# Item.gender lived only in curriculum metadata, never in an exercise. This note is that missing
# step, gating godur_noun (see its prereqs) so the learner has actually been told bíll/bók/hús's
# genders — tied back to the dagur/hugmynd/veður examples already known — before being asked to
# apply the pattern to them.
[[notes]]
id = "gendered_nouns_bill_bok_hus"
milestone = true
items = ["bill", "bok", "hus"]
topics = ["grammar"]
text = "«Bíll» (car) is masculine, «bók» (book) is feminine, and «hús» (house) is neuter — the same three genders as «dagur», «hugmynd», and «veður». Knowing a noun's gender is what lets you pick the right ending for «góður», «góð», or «gott» on any noun, not just the ones you started with."
text_ja = "«Bíll»（車）は男性名詞、«bók»（本）は女性名詞、«hús»（家）は中性名詞です。«dagur»、«hugmynd»、«veður» と同じ三つの性です。名詞の性がわかれば、«góður»、«góð»、«gott» のうち正しい語尾を、最初に覚えた単語だけでなく、どんな名詞にも当てはめられます。"

[[notes]]
id = "three_kinds_of_sorry"
milestone = true
items = ["afsakid", "fyrirgefdu", "thvi_midur"]
topics = ["discourse", "greetings"]
text = "«Afsakið» is a common way to get someone's attention or say 'excuse me.' «Fyrirgefðu» can also mean 'excuse me,' but is especially useful when apologizing or asking forgiveness. «Því miður» is different: it means 'unfortunately,' expressing regret about a situation rather than apologizing for something you did."
text_ja = "«Afsakið» は人の注意を引いたり、「すみません」と言うときによく使われます。«Fyrirgefðu» も「すみません」の意味で使えますが、特に何かを謝ったり許しを求めたりするときに向いています。«Því miður» は違います。「残念ながら」という意味で、自分がしたことを謝るのではなく、状況について残念な気持ちを表します。"

[[notes]]
id = "tvo_l"
items = ["fjall", "eldfjall", "jokull"]
topics = ["clarifying", "nature"]
text = "That 't'-like click you'll start noticing before some 'l' sounds is not a synthesis error: double 'll' in Icelandic is pre-aspirated, so a short voiceless sound lands just before the 'l'. It happens throughout the language wherever you see 'll' or 'nn' — «fjall» (mountain), «gull» (gold), «allt» (everything) — so the more it surprises you, the more Icelandic you are learning to hear."
text_ja = "これから「l」の前に聞こえてくる「t」のような音は、合成音声の不具合ではありません。アイスランド語の二重子音「ll」には前気音化という現象があり、「l」の直前に軽い無声の音が入るのが標準的な発音です。«fjall»（山）や«gull»（金）、«allt»（すべて）でも同じことが起こります。「ll」や「nn」が出てくるたびに聞こえてくるので、驚くほど、それはアイスランド語の耳が育っている証です。"

[[notes]]
id = "pylsa"
items = ["pylsu", "eina_pylsu_med_ollu"]
topics = ["food"]
text = "The Icelandic hot dog is mostly lamb, and «með öllu» means ketchup, sweet mustard, remoulade, raw onions and crispy onions. It is the national fast food, the way a convenience-store «ja:onigiri» is in Japan: cheap, everywhere, and eaten standing up."
text_ja = "アイスランドのホットドッグはラム肉が主体で、«með öllu»と言えばケチャップ、甘いマスタード、レムラード、生と揚げの玉ねぎが全部乗ります。日本のコンビニおにぎりのような存在で、安くてどこにでもあって、立ったまま食べます。"

[[notes]]
id = "skor"
items = ["fardu_ur_skonum", "komdu_inn"]
topics = ["home"]
text = "Shoes come off at the door in Iceland too, so this will feel familiar. Unlike in Japan there is no genkan step and nobody offers slippers; you just walk around in socks."
text_ja = "アイスランドでも家に入るときは靴を脱ぐので、ここは日本と同じで安心です。ただし玄関の段差はなく、スリッパも出てきません。靴下のまま歩き回ります。"

[[notes]]
id = "heitt_vatn"
items = ["heitt_vatn_er_okeypis", "eg_fer_i_sturtu", "thad_er_ekkert_heitt_vatn"]
topics = ["home", "nature"]
text = "Hot water in Reykjavík comes straight from geothermal springs, which is why the shower smells faintly of sulphur. Long showers are not a luxury here: the water is nearly free, and houses are heated with it."
text_ja = "レイキャビクのお湯は地熱の源泉から直接引かれていて、だからシャワーがほのかに硫黄のにおいがします。長いシャワーはぜいたくではなく、お湯はほとんど無料で、家の暖房もこのお湯です。"

[[notes]]
id = "sundlaug"
items = ["sundlaugin", "eg_fer_i_sund", "fara_i_sund", "sundi"]
topics = ["daily"]
text = "The public pool is Iceland's version of the sentō: cheap, in every town, and where people meet. The rule is to wash thoroughly without a swimsuit before entering, and the signs show exactly which body parts; attendants do check. Treat it like a Japanese bath and you will be fine."
text_ja = "公営プールはアイスランドの銭湯です。安くて、どの町にもあって、人が集まる場所です。入る前に水着を脱いで全身を洗うのが決まりで、洗う部位を示した図まで貼ってあり、係の人が実際に見ています。日本の銭湯と同じ心構えで大丈夫です。"

[[notes]]
id = "heiti_potturinn"
items = ["heiti_potturinn", "er_heitur_pottur_herna"]
topics = ["daily"]
text = "The hot tub at the pool is where the news gets discussed, like a village square. Conversations between strangers are normal there, and it is fine to just sit and listen."
text_ja = "プールの露天の湯船は、井戸端会議の場です。知らない人同士が話し始めるのが普通で、黙って聞いているだけでもかまいません。"

[[notes]]
id = "vedur_smalltalk"
items = ["hvernig_er_vedrid", "thad_er_svo_kalt", "rok"]
topics = ["weather"]
text = "Weather is the safe topic here, as in Japan, but with more drama. «Rok» means a gale, and Icelanders say it the way you would say 'atsui desu ne': a greeting more than a complaint."
text_ja = "天気は日本と同じく無難な話題ですが、こちらはもっと劇的です。«rok»は強風のことで、「暑いですね」と言うのと同じ調子で、文句というよりあいさつとして口にします。"

[[notes]]
id = "thetta_reddast"
items = ["thetta_reddast"]
topics = ["discourse"]
text = "«Þetta reddast», it will work out, is the national attitude. It is roughly the opposite of Japanese advance planning: people commit first and sort out the details later, and things usually do work out."
text_ja = "«Þetta reddast»、なんとかなる、は国民的な合言葉です。日本の綿密な事前準備とはほぼ正反対で、まず決めてから細かいことは後で片付ける。そして実際たいてい何とかなります。"

[[notes]]
id = "jaeja"
items = ["jaeja"]
topics = ["discourse"]
text = "«Jæja» does the work of several Japanese words at once: «ja:sate», «ja:yare yare» and «ja:sō ka». Said with a rising tone it opens a topic; said falling, it politely ends a visit."
text_ja = "«Jæja»は日本語の「さて」「やれやれ」「そうか」を一語で引き受けます。上がり調子で言えば話題を切り出し、下がり調子で言えば「そろそろお暇します」の合図になります。"

[[notes]]
id = "nofn"
items = ["eg_heiti", "hvad_heitir_thu", "hae"]
topics = ["social"]
text = "Icelanders go by first names, even with the prime minister or a doctor. Surnames are patronymics: «Jónsdóttir» is 'Jón's daughter', so the phone book is sorted by first name. Don't reach for '-san'; the first name alone is polite."
text_ja = "アイスランド人は首相や医者に対してもファーストネームで呼び合います。姓は父親の名前から作る父称で、«Jónsdóttir» は「ヨウンの娘」という意味なので、電話帳も名前順です。「さん」に当たるものはなく、名前だけで十分に丁寧です。"

[[notes]]
id = "konur_nofn"
items = ["konan_min", "eg_er_gift", "vid_erum_gift"]
topics = ["family"]
text = "Icelandic women keep their own names when they marry, since surnames are patronymics anyway. Brother and sister from the same parents have different surnames: «Jónsson» and «Jónsdóttir»."
text_ja = "アイスランドの女性は結婚しても名前を変えません。姓がそもそも父称だからです。同じ両親の兄と妹でも姓が違い、«Jónsson» と «Jónsdóttir» になります。"

[[notes]]
id = "takk_fyrir_sidast"
items = ["takk_fyrir_sidast", "takk_fyrir_kvoldid"]
topics = ["greetings"]
text = "«Takk fyrir síðast», thanks for last time, is said when you next meet someone you spent an evening with. It is close to 'senjitsu wa arigatō gozaimashita', and just as expected."
text_ja = "«Takk fyrir síðast»、先日はどうも、は一緒に夜を過ごした相手に次に会ったときに言う言葉です。日本の「先日はありがとうございました」とほぼ同じで、同じくらい言うのが当然とされています。"

[[notes]]
id = "takk_fyrir_matinn"
items = ["takk_fyrir_matinn", "verdi_ther_ad_godu"]
topics = ["food"]
text = "«Takk fyrir matinn» after every meal works like 'gochisōsama'. Children learn it early, and the cook answers «verði þér að góðu»."
text_ja = "食後の«Takk fyrir matinn»は「ごちそうさま」そのものです。子どもは小さいうちに教わり、作った人は«verði þér að góðu»と返します。"

[[notes]]
id = "thjorfe"
items = ["eigdu_afganginn", "get_eg_fengid_reikninginn"]
topics = ["money"]
text = "There is no tipping in Iceland, just like in Japan. Service is in the price, and rounding up a taxi fare is the most anyone does."
text_ja = "アイスランドにはチップの習慣がなく、日本と同じです。サービス料は値段に含まれていて、タクシー代の端数を切り上げる程度が最大限です。"

[[notes]]
id = "kort"
items = ["tekurdu_kort", "eg_er_ekki_med_reidufe", "ma_eg_borga_med_korti"]
topics = ["money"]
text = "Iceland is nearly cashless. Even the hot dog stand takes cards, and many Icelanders have not touched a coin in years. It is the opposite of Japan, where cash still rules in small places."
text_ja = "アイスランドはほぼキャッシュレスです。ホットドッグの屋台でもカードが使え、何年も硬貨に触っていない人が大勢います。小さな店ほど現金が幅を利かせる日本とは逆です。"

[[notes]]
id = "kennitala"
items = ["hvar_er_thjodskra", "eg_er_ekki_med_kennitolu"]
topics = ["practical"]
text = "The «kennitala» is a ten-digit number, your birth date plus four digits, used for everything from the pharmacy to the gym. It is like My Number in Japan, except that people give it out freely."
text_ja = "«kennitala» は生年月日に4桁を足した10桁の個人番号で、薬局からジムまであらゆる場面で使います。日本のマイナンバーに当たりますが、こちらでは人に気軽に教えます。"

[[notes]]
id = "kaffi"
items = ["viltu_kaffi", "kaffi", "eg_drekk_kaffi"]
topics = ["cafe"]
text = "Coffee is offered the moment you step into an Icelandic home, and refusing takes effort. Icelanders are among the world's heaviest coffee drinkers, and refills are free in most cafés."
text_ja = "アイスランドの家に一歩入るとすぐコーヒーが出てきて、断るには少し努力が要ります。国民一人あたりのコーヒー消費量は世界有数で、カフェのおかわりはたいてい無料です。"

[[notes]]
id = "bjor"
items = ["bjor", "annan_bjor_takk"]
topics = ["cafe"]
text = "Beer was illegal in Iceland until the first of March 1989, and the date is still celebrated as Beer Day. Anything stronger than light beer is sold only in the state shop, «Vínbúðin», so don't look for it at the supermarket."
text_ja = "アイスランドでは1989年3月1日までビールが違法で、この日は今も「ビールの日」として祝われます。軽いビールより強い酒は国営の酒屋 «Vínbúðin» でしか買えないので、スーパーで探しても見つかりません。"

[[notes]]
id = "blaa_lonid"
items = ["eg_vil_fara_i_blaa_lonid"]
topics = ["travel"]
text = "The Blue Lagoon's milky water is run-off from a geothermal power plant, and it costs many times more than a public pool. Locals mostly go to their town pool instead."
text_ja = "ブルーラグーンの乳白色の湯は地熱発電所の排水で、料金は公営プールの何倍もします。地元の人はたいてい自分の町のプールに行きます。"

[[notes]]
id = "nordurljos"
items = ["nordurljosin", "eg_vil_sja_nordurljosin", "nordurljos"]
topics = ["nature"]
text = "Northern lights need a dark, clear sky, so the season runs from September to April. Reykjavík's street lights wash them out; locals drive twenty minutes out of town and check the forecast first."
text_ja = "オーロラには暗く晴れた空が必要で、季節は9月から4月です。レイキャビクの街灯では見えにくいので、地元の人は車で20分ほど郊外に出て、まず予報を確認します。"

[[notes]]
id = "midnætursol"
items = ["thad_er_bjart_uti", "thad_er_dimmt_uti", "eg_sef_illa"]
topics = ["nature"]
text = "In June the sun barely sets and people mow their lawns at midnight; blackout curtains are standard. In December it is up for about four hours, and that is when the coffee habit makes sense."
text_ja = "6月は太陽がほとんど沈まず、真夜中に芝を刈る人がいます。遮光カーテンは標準装備です。12月は日が出ているのが4時間ほどで、コーヒーの習慣にも納得がいきます。"

[[notes]]
id = "straeto"
items = ["strætó", "hvenaer_fer_straeto", "einn_mida_takk"]
topics = ["transport"]
text = "There is no train anywhere in Iceland, and the buses are called «strætó». You pay with the app or with exact change, because the driver gives none back. The Tokyo habit of trusting the timetable to the minute will be tested."
text_ja = "アイスランドには鉄道が一本もなく、バスは «strætó» と呼ばれます。支払いはアプリか釣り銭なしの現金で、運転手はお釣りを出しません。時刻表を分単位で信じる東京の習慣は試されるでしょう。"

[[notes]]
id = "vegir"
items = ["er_vegurinn_opinn", "vegurinn_er_lokadur"]
topics = ["transport"]
text = "Ring Road 1 circles the island in about 1,300 kilometres. Roads close in winter storms, and checking the road-conditions site before a drive is as normal as checking train delays in Tokyo."
text_ja = "国道1号線はおよそ1,300キロで島を一周します。冬の嵐で道路は閉鎖され、出発前に道路情報サイトを確認するのは、東京で電車の遅延を確認するのと同じくらい当たり前のことです。"

[[notes]]
id = "hestar"
items = ["hestur", "eg_a_islenskan_hest"]
topics = ["nature"]
text = "Icelandic horses have a fifth gait, the «tölt», and no other horse may enter the country; one that leaves may never return. Never call them ponies."
text_ja = "アイスランドの馬には«tölt»（トルト）という五つ目の歩法があり、外国の馬は一頭も持ち込めず、一度島を出た馬は二度と戻れません。決して「ポニー」と呼ばないでください。"

[[notes]]
id = "kindur"
items = ["kind", "lambakjot"]
topics = ["nature", "food"]
text = "Sheep outnumber people two to one and roam free all summer. In September farmers gather them from the highlands in the «réttir», a communal round-up that ends with singing and a great deal of lamb soup."
text_ja = "羊は人の二倍いて、夏の間は放し飼いです。9月には農家が高地から羊を集める«réttir»があり、地域総出の羊集めは歌とラムのスープで締めくくられます。"

[[notes]]
id = "hakarl"
items = ["hakarl", "hefurdu_smakkad_hakarl"]
topics = ["food"]
text = "«Hákarl» is Greenland shark, fermented for months because fresh it is poisonous. It is eaten in tiny cubes with a shot of «brennivín», mostly at the midwinter feast «Þorrablót». Think of it as Iceland's nattō, only stronger."
text_ja = "«Hákarl»（ハウカルトル）はニシオンデンザメを数か月発酵させたもので、生では毒があります。小さなさいの目にして蒸留酒«brennivín»（ブレニヴィン）と一緒に、主に真冬の祭り «Þorrablót» で食べます。アイスランドの納豆だと思ってください。ただし、もっと強烈です。"

[[notes]]
id = "skyr"
items = ["skyr"]
topics = ["food"]
text = "«Skyr» looks like yoghurt but is technically a cheese, and Icelanders have eaten it for a thousand years. It is high in protein and low in fat, eaten with milk and sugar or berries."
text_ja = "«Skyr»（スキール）はヨーグルトに見えますが分類上はチーズで、アイスランド人は千年前から食べています。高タンパクで低脂肪、牛乳と砂糖、あるいはベリーをかけて食べます。"

[[notes]]
id = "fiskur"
items = ["fisk", "plokkfisk", "thorsk"]
topics = ["food"]
text = "Fish built Iceland's economy, and the 'cod wars' with Britain in the 1970s were fought over fishing limits. «Plokkfiskur», fish and potatoes mashed in a white sauce, is the nation's Tuesday dinner."
text_ja = "魚がアイスランド経済を築きました。1970年代の英国との「タラ戦争」は漁業水域をめぐる争いです。魚とじゃがいもをホワイトソースで和えた«Plokkfiskur»（プロックフィスクル）は、この国の火曜日の定番の夕食です。"

[[notes]]
id = "islenska"
items = ["islensku", "eg_er_ad_laera"]
topics = ["clarifying"]
text = "Icelandic has changed so little that schoolchildren read thousand-year-old sagas. The letters þ and ð are the two 'th' sounds of English 'thin' and 'this'. Like Japanese, it prefers to coin its own words: a computer is «tölva», from «tala», number, and «völva», prophetess."
text_ja = "アイスランド語はほとんど変化していないので、小学生が千年前のサガを読めます。þ と ð は英語の thin と this の二つの th の音です。日本語と同じく外来語より造語を好み、コンピューターは«tölva»、数を表す«tala»と巫女を表す«völva»の合成語です。"

[[notes]]
id = "enska"
items = ["talar_thu", "eg_tala_sma_islensku"]
topics = ["clarifying"]
text = "Almost everyone under sixty speaks English well, and many switch the moment they hear an accent. Saying «ég er að læra íslensku» usually makes them switch back: people are pleased that anyone tries."
text_ja = "60歳以下のほぼ全員が英語を上手に話し、訛りを聞くとすぐ英語に切り替える人も多いです。«ég er að læra íslensku»と言うと、たいてい戻してくれます。挑戦する人を喜んでくれるのです。"

[[notes]]
id = "tolur"
items = ["einn", "tveir", "klukkan_er"]
topics = ["numbers"]
text = "The numbers one to four change with the gender of what you count: «einn», «ein», «eitt» for 'one'. Icelanders understand any form, so say the one you remember and move on. For the clock, use the neuter: «eitt», «tvö», «þrjú», «fjögur»."
text_ja = "1から4は数えるものの性で形が変わり、「1」は«einn»、«ein»、«eitt»になります。どの形でも通じるので、覚えている形で言って先に進みましょう。時刻には中性形の«eitt»、«tvö»、«þrjú»、«fjögur»を使います。"

[[notes]]
id = "sumarfri"
items = ["eg_er_i_frii", "um_helgina", "eg_er_i_frii_a_morgun"]
topics = ["work"]
text = "Summer holidays are sacred: most people take three or four weeks in July and offices go quiet. Many work a 36-hour week, and leaving on time is normal, not a sign of low commitment."
text_ja = "夏休みは神聖です。多くの人が7月に3〜4週間休み、オフィスは静まり返ります。週36時間勤務も多く、定時に帰るのは普通のことで、やる気がないとは見なされません。"

[[notes]]
id = "jolasveinar"
items = ["barn", "strakur", "stelpa"]
topics = ["family"]
text = "Icelandic children are visited by thirteen Yule Lads, one each night before Christmas. Each leaves a small gift in a shoe on the windowsill, or a potato if the child misbehaved."
text_ja = "アイスランドの子どもたちはクリスマス前の13夜、毎晩一人ずつやってくる13人の「ユールラッズ」の訪問を受けます。窓辺の靴に小さな贈り物を、悪い子にはじゃがいもを置いていきます。"

[[notes]]
id = "kurteisi"
items = ["hae", "nagranni_minn", "gjordu_svo_vel"]
topics = ["greetings"]
text = "Greetings are informal: «hæ» works with a shop assistant, a professor or a stranger, and there is no honorific language like keigo. Politeness comes from tone, from «gjörðu svo vel», and from saying «takk» a lot."
text_ja = "あいさつはくだけています。«hæ»は店員にも教授にも知らない人にも使え、日本の敬語のような体系はありません。丁寧さは声の調子と«gjörðu svo vel»、そして何度も言う«takk»で伝えます。"

[[notes]]
id = "rod"
items = ["taktu_numer", "hvar_er_bidrodin"]
topics = ["practical"]
text = "Icelanders queue loosely and take a number at the bank or pharmacy. In a crowd you will see less of the neat line you know from Tokyo, but nobody pushes."
text_ja = "アイスランド人はゆるく並び、銀行や薬局では番号札を取ります。人混みでは東京で見るような整然とした列は少ないですが、押す人はいません。"

[[notes]]
id = "eldgos"
items = ["thad_er_gos", "eldfjall", "hraun"]
topics = ["nature"]
text = "Iceland sits on the split between the American and Eurasian plates, so it has volcanoes and earthquakes for the same reason Japan does. The eruptions on the Reykjanes peninsula since 2021 became weekend outings, until the lava reached a town."
text_ja = "アイスランドは北米プレートとユーラシアプレートの境目にあり、日本と同じ理由で火山と地震があります。2021年からのレイキャネス半島の噴火は、溶岩が町に達するまでは週末の見物先になっていました。"

[[notes]]
id = "vedurspa"
items = ["hvernig_verdur_vedrid_a_morgun", "ertu_med_regnhlif"]
topics = ["weather"]
text = "The forecast site vedur.is is on every phone, and the joke is that if you don't like the weather, wait five minutes. Layers, not umbrellas: the wind turns umbrellas inside out within a block."
text_ja = "天気予報サイト vedur.is は全員の携帯に入っていて、「天気が気に入らなければ5分待て」というのが定番の冗談です。傘ではなく重ね着です。風で傘は一区画も持たずに裏返ります。"

[[notes]]
id = "huldufolk"
items = ["fjall", "utsynid_er_fallegt"]
topics = ["nature"]
text = "Some road plans have been altered around rocks said to house the hidden people, the «huldufólk». Few Icelanders will say they believe in them, and few will say they don't. It is not far from the feeling around a shrine in a Japanese forest."
text_ja = "「隠れた人々」«huldufólk»（フルドゥフォルク）が住むとされる岩を避けて、道路計画が変更されたことがあります。信じると言い切るアイスランド人は少ないですが、信じないと言い切る人も少ないです。日本の森の神社のあたりで感じる気配に近いものです。"

[[notes]]
id = "jolabokaflod"
items = ["bokum", "eg_er_ad_lesa_goda_bok", "eg_les"]
topics = ["hobbies"]
text = "Most books are published in November for the «jólabókaflóð», the Christmas book flood. The traditional gift on Christmas Eve is a book, read that same night in bed, ideally with chocolate."
text_ja = "本の多くは11月に出版され、「クリスマスの本の洪水」«jólabókaflóð»（ヨウラボウカフロウズ）と呼ばれます。クリスマスイブの定番の贈り物は本で、その夜のうちにベッドで、できればチョコレートと一緒に読みます。"

[[notes]]
id = "timi"
items = ["eg_er_sein", "klukkan_hvad", "eg_kem_eftir_tiu_minutur"]
topics = ["arrangements"]
text = "Icelanders are relaxed about time compared with Japan: ten minutes late to a friend's house is nothing, and a party at eight starts at nine. Buses and flights, though, leave on the minute."
text_ja = "アイスランド人は日本に比べて時間にのんびりしています。友達の家に10分遅れるのは何でもなく、8時のパーティーは9時に始まります。ただしバスと飛行機は分単位で出発します。"

[[notes]]
id = "afmaeli"
items = ["til_hamingju"]
topics = ["social"]
text = "Birthdays are celebrated with a sweet-and-savoury table at home, and it is the birthday person who bakes for colleagues. The logic is the same as bringing omiyage back to the office."
text_ja = "誕生日は家で甘いものと塩気のものを並べたテーブルで祝い、職場に焼き菓子を持っていくのは誕生日の本人です。旅行のお土産を職場に配るのと同じ理屈です。"

[[notes]]
id = "kvoldmatur"
items = ["eg_borda_hadegismat", "eg_elda_kvoldmat", "maturinn_er_tilbuinn"]
topics = ["daily"]
text = "Dinner is early, around six or seven, and the working day ends in time for it. The big meal of the week is Sunday lunch, often roast lamb, with the whole family."
text_ja = "夕食は6時か7時と早く、仕事もそれに間に合うように終わります。一週間で一番のごちそうは日曜のお昼で、家族全員でローストラムを食べることが多いです。"

[[notes]]
id = "laeknir"
items = ["eg_tharf_laekni", "hvar_er_naesta_apotek"]
topics = ["health"]
text = "Healthcare is public and mostly cheap, but you see a general doctor at a health centre first, not a specialist. Pharmacies sell few medicines without a prescription, so bring your usual ones from Japan."
text_ja = "医療は公的でおおむね安いですが、まず保健センターの一般医にかかり、専門医には直接行きません。薬局で処方箋なしに買える薬は少ないので、いつもの薬は日本から持ってきてください。"

[[notes]]
id = "ull"
items = ["peysu", "er_thetta_ull", "er_thetta_islenskt"]
topics = ["shopping"]
text = "The «lopapeysa», the patterned wool sweater, dates only from the 1950s but is worn as if ancient. Real ones are hand-knitted from unwashed Icelandic wool, which is why they shrug off rain and cost a month's coffee budget."
text_ja = "模様編みのウールセーター«lopapeysa»（ロパペイサ）は1950年代に生まれたものですが、まるで古来のもののように着られています。本物は洗っていないアイスランド羊毛を手編みしたもので、だから雨をはじき、値段はひと月分のコーヒー代くらいします。"

[[notes]]
id = "fjolskylda"
items = ["eg_a_tvo_born", "attu_born", "fjolskyldan_min"]
topics = ["family"]
text = "Icelandic families are large by Japanese standards and children arrive early, often before marriage, which raises no eyebrows. Grandparents nearby do a lot of the childcare, and a baby at a café is unremarkable."
text_ja = "アイスランドの家族は日本の基準では大所帯で、子どもは早く、結婚前に生まれることも多く、誰も眉をひそめません。近くに住む祖父母が子育ての多くを担い、カフェに赤ん坊がいるのはごく普通です。"

[[notes]]
id = "fyrsta_nafn_kennari"
items = ["kennari", "skolinn", "eg_er_i_skola"]
topics = ["work"]
text = "Pupils call teachers by their first names, and school starts at six with no uniforms and no entrance exams until university. Swimming lessons are compulsory, which is why every Icelander can swim."
text_ja = "生徒は先生をファーストネームで呼び、学校は6歳から、制服はなく、大学まで入学試験もありません。水泳の授業は必修で、だからアイスランド人は全員泳げます。"
