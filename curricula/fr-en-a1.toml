# French for English speakers — survival A1.
# Items are listed in the default order of introduction. The planner may reorder
# to respect prereqs and topic filters. See docs/CURRICULUM.md for the format.

[curriculum]
name = "French A1 — café, street, hotel"
target_lang = "fr"
known_lang = "en"
level = "A1"

# ---------------------------------------------------------------- greetings

[[items]]
id = "bonjour"
kind = "phrase"
target = "Bonjour."
meaning = "Hello."
difficulty = 1
topics = ["greetings"]
situation = "You walk into a bakery in the morning. Greet the baker."

[[items]]
id = "merci"
kind = "phrase"
target = "Merci."
meaning = "Thank you."
difficulty = 1
topics = ["greetings"]
situation = "The waiter brings your coffee. Thank him."

[[items]]
id = "sil_vous_plait"
kind = "phrase"
target = "S'il vous plaît."
meaning = "Please."
difficulty = 3
topics = ["greetings", "cafe"]
chunks = ["plaît", "vous plaît", "S'il vous plaît."]
pronunciation_notes = "The 't' at the end is silent: seel-voo-PLEH."

[[items]]
id = "au_revoir"
kind = "phrase"
target = "Au revoir."
meaning = "Goodbye."
difficulty = 2
topics = ["greetings"]
situation = "You are leaving the shop. Say goodbye."

[[items]]
id = "oui"
kind = "vocab"
target = "Oui."
meaning = "Yes."
difficulty = 1
topics = ["greetings"]

[[items]]
id = "non"
kind = "vocab"
target = "Non."
meaning = "No."
difficulty = 1
topics = ["greetings"]

[[items]]
id = "excusez_moi"
kind = "phrase"
target = "Excusez-moi."
meaning = "Excuse me."
difficulty = 2
topics = ["greetings", "directions"]
situation = "You need to get a stranger's attention in the street."

