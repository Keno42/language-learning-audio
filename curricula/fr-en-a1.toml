examples = [
  { source = "Je comprends.", source_meaning = "I understand.", result = "Je ne comprends pas.", result_meaning = "I don't understand." },
  { source = "Je parle anglais.", source_meaning = "I speak English.", result = "Je ne parle pas anglais.", result_meaning = "I don't speak English." },
  { source = "C'est loin.", source_meaning = "It's far.", result = "Ce n'est pas loin.", result_meaning = "It's not far." },
  { source = "Je suis en vacances.", source_meaning = "I'm on holiday.", result = "Je ne suis pas en vacances.", result_meaning = "I'm not on holiday." },
  { source = "Je pars demain.", source_meaning = "I'm leaving tomorrow.", result = "Je ne pars pas demain.", result_meaning = "I'm not leaving tomorrow." },
]

# ---------------------------------------------------------------- dialogues

[[dialogues]]
id = "cafe_seat"
setting = "You are in a café. There is one free chair at a table where a woman is sitting."
topics = ["cafe", "social"]
requires = ["je_suis_en_vacances", "oui"]

  [[dialogues.turns]]
  cue = "Ask whether this seat is free."
  expect = "cette_place_est_libre"
  partner = "Oui, bien sûr. Vous êtes d'où ?"
  partner_meaning = "Yes, of course. Where are you from?"

  [[dialogues.turns]]
  cue = "Tell her that you come from Japan."
  expect = "je_viens_du_japon"
  partner = "Ah, le Japon ! Vous êtes en vacances ?"
  partner_meaning = "Ah, Japan! Are you on holiday?"

  [[dialogues.turns]]
  cue = "Say yes, you're on holiday."
  expect_text = "Oui, je suis en vacances."
  expect_meaning = "Yes, I'm on holiday."
  partner = "Bienvenue à Paris !"
  partner_meaning = "Welcome to Paris!"

  [[dialogues.turns]]
  cue = "Thank her."
  expect = "merci"

[[dialogues]]
id = "cafe_order"
setting = "A waiter comes to your table."
topics = ["cafe"]
requires = ["bonjour", "je_voudrais", "un_cafe", "sil_vous_plait", "non", "merci", "au_revoir"]

  [[dialogues.turns]]
  opener = "Bonjour. Vous désirez ?"
  opener_meaning = "Hello. What would you like?"
  cue = "Greet him and order a coffee, please."
  expect_text = "Bonjour. Je voudrais un café, s'il vous plaît."
  expect_meaning = "Hello. I would like a coffee, please."
  partner = "Avec du lait ?"
  partner_meaning = "With milk?"

  [[dialogues.turns]]
  cue = "Say: no, thank you."
  expect_text = "Non, merci."
  expect_meaning = "No, thank you."
  partner = "Très bien."
  partner_meaning = "Very well."

  [[dialogues.turns]]
  cue = "Later. Ask for the bill."
  expect = "l_addition"
  partner = "Voilà. Quatre euros."
  partner_meaning = "Here you are. Four euros."

  [[dialogues.turns]]
  cue = "Thank him and say goodbye."
  expect_text = "Merci. Au revoir."
  expect_meaning = "Thank you. Goodbye."

[[dialogues]]
id = "street_directions"
setting = "You are lost in the street. A man walks by."
topics = ["directions", "clarifying"]
requires = ["excusez_moi", "ou_est", "le_metro"]

  [[dialogues.turns]]
  cue = "Get his attention and ask where the metro is."
  expect_text = "Excusez-moi, où est le métro ?"
  expect_meaning = "Excuse me, where is the metro?"
  partner = "Le métro ? C'est tout droit, puis à gauche."
  partner_meaning = "The metro? It's straight ahead, then on the left."

  [[dialogues.turns]]
  cue = "You didn't catch that. Ask him to speak more slowly."
  expect = "plus_lentement"
  partner = "Tout droit… puis à gauche."
  partner_meaning = "Straight ahead… then on the left."

  [[dialogues.turns]]
  cue = "Ask if it's far."
  expect = "c_est_loin"
  partner = "Non, cinq minutes."
  partner_meaning = "No, five minutes."

  [[dialogues.turns]]
  cue = "Thank him."
  expect = "merci"

[[dialogues]]
id = "hotel_reception"
setting = "Evening, at the hotel reception. The receptionist looks up."
topics = ["hotel", "arrangements", "clarifying"]
requires = ["je_pars", "demain", "merci", "au_revoir"]

  [[dialogues.turns]]
  opener = "Bonsoir."
  opener_meaning = "Good evening."
  cue = "Ask if she speaks English."
  expect = "parlez_vous_anglais"
  partner = "Un peu. Vous partez quand ?"
  partner_meaning = "A little. When are you leaving?"

  [[dialogues.turns]]
  cue = "Say you're leaving tomorrow."
  expect_text = "Je pars demain."
  expect_meaning = "I'm leaving tomorrow."
  partner = "D'accord. Le taxi est à huit heures, ça va ?"
  partner_meaning = "OK. The taxi is at eight, is that alright?"

  [[dialogues.turns]]
  cue = "Say you don't understand."
  expect = "je_ne_comprends_pas"
  partner = "Le taxi… demain… huit heures."
  partner_meaning = "The taxi… tomorrow… eight o'clock."

  [[dialogues.turns]]
  cue = "Say OK, and thank her."
  expect_text = "D'accord. Merci."
  expect_meaning = "OK. Thank you."
  partner = "Bonne soirée !"
  partner_meaning = "Have a good evening!"
